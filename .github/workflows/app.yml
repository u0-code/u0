# Ghost.app, built with bundle.sh and published: each push to main replaces
# the rolling `nightly` prerelease, and each tag v* is released, with the
# cask for it committed to main. Casks/ installs either with Homebrew.
name: app

on:
  push:
    branches: [main]
    tags: ["v*"]

# A newer push to main replaces a build still running for an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  app:
    # Apple silicon, with Xcode 16, whose metal compiler builds GPUI's shaders.
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - run: brew install librsvg
      # The toolchain rust-toolchain.toml names.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: ./bundle.sh

      # Deleted and made again, so that the tag moves to this commit and the
      # one asset is this build.
      - name: nightly
        if: github.ref == 'refs/heads/main'
        run: |
          ditto -c -k --keepParent target/release/Ghost.app Ghost-macos-arm64.zip
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly Ghost-macos-arm64.zip --prerelease --target "$GITHUB_SHA" \
            --title "Ghost nightly ${GITHUB_SHA::7}" \
            --notes "Built from $GITHUB_SHA on main. Not a release: what main is now."

      # A push made with this workflow's token starts no workflow, so the
      # cask's commit builds no nightly.
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=${GITHUB_REF_NAME#v}
          grep -qx "version = \"$version\"" Cargo.toml || { echo "Cargo.toml is not at $version"; exit 1; }
          zip=Ghost-$version-macos-arm64.zip
          ditto -c -k --keepParent target/release/Ghost.app "$zip"
          case $version in *-*) pre=true ;; *) pre=false ;; esac
          gh release create "$GITHUB_REF_NAME" "$zip" --prerelease="$pre" --title "Ghost $version" --generate-notes
          git fetch --depth 1 origin main
          git checkout -B main FETCH_HEAD
          sed -i '' -e "s/^  version \".*\"/  version \"$version\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$(shasum -a 256 "$zip" | cut -d ' ' -f 1)\"/" Casks/ghost.rb
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qam "build: the cask installs Ghost $version"
          git push origin main
