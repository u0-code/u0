# What `just check` runs. Kept small on purpose: the repository is private,
# so every minute counts against the month's allowance, and a minute on
# macOS, where the app has to be built, counts ten times.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    # Mondays, 03:17 UTC. New advisories arrive without anyone pushing.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request makes the older run pointless. Runs on
  # main are each kept: they say which commit broke it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # One job, one build: the lints and the tests share what they compile.
  check:
    name: format, lints, tests, docs
    # The app is built on GPUI, which is macOS first.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The toolchain named in rust-toolchain.toml, with rustfmt and clippy.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Pull requests read the cache that main wrote, and write none.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # No test needs a network, a key or a container.
      - run: cargo test --locked
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # Seconds each: nothing is compiled.
  hygiene:
    name: dependencies, spelling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      - uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2

  # One name to require in the branch's protection, whatever the jobs above
  # are called this month. A job that was not meant to run counts as passed.
  ok:
    name: ok
    if: always()
    needs: [check, hygiene]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check that ran passed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "$results"
          for result in $results; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
