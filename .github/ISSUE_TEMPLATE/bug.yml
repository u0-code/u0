name: Something is wrong
description: u0 did something it should not have, or showed an agent wrongly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Which agent
      description: Its name and version, as its page in u0 shows them.
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit, or the release.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: "`RUST_LOG=u0_desk=debug` output around the moment, with anything private removed."
      render: text
