name: An idea
description: Something u0 should do, or do differently.
labels: [idea]
body:
  - type: textarea
    id: what
    attributes:
      label: What, and for whom
      description: What a person running their agents through u0 would notice.
    validations:
      required: true
  - type: textarea
    id: agents
    attributes:
      label: Which agents
      description: Does it need something only some agents offer over ACP? Say which.
