# What every dependency has to satisfy. Checked by `just deny`.

[graph]
all-features = true

[advisories]
# A known vulnerability or an unmaintained crate anywhere in the tree fails
# the check. Exceptions go here by id, with the reason.
ignore = [
    # Unmaintained, not vulnerable, and only beneath the interface's crates,
    # which pick them; none is named by the workspace.
    # Zed's gpui: text shaping and its time.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, under gpui's text" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz, under gpui's text" },
    { id = "RUSTSEC-2026-0543", reason = "chrono, under gpui" },
    # gpui-kit: its base, its components and its assets.
    { id = "RUSTSEC-2024-0384", reason = "instant, under gpui-kit's base" },
    { id = "RUSTSEC-2024-0436", reason = "paste, under gpui-kit's components" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile, under gpui-kit's assets" },
    { id = "RUSTSEC-2025-0141", reason = "bincode, under syntect, gpui-kit's highlighting" },
    # Linux's D-Bus (the keyring, accessibility) in the tree for every target.
    { id = "RUSTSEC-2026-0370", reason = "zvariant, under oo7 and zbus" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, under atspi and zbus" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, under zbus" },
]

[licenses]
# Licences that can be combined with Apache-2.0 without asking more of
# whoever ships the result than it does.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # In GPUI's tree. MPL-2.0 is copyleft only for its own files, which are
    # used unchanged; CC0, and 0BSD in gpui-kit's, ask less than Apache-2.0.
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
]
confidence-threshold = 0.9
# The certificates rustls-platform-verifier carries where there is no
# system to ask (wasm32), which Ghost is never built for.
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

[bans]
# Two versions of one crate are a cost, not an error.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# crates.io, and the git sources Cargo.toml patches in until their fixes
# are released: the gpui-kit branch, and the Zed branch gpui-pre comes from.
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/mizorewww/gpui-kit",
    "https://github.com/mizorewww/zed",
]
