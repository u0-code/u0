# What every dependency has to satisfy. Checked by `just deny` and in CI.

[graph]
all-features = true

[advisories]
# A known vulnerability or an unmaintained crate anywhere in the tree fails
# the check. Exceptions go here by id, with the reason.
ignore = []

[licenses]
# Licences that can be combined with Apache-2.0 without asking more of
# whoever ships the result than it does.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate are a cost, not an error.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# crates.io and nothing else: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
