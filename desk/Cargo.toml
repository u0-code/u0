[package]
name = "ghost-desk"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
description = "Ghost Desk: a console for ghostd. Her presence, her journal, her work, a place to talk, and the characters a daemon runs."
publish = false

# Its own workspace: GPUI is a large, macOS-first tree, and the rest of Ghost
# builds and is checked without it. It is a client of the daemon like any
# presence, through ghost-link, and never touches a ghost's files.
[workspace]

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }
ghost-link = { path = "../crates/ghost-link" }
# Every HTTP request a Ghost program makes leaves through it: the desk asks
# a brain's API which models it has, and tests a key, the same way.
ghost-net = { path = "../crates/ghost-net" }
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
dotenvy = "0.15"
toml_edit = "0.22"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-segmentation = "1"

# To give the running app its icon in the Dock: AppKit, by way of the same
# crate GPUI uses for it.
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
match_same_arms = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# Colours read as the six hex digits a designer writes, not as a u32.
unusual_byte_groupings = "allow"

# Stripped, and nothing more: that is two thirds of what the main
# workspace's profile saves here (11.2 to 9.3 MB, against 8.3), and a
# rebuild after a change to one file stays at about 11 seconds rather than
# 35, which matters while the app is changed and bundled many times a day.
[profile.release]
strip = true
