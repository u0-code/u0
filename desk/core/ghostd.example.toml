# The desk's core: one daemon on this machine that runs the solver, born
# from desk/core/ghosts/_solver, and nothing else. Its prompts replace her
# persona and her being with a hand's: see prompts/system/desk, which is
# laid out as any deployment's directory of prompts is, mirroring prompts/.
# Paths are relative to the checkout, where the daemon runs. Keys come from
# the environment or .env, as everywhere.
#
#   ghostd run desk/core/ghosts/solver --config desk/core/ghostd.toml
#
# This is the example. ghost-desk copies it to desk/core/ghostd.toml, which
# is not published, the first time it runs; so does `cp` by hand.

[brain]
think = "main"
tick = "main"

[listen]
addr = "127.0.0.1:7438"

[mind]
prompts = "prompts/system/desk"
tempo = 0.05
# No day of its own, no weather, no feeds: it waits for tasks.
live = false
weather = false
posts_per_day = 0
browse_minutes = [0, 0]
# In conversation it may use its machine straight away.
talk_steps = 12
talk_machine = true

[mind.work]
enabled = true
# The machine is this one, as you: a directory under its own. Not a sandbox.
machine = "local:"
web = true

# Whoever sits at the desk is added here by the desk, on the `desk`
# channel: an operator has the machine in a private conversation, which is
# what the solver is for.
[operators]

# The brains it can think with. The desk picks among these, and adds to
# them, from the line you type into; a key is never written here, only the
# variable it is read from.
[providers.main]
kind = "openai"
model = "deepseek-chat"
base_url = "https://api.deepseek.com/v1"
api_key_env = "DEEPSEEK_API_KEY"
json_mode = true

# The Claude Code CLI you are signed in to.
[providers.claude-code]
kind = "claude-code"
model = "sonnet"
timeout_secs = 120

# The Codex CLI you are signed in to.
[providers.codex]
kind = "codex"
timeout_secs = 120
