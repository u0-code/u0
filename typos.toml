# Spelling, checked by `just typos`.

[files]
extend-exclude = [
    "Cargo.lock",
    "assets/",
    # An agent's answer, recorded as it said it.
    "crates/core/src/fixtures/",
]

[default]
extend-ignore-re = [
    # Hashes, seals and ids are not words.
    "\\b[0-9a-f]{8,}\\b",
    # The window's words in other languages (locales/app.yml); their English
    # keys are checked.
    "(?m)^  (zh-CN|de|es|fr|ja|ko|pt-BR|ru|sv): .*$",
]

[default.extend-words]
# Linear's filter for "not in".
nin = "nin"
# A simulator's id, as Xcode names it.
udid = "udid"
