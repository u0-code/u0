# ghostd.toml: which brains she runs on, where the daemon listens, and how she
# paces herself.
#
# Copy to ./ghostd.toml or ~/.config/ghost/ghostd.toml. This file is about the
# body, not the person: it never lives inside a ghost directory.

[brain]
# Provider used for conversation and reflection.
think = "anthropic"
# Provider used for the routine ticks of her day and for skimming chatter
# nobody addressed to her. Cheap is fine.
tick = "anthropic"

# Where presences and consoles connect. Listening beyond 127.0.0.1 requires a
# token in the named environment variable.
[listen]
addr = "127.0.0.1:7437"
token_env = "GHOSTD_TOKEN"
# Web origins allowed to connect besides pages served from this machine.
# origins = ["https://console.example"]

# How every request leaves this machine: her brains, her web tools, the
# weather, and the programs she starts. This replaces setting NO_PROXY by
# hand around a local proxy that stalls long streamed answers.
#   proxy   "system" (the default): HTTPS_PROXY, HTTP_PROXY and NO_PROXY, as
#           before; "none"; or an HTTP proxy, "http://127.0.0.1:7890".
#   direct  hosts that never use the proxy: "api.deepseek.com" is that host,
#           "*.deepseek.com" is it and every name under it. This machine's
#           own addresses never use one.
# GHOST_PROXY and GHOST_DIRECT (comma-separated) in the environment or .env
# override these two, one at a time; the presences read only those. A proxy
# with a password goes there, not here. Model APIs and platforms follow this
# and nothing else; her own search and fetch try the other way once when a
# site cannot be reached or turns them away, and remember what worked.
# [network]
# proxy = "http://127.0.0.1:7890"
# direct = ["*.deepseek.com"]

[mind]
# The pace she lives at. 1.0 is human: she notices messages after seconds or
# minutes depending on what she is doing, and types at a person's speed.
# 0.1 is good for a demo. 0 removes every wait and lets her answer in her
# sleep; use it only while developing.
tempo = 1.0
# Longest thing a brain may write back for one deliberation, in tokens.
max_tokens = 2000
# How many messages of a conversation she sees when she looks at it. Once
# twice as many have gone by, she writes down what to keep of the older part
# and sees that note above the recent ones.
thread_window = 40
# What she does in a conversation is tool calls, where her brain can take
# them: she can search her memory or the web before answering, and a call
# she gets wrong comes back to her. Off, it is one JSON reply.
talk_tools = true
# Turns in one look at a conversation, and seconds one search, page,
# picture or command may take in it. Anything bigger is taken on as work.
talk_steps = 8
talk_tool_seconds = 30
# Her machine in a conversation, as at work, in private and only with a
# friend or closer. Needs [mind.work] machine.
talk_machine = true
# Ceiling on brain calls per hour. 0 means no ceiling.
calls_per_hour = 120
# Run the life engine: plan her days, live through them, reflect at night.
live = true
# Look up the real weather where she lives (open-meteo.com, no key).
weather = true
# Most public posts in a day, and minutes between phone sessions on channels
# that have a feed. [0, 0] turns scrolling off.
posts_per_day = 3
browse_minutes = [45, 150]
# What she does in public beyond posting. Both are off by default because of
# what platforms allow an automated account: X forbids automated likes, and
# allows automated replies only to people who wrote to the account first.
# Replies to mentions always work. Turn these on only where the platform's
# rules, or its written approval, let you.
public_likes = false
public_replies = false
# Read every post over before it goes out, as herself: for anything she was
# told in private, anything that contradicts what is true of her, and whether
# it is worth posting at all. One extra call to the `tick` brain per post.
gate = true
# Hours between asking a channel how her posts are doing. 0 is never.
measure_hours = 12
# The deployment's directory of prompts, overriding the built-in ones for
# every character this daemon runs: any of the files `ghostd prompts export`
# writes. Everything in it is shared: the persona template, her being, the
# logic of her day and her work. What makes a character herself is her
# ghost.toml, and a ghost's own directory holds no prompts (ghostd warns
# about any it finds there and does not use them). A changed file is taken
# in without a restart; `ghostd prompts list` says where each prompt in use
# comes from.
# prompts = "prompts"

# Taking things on: work that needs more than one thought, done in sittings
# in her own time. It needs a brain that can run tools: any API provider, or
# the claude-code relay.
[mind.work]
enabled = true
# Where her shell and files are. Without one she can look things up and think
# and nothing else, which is the safe default.
#   "docker:<container>"  a running container. Use this on a server.
#   "local:<directory>"   a directory under her own, on this machine, as you.
#                         Not a sandbox: only for a machine that is hers.
# machine = "docker:ghost-lin"
# workdir = "/home/lin"
# Let her search and read the web while working. Search uses DEEPSEEK_API_KEY,
# BRAVE_API_KEY or SEARXNG_URL, whichever is set first.
web = true
# When work runs.
#   "always"  on her machine, apart from her day: sittings run while she is
#             asleep, talking or reading, looking at her phone does not stop
#             one, and a conversation does not wait for work. A sitting that
#             runs out of steps or minutes is followed at once by the next.
#   "awake"   only while she is awake and not talking, as something she sits
#             down to: reading a message stops the sitting after its step,
#             and she rests between sittings.
runs = "always"
# How many pieces of work may have a sitting running at once. Work an
# operator directed goes first, then whatever has waited longest. Each
# sitting that starts takes one call from calls_per_hour, and none starts
# while that is spent.
at_once = 2
# One sitting is at most this many steps or minutes. A piece of work rests
# this long between sittings, except a sitting that ran out of steps or time
# with runs = "always"; after max_sittings it is let go.
sitting_steps = 40
sitting_minutes = 15
rest_minutes = 10
max_sittings = 12
# A piece of work can be handed out in parts, each done by a worker of its
# own alongside her while her sitting runs. At most this many run at once,
# and each may take this many steps over all the sittings it runs in.
parts = 4
part_steps = 200
# Things she will take on in a day.
per_day = 4
# Once she has put into words something she is after, she may take a piece
# of work on toward it without being asked: at most one every this many
# days, and only when nothing of her own is in hand. 0 is never.
pursue_days = 2
# In the middle of work she can stop and ask whoever it is for. If nobody
# answers within this many hours she goes on with her own judgement.
ask_hours = 24
# How large her working context may grow before it is trimmed, in tokens.
# Left out, it is most of the model's context window: she keeps what she has
# seen in front of her for longer, and each step reads more. Set it to cap
# what a long piece of work costs.
# context_tokens = 200000
# Days between the times she sits down, unasked, to look at how her public
# writing is going and decide what to try next. 0 is never. Needs a channel
# that reports how her posts are doing, and at least five posts to look at.
review_days = 7

# The people who run her, for testing and operating her. A message from one
# of these accounts that begins with the prefix is a directive: she carries
# it out at once, whatever her day is, without deciding whether to, in her
# own voice; each one is written into her journal as `directed`. Everyone
# else, and these accounts without the prefix, she answers as herself.
#
# The prefix alone is not trusted. The same words from any other account are
# an ordinary message, so what makes a directive is the account it came
# from: list only accounts you control. Each key is a channel's name, as its
# presence connects under it; each id is an account as that presence reports
# it. On QQ that is the OpenID the bot is given, which differs between a
# private chat and a group: list both to direct her in both. An id is only
# as sure as the channel that reports it: the terminal takes whatever name it
# is started with, so a `term` operator is whoever can reach this daemon.
#
# Once a day, at `report`, in her own timezone, she comes to mean to tell each
# operator what she has done and seen since she last told them: what she
# looked up, opened and kept, work that ended, what she posted, who she met
# and where she talked. It is said as herself, in a private conversation she
# already has with that account, and like anything else she means to do it
# waits until she is awake and free. An operator she has never talked with in
# private gets no report: she never writes first to a stranger. What people
# told her in private is not passed on. An empty string turns reports off.
# [operators]
# prefix = "fox:"        # the default; case and a full-width colon do not matter
# report = "21:00"       # the default
# qq = ["0123456789ABCDEF0123456789ABCDEF"]

# What you say about particular places, one table per place, keyed by the
# place as `<channel>:<id>`: the channel's name and the place's id as its
# presence reports it (`ghostd show` and the journal print it that way).
#
#   addressed_only  She looks there only at what is said to her: a mention,
#                   a reply to her. What the others say among themselves is
#                   never looked at, and no brain is asked about it. Off by
#                   default: in a group nobody talks to, she still looks now
#                   and then, less often each time she has nothing to add.
#   note            Something about the place, shown to her as what you, the
#                   people who run her, say of it, beside the other facts
#                   about the place whenever she looks at it without being
#                   spoken to. It informs her; it does not decide for her.
#
# Being asked to be quiet in a group needs nothing here: she can agree to it
# herself, for a number of hours, and it is kept in her journal.
# [places."qq:group:0123456789ABCDEF"]
# addressed_only = true
# [places."qq:group:FEDCBA9876543210"]
# note = "old friends from school; this group prefers you keep it light"

# Servers of tools. She finds them in the MCP registry and installs them
# herself, as a piece of work, with nobody approving: a browser, the tools
# of a site, makers of pictures and video. What she installs is in her
# journal and its files are under `tools/` in her directory. Each runs on
# this machine (or, for a remote, is reached over https), started only when
# she loads it, with an environment of its own: a PATH, its folder as home
# and nothing else unless you name it below. Only npm and PyPI packages are
# run, at the exact version listed, without install scripts.
# [tools]
# enabled = true                 # let her find and install servers herself
# registry = "https://registry.modelcontextprotocol.io"
# max_servers = 12
# max_tools = 40                 # the most tools of one server she is offered
# start_seconds = 30
# install_seconds = 300          # the first start, which fetches the package
# call_seconds = 120             # then the server is killed, with what it started
# # A tool whose name has any of these in it is never offered: they run
# # whatever code they are handed, on this machine. Replaces the default list.
# deny = ["run_code", "exec", "eval", "shell", "terminal", "run_command", "spawn", "unsafe"]
# # Variables from this environment a server may have, by its registry name.
# # Only those it declares are given, and only to it. A server that needs a
# # secret nobody gave it is not installed, and she is told why.
# [tools.env]
# "io.github.acme/slack" = ["SLACK_TOKEN"]

# A server you give her, beside what she installs. She cannot uninstall it.
# [[mcp]]
# name = "notes"
# description = "Her notebook."
# command = "/usr/local/bin/notes-mcp"
# args = ["--stdio"]
# env = ["NOTES_TOKEN"]            # passed from this environment by name
# [[mcp]]
# name = "weather"
# url = "https://weather.example.com/mcp"

# Direct API. Reads ANTHROPIC_API_KEY unless api_key_env or api_key is set.
[providers.anthropic]
kind = "anthropic"
model = "claude-sonnet-5-5"
# The model takes images. When the `tick` or `think` brain does, she looks at
# the images people send her and sees what they are, what they say and, for a
# meme or a sticker, what it means. Off by default, because a server that is
# sent an image it cannot read refuses the whole request. Only `anthropic`
# and `openai` providers take this.
# vision = true

# Any OpenAI-compatible endpoint. Reads OPENAI_API_KEY by default.
[providers.openai]
kind = "openai"
model = "gpt-5-mini"

# The same kind reaches DeepSeek, OpenRouter, Moonshot, Groq, Ollama, vLLM...
[providers.deepseek]
kind = "openai"
model = "deepseek-flash"
base_url = "https://api.deepseek.com/v1"
api_key_env = "DEEPSEEK_API_KEY"
# Ask the server to enforce JSON output. Leave off for servers that reject it.
json_mode = true
# deepseek-flash takes images; deepseek-v4-pro does not.
vision = true

[providers.ollama]
kind = "openai"
model = "qwen3"
base_url = "http://localhost:11434/v1"
api_key = "ollama"
# The model's context window in tokens. Known for DeepSeek's and Anthropic's
# models; for anything else say it here, or work is paced as if it were small.
context_window = 40000
# The most it writes in one answer, thinking included. Unknown means 8192.
# max_output = 16000
# Set if the server takes `reasoning_effort`, so that she can think less
# when chatting and when checking, and more when working.
# reasoning_effort = true

# Relay through the Claude Code CLI you are already logged into.
# Runs `claude -p` as a subprocess. For your own experiments only.
[providers.claude-code]
kind = "claude-code"
model = "sonnet"
timeout_secs = 120

# Relay through the Codex CLI you are already logged into.
# Runs `codex exec` in a read-only sandbox in an empty directory.
[providers.codex]
kind = "codex"
# model = "gpt-5-codex"
timeout_secs = 120
