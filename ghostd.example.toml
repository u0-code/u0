# ghostd.toml: which brains she runs on, where the daemon listens, and how she
# paces herself.
#
# Copy to ./ghostd.toml or ~/.config/ghost/ghostd.toml. This file is about the
# body, not the person: it never lives inside a ghost directory.

[brain]
# Provider used for conversation and reflection.
think = "anthropic"
# Provider used for the routine ticks of her day and for skimming chatter
# nobody addressed to her. Cheap is fine.
tick = "anthropic"

# Where presences and consoles connect. Listening beyond 127.0.0.1 requires a
# token in the named environment variable.
[listen]
addr = "127.0.0.1:7437"
token_env = "GHOSTD_TOKEN"
# Web origins allowed to connect besides pages served from this machine.
# origins = ["https://console.example"]

[mind]
# The pace she lives at. 1.0 is human: she notices messages after seconds or
# minutes depending on what she is doing, and types at a person's speed.
# 0.1 is good for a demo. 0 removes every wait and lets her answer in her
# sleep; use it only while developing.
tempo = 1.0
# Longest thing a brain may write back for one deliberation, in tokens.
max_tokens = 2000
# How many messages of a conversation she sees when she looks at it. Once
# twice as many have gone by, she writes down what to keep of the older part
# and sees that note above the recent ones.
thread_window = 40
# What she does in a conversation is tool calls, where her brain can take
# them: she can search her memory or the web before answering, and a call
# she gets wrong comes back to her. Off, it is one JSON reply.
talk_tools = true
# Ceiling on brain calls per hour. 0 means no ceiling.
calls_per_hour = 120
# Run the life engine: plan her days, live through them, reflect at night.
live = true
# Look up the real weather where she lives (open-meteo.com, no key).
weather = true
# Most public posts in a day, and minutes between phone sessions on channels
# that have a feed. [0, 0] turns scrolling off.
posts_per_day = 3
browse_minutes = [45, 150]
# What she does in public beyond posting. Both are off by default because of
# what platforms allow an automated account: X forbids automated likes, and
# allows automated replies only to people who wrote to the account first.
# Replies to mentions always work. Turn these on only where the platform's
# rules, or its written approval, let you.
public_likes = false
public_replies = false
# Read every post over before it goes out, as herself: for anything she was
# told in private, anything that contradicts what is true of her, and whether
# it is worth posting at all. One extra call to the `tick` brain per post.
gate = true
# Hours between asking a channel how her posts are doing. 0 is never.
measure_hours = 12
# A directory of prompt templates overriding the ones in ghost-mind/prompts.
# prompts = "prompts"

# Taking things on: work that needs more than one thought, done in sittings
# in her own time. It needs a brain that can run tools: any API provider, or
# the claude-code relay.
[mind.work]
enabled = true
# Where her shell and files are. Without one she can look things up and think
# and nothing else, which is the safe default.
#   "docker:<container>"  a running container. Use this on a server.
#   "local:<directory>"   a directory under her own, on this machine, as you.
#                         Not a sandbox: only for a machine that is hers.
# machine = "docker:ghost-lin"
# workdir = "/home/lin"
# Let her search and read the web while working. Search uses DEEPSEEK_API_KEY,
# BRAVE_API_KEY or SEARXNG_URL, whichever is set first.
web = true
# One sitting is at most this many steps or minutes. Between sittings she
# rests, and after max_sittings she lets the thing go.
sitting_steps = 40
sitting_minutes = 15
rest_minutes = 10
max_sittings = 12
# Things she will take on in a day.
per_day = 4
# Once she has put into words something she is after, she may take a piece
# of work on toward it without being asked: at most one every this many
# days, and only when nothing of her own is in hand. 0 is never.
pursue_days = 2
# In the middle of work she can stop and ask whoever it is for. If nobody
# answers within this many hours she goes on with her own judgement.
ask_hours = 24
# How large her working context may grow before it is trimmed, in tokens.
# Left out, it is most of the model's context window: she keeps what she has
# seen in front of her for longer, and each step reads more. Set it to cap
# what a long piece of work costs.
# context_tokens = 200000
# Days between the times she sits down, unasked, to look at how her public
# writing is going and decide what to try next. 0 is never. Needs a channel
# that reports how her posts are doing, and at least five posts to look at.
review_days = 7

# Direct API. Reads ANTHROPIC_API_KEY unless api_key_env or api_key is set.
[providers.anthropic]
kind = "anthropic"
model = "claude-sonnet-5-5"

# Any OpenAI-compatible endpoint. Reads OPENAI_API_KEY by default.
[providers.openai]
kind = "openai"
model = "gpt-5-mini"

# The same kind reaches DeepSeek, OpenRouter, Moonshot, Groq, Ollama, vLLM...
[providers.deepseek]
kind = "openai"
model = "deepseek-chat"
base_url = "https://api.deepseek.com/v1"
api_key_env = "DEEPSEEK_API_KEY"
# Ask the server to enforce JSON output. Leave off for servers that reject it.
json_mode = true

[providers.ollama]
kind = "openai"
model = "qwen3"
base_url = "http://localhost:11434/v1"
api_key = "ollama"
# The model's context window in tokens. Known for DeepSeek's and Anthropic's
# models; for anything else say it here, or work is paced as if it were small.
context_window = 40000
# The most it writes in one answer, thinking included. Unknown means 8192.
# max_output = 16000
# Set if the server takes `reasoning_effort`, so that she can think less
# when chatting and when checking, and more when working.
# reasoning_effort = true

# Relay through the Claude Code CLI you are already logged into.
# Runs `claude -p` as a subprocess. For your own experiments only.
[providers.claude-code]
kind = "claude-code"
model = "sonnet"
timeout_secs = 120

# Relay through the Codex CLI you are already logged into.
# Runs `codex exec` in a read-only sandbox in an empty directory.
[providers.codex]
kind = "codex"
# model = "gpt-5-codex"
timeout_secs = 120
