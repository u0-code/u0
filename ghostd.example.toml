# ghostd.toml: what the daemon needs to run a character on this machine.
# Copy it to ./ghostd.toml (or ~/.config/ghost/ghostd.toml). The character
# is not named here but on the command line, by her directory:
#
#   ghostd birth ghosts/her && ghostd run ghosts/her
#
# Keys are never written here: they come from the environment or .env.
# Every table and key is in crates/ghostd/README.md, under Configuration.

# The brain she thinks with, and the one for the routine of her day.
[brain]
think = "deepseek"
tick = "deepseek"

[providers.deepseek]
kind = "openai"                          # any OpenAI-compatible API
model = "deepseek-flash"
base_url = "https://api.deepseek.com/v1"
api_key_env = "DEEPSEEK_API_KEY"         # the variable the key is read from
json_mode = true

# Only if a local proxy is in the way, e.g. one that stalls long answers.
# [network]
# proxy = "http://127.0.0.1:7890"
# direct = ["*.deepseek.com"]            # these hosts never use it

# The accounts that run her, per channel, as its presence reports them.
# She answers them at her own pace like anyone, and will spend her machine
# for them. Whoever is at a console with this daemon's token is one without
# being listed, and is answered at once: see "Who runs her from a console"
# in ghostd's README.
# [operators]
# qq = ["0123456789ABCDEF0123456789ABCDEF"]
