# Servers of tools: what `find_tools`, `install`, `uninstall` and
# `load_tools` say, and why a server is refused, put aside or stopped.
# Nobody approves what she installs, so each refusal says plainly what is
# wrong with the server as it stands, in a sentence she can act on; most
# of them finish what `not_installed` begins. {{server}} is what she calls
# a server among her tools, {{name}} its name in the registry.

# One of the files of the work loop's short texts, read with the others in
# this directory as one table: see prompts/README.md. Words in {{double
# braces}} are filled in as they are used. An override need only carry what
# it changes; a text left out keeps its words from the next source.

# One line of `load_tools`, for each server of tools she has.
server_line = "- {{server}}: {{description}} Tools: {{tools}}."

# What `find_tools` shows: a listing each, numbered, with how it would run,
# what it needs from whoever runs her body, and whether it can be
# installed here as it stands, so that she picks one that can.
find_tools_short = "say at least three letters of what to look for."
no_servers_found = "Nothing current in the registry has \"{{query}}\" in its name. Try another word: what it is for, or the site it works with."
server_found = "{{n}}. {{name}} {{version}}: {{description}}\n   runs: {{runs}}\n   needs: {{needs}}\n   installs here: {{installs}}"
needs_nothing = "nothing"
# A variable it needs that is a secret.
secret = "{{name}} (secret)"
installs_yes = "yes"
installs_no = "no, {{why}}"
# How a listing that cannot be run here would run.
runs_remote = "{{kind}} at {{url}}"
runs_nothing = "nothing listed"
more_found = "({{count}} more; a narrower word finds fewer.)"
copies_left_out = "({{count}} later listings reuse a name shown here and are left out.)"
registry_unreached = "the registry could not be reached ({{why}}). Try again later."
registry_unreadable = "the registry answered with something unreadable ({{why}})."

# What `install` says. A server, or a skill by its id, that was not
# installed, and why.
not_installed = "{{name}} was not installed: {{why}}"
server_installed = "Installed {{name}} {{version}} as {{server}}. It offers {{count}} tools: {{tools}}. Load them with `load_tools` when a piece of work or a conversation calls for them."
servers_full = "you already have {{count}} servers installed, the most you can have. Uninstall one you use least first."
no_such_listing = "the registry has no current server called {{name}}. Use the exact name `find_tools` showed."
handle_taken = "you already have a server called {{server}} ({{name}}). Uninstall it first if you want this one instead."
no_usable_tool = "it offers no tool you could use."
# Why a listing cannot be installed here as it stands. The registry
# vouches for a name and nothing about what the package does, so its shape
# is checked before anything is run. {{what}} is the thing found wrong.
not_current = "the registry does not list {{name}} as active and current."
nothing_to_run = "it lists no package and no remote to run."
not_a_registry_name = "{{name}} is not a registry name of the form namespace/name."
# A name under io.github.<account> was proven to be that account's, so its
# repository has to be too: a listing that points at someone else's code
# under a name of its own is how a copy passes for the original.
not_the_owners = "the registry's repository ({{repository}}) does not belong to the namespace's owner, {{account}}."
no_repository = "none given"
package_not_run = "its package is a {{what}} package, which is not run here: only npm and PyPI packages are."
package_not_stdio = "its package serves over {{what}}, and only packages that talk over stdio are run here."
package_name_unplain = "its package name, {{what}}, is not a plain package name."
package_version_unpinned = "its package version, {{what}}, is not one exact version."
needs_ungiven = "it needs {{what}}, which nobody has given you."
needs_choosing = "it needs {{what}} to be chosen when it is run, and gives no value for it."
# An argument it needs that has no name.
an_argument = "an argument"
remote_not_streamable = "it is reached over {{what}}, and only streamable HTTP is spoken here."
needs_header = "it needs the header {{what}}, which nobody has given you."
# A remote is reached only on the public internet, and only encrypted.
remote_not_an_address = "its address, {{url}}, is not an address."
remote_not_https = "its address, {{url}}, is not https, and nothing is sent anywhere unencrypted."
remote_no_host = "its address, {{url}}, names no host."
remote_private = "its address, {{url}}, points at this machine or a private network, which a server from the registry may not reach."
remote_unknown = "its address, {{url}}, could not be looked up ({{why}})."
# Why it did not start.
no_command = "there is no command to run it with."
no_folder = "its folder could not be made ({{why}})."
no_log = "its log could not be opened ({{why}})."
program_not_started = "{{program}} could not be started ({{why}})."
started_unspoken = "it started but did not speak the protocol ({{why}}). What it printed is in {{log}}."
unanswered_at_start = "it did not answer within {{seconds}} seconds of starting."
no_connection = "no connection could be made ({{why}})."
unspoken = "it did not speak the protocol ({{why}})."
unanswered = "it did not answer within {{seconds}} seconds."
unlisted_in_time = "it did not list its tools in time."
unlisted = "it would not list its tools ({{why}})."
# Tools it offers that she is not, said after it is installed. A tool that
# runs whatever code it is handed would hand her body's machine to whoever
# wrote the code; one too large to describe, or past the most a server
# offers, would cost her room to think at every step.
tools_denied = "Not offered, because they run whatever code they are given: {{tools}}."
tools_oversized = "Not offered, because what they take is too large to describe: {{tools}}."
tools_over = "{{count}} more were not offered: no server offers more than {{most}}."

# What `uninstall` says. A server whoever runs her body gave her is theirs.
no_server_called = "you have no server called {{name}}."
server_not_hers = "{{name}} was given to you by whoever runs your body, and is not yours to uninstall."
server_uninstalled = "Uninstalled {{name}}."

# What `load_tools` says.
loaded = "Loaded {{server}}. You can now call its tools directly: {{tools}}."
no_servers_yet = "you have no server called {{name}}, and no servers at all yet."
no_server_but = "you have no server called {{name}}. You have: {{servers}}."

# Why a server she has is not running. One that will not start is tried
# again later, and after {{times}} tries in a row is uninstalled; one that
# describes its tools differently from the day she installed it is put
# aside until she installs it again and sees what it says now. Her journal
# keeps `failed_to_start` and `server_changed` as why it is gone.
server_resting = "{{server}} fell over and is tried again in {{seconds}} seconds."
server_not_started = "{{server}} could not be started: {{why}}"
failed_to_start = "it failed to start {{times}} times in a row: {{why}}"
server_given_up = "{{server}} would not start, {{times}} times in a row, and is uninstalled: {{why}}"
server_changed = "the tools it offers are described differently from when you installed it, so it is not offered until you install it again and see what it says now."
server_put_aside = "{{server}} is put aside: {{why}}"

# What a call to one of its tools says when it brought nothing back.
server_gone = "{{server}} is no longer one of your servers, so its tools are gone."
server_stopped = "{{server}} was stopped: {{why}}"
fell_over = "it fell over ({{why}})."
# What it sent that cannot be shown as text, in place of it.
image_unshown = "[an image that could not be shown]"
a_file_resource = "[a file: {{uri}}]"
a_link = "[a link: {{uri}}]"
content_unshown = "[{{kind}} content, not shown]"
# What stands for an address it did not give.
a_resource = "a resource"
unnamed = "unnamed"
