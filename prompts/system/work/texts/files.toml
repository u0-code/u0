# Files: what `read`, `write` and `edit` say back. Each refusal names what
# to do instead, because a model told only that something failed tends to
# try the same thing again.

# One of the files of the work loop's short texts, read with the others in
# this directory as one table: see prompts/README.md. Words in {{double
# braces}} are filled in as they are used. An override need only carry what
# it changes; a text left out keeps its words from the next source.

# A file that could not be had. {{path}} is the file as it was named,
# {{why}} the error.
unreadable = "could not read {{path}}: {{why}}"
a_directory = "{{path}} is a directory"
a_binary_file = "{{path}} is a binary file. Inspect it with shell tools (file, xxd, strings)."
too_large_whole = "{{path}} is too large to handle whole. Work on it with shell tools (sed, awk, python)."
# An image is shown as an image, up to {{mb}} MB.
image_too_large = "{{path}} is an image larger than {{mb}} MB, too large to be shown. Make a smaller copy with shell tools and read that."

# What `read` says with what it read. {{about}} is the image's type, size
# and dimensions.
an_image = "{{path}}: an image ({{about}})"
file_empty = "(the file is empty)"
too_few_lines = "{{path}} has only {{lines}} lines"
# After lines that are not the whole file, so that the worker knows there
# is more and how to read on. {{total}} is the number of lines, or
# `at_least` when the file was too long to count.
lines_shown = "[lines {{from}}-{{last}} of {{total}}; pass `from` to read on]"
at_least = "at least {{lines}}"

# A file that could not be written. {{why}} is the error.
unwritable = "could not write {{path}}: {{why}}"
# What `write` says once it has written.
wrote = "wrote {{path}} ({{lines}} lines, {{bytes}} bytes)"

# Where `write` and `edit` may not write: outside the work's folder, and
# for a part in a checkout of its own, in its work's folder. A model asked
# to look at a folder tends to put what it makes there, and being told
# not to does not stop it; being told where to write instead does.
# {{path}} is where it tried to write, {{folder}} its own folder.
outside_the_folder = "{{path}} is outside the work's folder, {{folder}}. What the work makes goes in its folder, unless whoever asked named that file in their own words, and they did not: a place the task gives that their words do not was a guess. Write it in the folder, do not put it there another way (a shell command, a copy), and say where it is: they will be told."
in_their_folder = "{{path}} is in the work's folder, where other workers are. This part works in its own checkout, {{folder}}: make the change there, and it is brought back into the work's folder when you finish."

# What `edit` says.
old_empty = "`old` is empty. To create a file use `write`."
old_is_new = "`old` and `new` are the same; nothing would change."
not_utf8 = "{{path}} is not valid UTF-8, so editing it here could corrupt it. Use shell tools."
# When `old` is not in the file. {{hint}} is one of the two after it: the
# commonest miss is indentation, and it is said when that is all it is.
old_not_found = "`old` was not found in {{path}}. {{hint}}"
old_whitespace_differs = "The words are in the file but the whitespace differs. Read the lines again and copy them exactly."
old_read_again = "Read the file again: it may have changed, or the text may differ from what you remember."
old_ambiguous = "`old` matches {{count}} places in {{path}}. Include more of the surrounding lines so it matches one, or pass `all`: true."
edited_once = "edited {{path}} (1 replacement)"
edited = "edited {{path}} ({{count}} replacements)"
# When `old` matched but for whitespace at the ends of lines, which nobody
# can see, and was taken.
edited_loosely = "edited {{path}} (1 replacement; trailing whitespace differed from `old`)"
