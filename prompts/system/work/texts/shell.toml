# The shell: what `shell` says with what a command printed, and of jobs
# left running in the background. What a command printed is the command's;
# these are the lines put around it, in brackets so that they read as
# apart from it.

# One of the files of the work loop's short texts, read with the others in
# this directory as one table: see prompts/README.md. Words in {{double
# braces}} are filled in as they are used. An override need only carry what
# it changes; a text left out keeps its words from the next source.

# When a command printed nothing. Said, so that nothing is not taken for a
# result that went missing.
no_output = "(no output)"
# After what a command printed, each only when it is so. The whole of an
# output too long to show is kept in a file of {{lines}} lines at {{path}},
# where it can be searched rather than run again.
output_kept = "\n[the whole output, {{lines}} lines, is in {{path}}: search it with grep or read part of it with sed]"
output_dropped = "\n[{{bytes}} bytes of output were dropped]"
timed_out = "\n[stopped: still running after {{seconds}}s. Raise `timeout`, or use `background` and poll.]"
exited = "\n[exit {{code}}]"
killed = "\n[killed by a signal]"
# When the command left it somewhere else: the next one starts there.
moved = "\n[now in {{dir}}]"
# When a command could not be run at all. {{why}} is the error.
not_run_command = "could not run the command: {{why}}"
not_started_command = "could not start the command: {{why}}"

# A command started in the background, as job {{job}}: how to look at it
# again, and where all of what it prints is kept.
job_started = "started as job {{job}} (pid {{pid}}). Look at it with shell {\"job\": {{job}}}; its output is in {{log}}"
# What a look at a job says after what it printed since the last look.
nothing_new = "(nothing new printed)"
job_finished = "\n[job {{job}} finished]"
job_failed = "\n[job {{job}} finished with exit {{code}}]"
job_running = "\n[job {{job}} is still running after {{seconds}}s. Look again later, or get on with something else.]"
no_job = "there is no job {{job}}"
job_unreachable = "could not look at job {{job}}: {{why}}"
