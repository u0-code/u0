# Where she is (the channel pages, view.md, digest.md).

# One of the files of the mind's short texts, read with the others in this
# directory and character/texts.toml as one table: see prompts/README.md.

place_direct = "{{channel}}: a private conversation with {{who}}."
place_group = "{{channel}}: the group chat {{name}}. Several people are here, and not everything said is meant for you."
place_public = "{{channel}}: a public thread. Anyone can read what is written here."
place_me = " You are {{me}} here."
# A group with no name.
place_unnamed = "(unnamed)"
# A place in a few words, as she would refer to it from elsewhere: in the
# rest of her day, in what she remembers and in her report.
place_there_direct = "a private chat with {{who}} on {{channel}}"
place_there_group = "the group {{name}} on {{channel}}"
place_there_unnamed = "the group chat on {{channel}}"
place_there_public = "public replies on {{channel}}"
# After where she is, when the platform limits what she may do there. It
# is a rule of the platform, not hers, and it is why some things she would
# do elsewhere are not offered here.
place_answer_within = " Here what is said to you can be answered only for about {{minutes}} minutes after it was said; after that the platform refuses it."
place_not_first = " Here you cannot write to anyone first, only answer, so what is worth answering you answer now, not later."
