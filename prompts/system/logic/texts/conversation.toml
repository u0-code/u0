# A conversation as she sees it on her phone: the lines that are not
# anyone's message.

# One of the files of the mind's short texts, read with the others in this
# directory and character/texts.toml as one table: see prompts/README.md.

# When there is nothing in it yet.
no_messages = "(no messages yet)"
# Before the first message of each day, when the conversation reaches back
# past today, the way a phone shows it. {{day}} is as she remembers it.
day_line = "--- {{day}} ---"
# Between what she has read and what is new.
new_since = "--- new since you last looked ---"
# Who wrote her own lines. Someone whose name begins with this word has it
# quoted, so that a name can never read as her.
you = "you"
# After who wrote a message that answers another: {{seq}} is that one's number.
replying_to = " (replying to m{{seq}})"
