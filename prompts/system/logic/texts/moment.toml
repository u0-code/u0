# Her moment (now.md): what she is doing as she reads.

# One of the files of the mind's short texts, read with the others in this
# directory and character/texts.toml as one table: see prompts/README.md.

# What she is doing as she reads this. The words say how far her phone is
# from her hand, which is what her day decides; never how willing she is.
state_asleep = "You are asleep. It is the middle of your night; if you are reading this, something woke you."
state_doing = "You are in the middle of: {{what}} (until {{until}}). {{reach}}"
state_idle = "You are awake and nothing in particular is going on."
reach_free = "Your phone is in your hand."
reach_glance = "You pick your phone up between things."
reach_busy = "You have stopped for a moment to look at your phone."
reach_away = "You were away from your phone until just now."

# What else now.md is filled with.

# The weather, after the hour; only when it is known.
weather_now = "Weather: {{weather}}"
# After each block of her plan for today: whether it is behind her, now, or
# still to come. A plan is not a memory, so what is ahead is not said to
# have happened.
block_earlier = " (earlier)"
block_now = " (now)"
block_to_come = " (still to come)"
nothing_planned = "(nothing planned)"
# What she has been doing lately, a line each: what she lived is as she
# wrote it; these are the rest.
looked_back = "(looking back) {{text}}"
looked_back_on = "(looking back on {{channel}}) {{text}}"
# Something she posted, wherever it is put among what she did.
posted = "you posted: {{text}}"
# A stretch she was not running: so that the gap is not read as days she
# lived and forgot.
dormant = "(a blank: nothing from {{since}} until then)"
nothing_lately = "(nothing worth noting yet)"
# The facts of her life, when none have been registered yet.
canon_none = "(nothing registered yet beyond who you are)"
