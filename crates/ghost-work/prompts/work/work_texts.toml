# The short pieces a worker is told, by name. `work.md` is the whole of
# what it is told at the start; these are what is said to it along the way.
# Words in {{double braces}} are filled in as they are used.
#
# An override need only carry what it changes. A text left out keeps its
# words from the next source.

# Filled into work.md as {{budget}}.
budget = "You have at most {{steps}} steps and about {{minutes}} minutes. That is enough to work carefully and not enough to wander."

# Filled into work.md as {{machine}} when there is nowhere to run anything.
no_machine = "You have no computer to run things on: only what you can look up and think through."

# After {{machine}}, what a first look around showed, when there was one.
looked_around = "When this run started it looked like this:\n\n```\n{{look}}\n```"

# What the first sitting opens with: the task alone.
task = "<task>\n{{task}}\n</task>"

# What every sitting after the first opens with. {{before}} and {{after}}
# are one of the two pairs below; {{handoff}} and {{touched}} are left out
# when there is nothing to put in them.
opening = """\
    {{task}}\n\n{{before}}\n\n<plan>\n{{plan}}\n</plan>\n\n{{handoff}}{{touched}}<notes>\n{{notes}}\n</notes>\n\n\
    {{after}}\n\n{{audit}}"""
handoff_section = "<handoff>\n{{handoff}}\n</handoff>\n\n"
touched_section = "<files_you_last_changed>\n{{files}}\n</files_you_last_changed>\n\n"

# A sitting picked up with nothing of the last one in front of it.
picked_up_before = """\
    You have already been working on this, and your earlier context is gone. \
    This is what you left for yourself."""
picked_up_after = """\
    Clearing your context is routine and does not end the task. Do not start over. \
    First look at the current state of the environment, which holds \
    whatever you already did. Then carry on from where you stopped."""

# A sitting begun because the context filled, with the last stretch of
# the old one following word for word.
cleared_before = """\
    You have already been working on this. Your context filled up, so all of it but the most \
    recent part has been cleared. This is what you left for yourself; after this message, the \
    last stretch of your work follows exactly as it happened."""
cleared_after = """\
    Clearing your context is routine and does not end the task. Do not start over and do not \
    redo what is finished. Treat what is above as settled, and carry on directly from where \
    the messages below leave off."""

# Work that has outlived a context is told this about finishing when it is
# picked up: before, not after.
audit = """\
    When you come to think this is finished, treat that as unproven. Much of what you did \
    is behind you and out of sight, and what you remember doing is not evidence. Take the task as it is \
    written above and, for each thing it asks for, look at the real state as it is now: run it, read it, \
    print it. Check what was asked, not a narrower thing that is easier to check. A requirement you cannot \
    show to hold is not finished: keep working on it instead of calling `done`."""

# The plan, as the worker sees it: in the opening of a sitting picked up
# again, and after each `plan`. A step is a line, its mark first: [ ] to
# do, [>] in progress, [x] done, [-] dropped, [!] failed. What it is after,
# the part on it, its check and its result follow, each only when it has
# one, so that a sitting with nothing else in front of it can tell what
# was shown to hold from what was only meant.
no_plan = "(no plan written yet)"
plan_step = "{{mark}} {{step}}. {{text}}{{after}}{{part}}{{check}}{{result}}"
plan_after = " (after {{steps}})"
plan_part = " (part {{part}})"
plan_check = "\n      check: {{check}}"
plan_result = "\n      result: {{result}}"

# What `plan` returns: the plan as it now stands, or why it was not taken.
plan_now = "The plan is now:\n{{plan}}"
plan_refused = "The plan was not changed:\n{{problems}}"
# Each a line of the refusal.
plan_unproven = "- Step {{step}} has a check, so marking it done needs a `result`: what you saw that shows the check was met."
plan_no_reason = "- Step {{step}} is dropped without a `result` saying why it is no longer needed."
plan_not_ready = "- Step {{step}} cannot be in progress yet: it is after steps that are not done ({{waiting}})."

# What `done` says when the work is called finished while steps of the
# plan are still open. The list is all it says.
steps_open = "Not recorded. These steps of the plan are neither done nor dropped:\n{{steps}}"

# Something added to the task from outside while the work ran.
added = """\
    Something has been added to the task while you were working:\n\n{{added}}\n\n\
    It extends or adjusts what was asked; it does not replace it. \
    Take it into account from here, and update the plan if it changes what is left to do."""

# Said once most of the steps are spent.
steps_left = "You have used {{used}} of your {{steps}} steps. Spend what is left on getting the work into a finished, checked state, and call `done`."

# After a step that wrote something and called nothing.
no_call = """\
    You wrote a message but called no tool, so nothing happened. \
    If the work is complete, check it and call `done`. Otherwise take the next action now."""
# After a step cut off by the output limit.
cut_off = """\
    Your last message was cut off by the output limit before it finished. \
    Continue. If you were writing a large file, write it in several smaller pieces."""
# After a step that spent its whole allowance thinking.
thought_out = """\
    Your last step used its whole output allowance thinking and wrote nothing, \
    so nothing happened. Do not work the whole problem out in your head: take the next small action now \
    and let its result tell you what to do after it."""
# After the same call came back the same three times.
repeating = """\
    You have made the same call three times and got the same result. \
    It will not change. Stop and think about what that result is telling you, then do something different."""
# Just before the context is cleared.
handoff = """\
    Your context is almost full, and all of it but the most recent part is about to be cleared. \
    You will continue this work with the task, the plan, your handoff, your latest notes and only the last stretch \
    of this conversation in front of you. \
    Right now, call `handoff` once with a single document that stands on its own: what is finished and checked, \
    what is in progress and exactly where you stopped, the exact paths and commands that matter, what you learned \
    that was not obvious, and the next few actions in order. It replaces any earlier handoff, so carry forward \
    whatever from the earlier one still matters. Keep it under about 500 words. Also bring `plan` up to date. \
    Do nothing else in this step."""

# The result of a call the work was interrupted in. Calls run one after
# another, so of those left without a result only the first can have begun.
interrupted = """\
    This did not finish: the work was interrupted while it ran, and what it did is unknown. \
    It may have partly happened. If it only reads, or doing it twice does no harm, run it again; \
    otherwise look at the current state first."""
not_started = """\
    This was not run: the work was interrupted before it began. \
    Run it again if it is still needed."""

# What a tool brought back from outside reaches a brain inside an
# <outside> tag, in a conversation as at work, and its `from` is one of
# these: where it came from, by tool. Pages, files, searches and what a
# command printed were written by someone else for reasons of their own,
# and saying where each came from is what lets her treat it as what it
# is. A tool the catalog does not know, such as one installed from
# elsewhere, is outside too. What the tag means is said in self.md and
# work.md, not here.
outside_search = "a web search for: {{query}}"
outside_fetch = "the web page {{url}}"
outside_read = "the file {{path}}"
outside_shell = "what this command printed: {{command}}"
outside_job = "what background job {{job}} printed"
outside_tool = "the tool {{tool}}, which is not one of yours"
# A tool of a server of tools: someone else's program, installed from the
# registry or given by whoever runs your body.
outside_server = "the tool {{tool}} of {{server}}, a server of tools written by someone else"
# What the registry lists, and what a server says of itself when it is
# installed, are its publisher's words.
outside_registry = "the registry of tools, searched for: {{query}}"
outside_install = "the registry and the server {{name}}, as it was installed"

# What the index of skills lists, what a skill says of itself when it is
# installed, and everything a skill says when she reads it, are their
# writers' words. A skill is named with the repository and commit it came
# from, so that she knows whose words she is following.
outside_skills = "the index of skills, searched for: {{query}}"
outside_install_skill = "the index of skills and the skill {{id}}, as it was installed"
outside_skill = "the skill {{skill}}, from {{origin}} on GitHub, written by someone else"
outside_skill_file = "the file {{file}} of the skill {{skill}}, from {{origin}} on GitHub, written by someone else"

# One line of `load_tools`, for each server of tools she has.
server_line = "- {{server}}: {{description}} Tools: {{tools}}."

# One line of `use_skill`, for each skill she has.
skill_line = "- {{skill}}: {{description}}"

# Put after a result whose images were taken out of the transcript.
no_longer_shown_one = "[This image is no longer shown, to save room. Ask for it again if you need to see it.]"
no_longer_shown_many = "[These images are no longer shown, to save room. Ask for them again if you need to see them.]"

# Parts: pieces of the work handed out with `delegate`, each done by a
# worker of its own while the one that handed it out goes on with its
# share. {{part}} is a part's number.

# What a part is told about where it stands, before its instructions.
part_who = """\
    You are doing one part of a larger piece of work. Another worker is doing the whole of it: it handed \
    this part to you and goes on with its own share while you do yours. It sees nothing of what you do, only \
    what you `tell` it, what you `ask` it, and the summary you give `done`. That summary is your report to it \
    and all it will have of your work, so make it complete enough to act on: what you found or did, where it \
    is, what you checked, and what is still open. Keep to the part you were given. The rest is being done by \
    others, and work outside your part can undo theirs."""

# What `delegate` returns: the part's number, and nothing of its work yet.
part_started = "Part {{part}} has started on it, alongside you."
part_queued = "Part {{part}} is queued, because as many parts as may run at once ({{running}}) already are. It starts when one of them ends."
# After either, when the part was handed a step of the plan.
part_on_step = " It is on step {{step}} of your plan, which is marked done with its report when it finishes, and failed if it does not."
# Why a step cannot be handed out.
no_step = "Your plan has no step {{step}}. Call `plan` to add it first, or leave `step` out."
step_not_ready = "Step {{step}} cannot be started yet: it is after steps that are not done ({{waiting}})."
step_taken = "Step {{step}} is already with part {{part}}, which has not ended. Steer that part, or stop it first."
# What is recorded on a step as its result when the part given it ends:
# {{how}} is one of the words below, {{line}} the first line of its report.
part_result = "Part {{part}} {{how}}: {{line}}"
# Put after the report of a part that was given a step.
part_step_done = "\n\nStep {{step}} of your plan, which it was given, is now marked done, with the first line of this report as its result."
part_step_failed = "\n\nStep {{step}} of your plan, which it was given, is now marked failed. Do it another way, hand it out again, or drop it with a reason."

# What reaches the worker from its parts between its steps, each as a
# message of its own that says whom it is from and what it is.
part_told = "A message from part {{part}}, which goes on working:\n\n{{text}}{{files}}"
part_told_files = "\n\nFiles it made: {{files}}"
part_asked = "A question from part {{part}}, which has stopped until you answer it with `steer`:\n\n{{text}}"
part_ended = "Part {{part}} {{how}} after {{steps}} steps. Its report:\n\n{{report}}"
part_finished = "finished"
part_blocked = "could not go on"
part_gave_up = "gave up"
part_dropped = "was stopped"
part_failed = "failed ({{why}})"
part_ran_out = "ran out of steps before finishing"
part_stalled = "stopped acting, and was ended"

# What `steer`, `stop`, `wait` and `parts` return at work.
steered = "Passed on to part {{part}}. It reads it before its next step."
part_stopped = "Part {{part}} is stopped. If it is in the middle of a step it ends after that step, and its report reaches you."
no_part = "There is no part {{part}}. Call `parts` to see the parts you have handed out."
part_over = "Part {{part}} has already ended. Hand out a new part if there is more to do."
wait_arrived = "Something arrived. It follows."
wait_timed_out = "Nothing arrived in {{seconds}} seconds."
wait_idle = "No part is running or queued, so nothing will arrive. Call `parts` to see where each one stands."
parts_none = "You have not handed out any parts."
parts_line = "- part {{part}} ({{status}}, {{steps}} steps), given \"{{task}}\": {{latest}}"
status_running = "running"
status_queued = "queued"
status_asking = "waiting for your answer"
status_finished = "finished"
status_blocked = "blocked"
status_gave_up = "gave_up"
status_dropped = "dropped"

# What `done` says when the work is called finished while parts of it
# have not ended.
parts_open = """\
    Not recorded. These parts have not ended: {{parts}}. Their results are not in, so the work is not \
    finished yet. Wait for them with `wait`, or stop the ones you no longer need with `stop`, then call \
    `done` again. Calling it blocked or gave_up instead ends them along with the work."""
