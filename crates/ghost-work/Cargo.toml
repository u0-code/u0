[package]
name = "ghost-work"
description = "The loop a ghost does things with: a model, a set of tools, and state that outlives any one context window."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "ghost-work"
path = "src/bin/ghost-work.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
blake3 = "1.8.7"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15"
ghost-brain = { version = "0.0.1", path = "../ghost-brain" }
ghost-core = { version = "0.0.1", path = "../ghost-core" }
ghost-net = { version = "0.0.1", path = "../ghost-net" }
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "process-group"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query"] }
rmcp = { version = "=3.10.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "time", "fs", "io-util", "io-std", "sync", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["net"] }

[lints]
workspace = true
