[package]
name = "ghost-desk"
description = "Ghost: one desktop app for the coding agents you already use (Claude Code, Codex, Antigravity, ...), driven over the Agent Client Protocol."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ghost-core = { workspace = true, features = ["tls"] }
gpui.workspace = true
agent-client-protocol.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-segmentation.workspace = true
vt100.workspace = true
vte.workspace = true
base64.workspace = true
unicode-width.workspace = true
shell-words.workspace = true
url.workspace = true
mime_guess.workspace = true
imagesize.workspace = true
percent-encoding.workspace = true
which.workspace = true
nucleo-matcher.workspace = true
jsonc-parser.workspace = true
sys-locale.workspace = true
rust-i18n.workspace = true
ratex-parser.workspace = true
ratex-layout.workspace = true
ratex-types.workspace = true
ratex-svg.workspace = true
mermaid-rs-renderer.workspace = true
# The pairing QR code, drawn as the SVG the crate writes.
qrcode = { workspace = true, features = ["svg"] }

[dev-dependencies]
tempfile.workspace = true

# To give the running app its icon in the Dock, and begin dictation: AppKit,
# by way of the same crates GPUI uses for it.
[target.'cfg(target_os = "macos")'.dependencies]
cocoa.workspace = true
objc.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-avf-audio.workspace = true

[lints]
workspace = true
