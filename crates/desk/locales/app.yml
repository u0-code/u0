"Paste the link the other Mac shows under Pair a device with this Mac, or open it here. Its projects come down the left, beside this Mac's.":
  zh-CN: "粘贴另一台 Mac 在「将设备与这台 Mac 配对」下显示的链接，或在这里打开它。它的项目会出现在左侧，与这台 Mac 的项目并列。"
  de: "Fügen Sie den Link ein, den der andere Mac unter „Gerät mit diesem Mac koppeln“ zeigt, oder öffnen Sie ihn hier. Seine Projekte erscheinen links, neben denen dieses Mac."
  es: "Pega el enlace que el otro Mac muestra en Emparejar un dispositivo con este Mac, o ábrelo aquí. Sus proyectos aparecen a la izquierda, junto a los de este Mac."
  fr: "Collez le lien que l’autre Mac affiche sous Appairer un appareil avec ce Mac, ou ouvrez-le ici. Ses projets apparaissent à gauche, à côté de ceux de ce Mac."
  ja: "もう一方の Mac の「デバイスをこの Mac とペアリング」に表示されるリンクを貼り付けるか、ここで開いてください。そのプロジェクトが左側に、この Mac のプロジェクトと並んで表示されます。"
  ko: "다른 Mac의 ‘이 Mac과 기기 페어링’에 표시된 링크를 붙여 넣거나 여기에서 여십시오. 그 Mac의 프로젝트가 이 Mac의 프로젝트 옆, 왼쪽에 표시됩니다."
  pt-BR: "Cole o link que o outro Mac mostra em Parear um dispositivo com este Mac, ou abra-o aqui. Os projetos dele aparecem à esquerda, ao lado dos deste Mac."
  ru: "Вставьте ссылку, которую другой Mac показывает в разделе «Сопрячь устройство с этим Mac», или откройте её здесь. Его проекты появятся слева, рядом с проектами этого Mac."
  sv: "Klistra in länken som den andra Mac-datorn visar under Parkoppla en enhet med den här Mac-datorn, eller öppna den här. Dess projekt visas till vänster, bredvid den här Mac-datorns."
