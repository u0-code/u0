"ghost <folder> in a terminal opens the folder here as a project. It goes in ~/.local/bin.":
  zh-CN: "在终端中运行 ghost <文件夹> 会在这里把该文件夹作为项目打开。它安装在 ~/.local/bin。"
  de: "ghost <folder> in einem Terminal öffnet den Ordner hier als Projekt. Er kommt nach ~/.local/bin."
  es: "ghost <folder> en un terminal abre la carpeta aquí como proyecto. Va en ~/.local/bin."
  fr: "ghost <folder> dans un terminal ouvre le dossier ici comme projet. Elle va dans ~/.local/bin."
  ja: "ターミナルで ghost <folder> を実行すると、そのフォルダがここでプロジェクトとして開きます。~/.local/bin に置かれます。"
  ko: "터미널에서 ghost <folder>를 실행하면 폴더가 여기에서 프로젝트로 열립니다. ~/.local/bin에 설치됩니다."
  pt-BR: "ghost <folder> em um terminal abre a pasta aqui como projeto. Ele fica em ~/.local/bin."
  ru: "ghost <folder> в терминале открывает папку здесь как проект. Команда помещается в ~/.local/bin."
  sv: "ghost <folder> i en terminal öppnar mappen här som ett projekt. Den läggs i ~/.local/bin."
"ghost <folder> opens it in Ghost: %{shown}":
  zh-CN: "ghost <文件夹> 会在 Ghost 中打开它：%{shown}"
  de: "ghost <folder> öffnet ihn in Ghost: %{shown}"
  es: "ghost <folder> la abre en Ghost: %{shown}"
  fr: "ghost <folder> l’ouvre dans Ghost : %{shown}"
  ja: "ghost <folder> で Ghost で開きます：%{shown}"
  ko: "ghost <folder>로 Ghost에서 열기: %{shown}"
  pt-BR: "ghost <folder> a abre no Ghost: %{shown}"
  ru: "ghost <folder> открывает её в Ghost: %{shown}"
  sv: "ghost <folder> öppnar den i Ghost: %{shown}"
"Ghost can send its makers counts of how it is used, never what you or your agents write, nor paths or names. Choose how much; Settings › Telemetry changes it later.":
  zh-CN: "Ghost 可以向开发者发送使用情况的统计，绝不包括你或智能体写的内容、路径或名称。选择发送多少；之后可在 设置 › 遥测 中更改。"
  de: "Ghost kann seinen Entwicklern Zählungen zur Nutzung senden, niemals, was Sie oder Ihre Agents schreiben, und auch keine Pfade oder Namen. Wählen Sie den Umfang; unter Einstellungen › Telemetrie lässt er sich später ändern."
  es: "Ghost puede enviar a sus creadores recuentos de cómo se usa, nunca lo que escribís tú o tus agentes, ni rutas ni nombres. Elige cuánto; Ajustes › Telemetría lo cambia después."
  fr: "Ghost peut envoyer à ses créateurs des statistiques d’utilisation, jamais ce que vous ou vos agents écrivez, ni chemins ni noms. Choisissez la quantité ; Réglages › Télémétrie permet de la changer plus tard."
  ja: "Ghost は使用状況の件数を開発元に送信できます。あなたやエージェントが書いた内容、パスや名前は送信しません。送信する量を選んでください。後から「設定 › テレメトリ」で変更できます。"
  ko: "Ghost는 개발자에게 사용 횟수를 보낼 수 있으며, 사용자나 에이전트가 작성한 내용, 경로 또는 이름은 절대 보내지 않습니다. 수준을 선택하십시오. 나중에 설정 › 원격 측정에서 변경할 수 있습니다."
  pt-BR: "O Ghost pode enviar aos criadores contagens de como é usado, nunca o que você ou seus agentes escrevem, nem caminhos ou nomes. Escolha quanto; Ajustes › Telemetria altera isso depois."
  ru: "Ghost может отправлять своим разработчикам статистику использования — но никогда то, что пишете вы или ваши агенты, а также пути и имена. Выберите объём; позже его можно изменить в Настройки › Телеметрия."
  sv: "Ghost kan skicka sina skapare siffror om hur den används, aldrig det du eller dina agenter skriver, inte heller sökvägar eller namn. Välj hur mycket; Inställningar › Telemetri ändrar det senare."
"Ghost closed while this turn was going on; the agent may have gone on with it.":
  zh-CN: "这一轮进行时 Ghost 被关闭了；智能体可能已继续执行。"
  de: "Ghost wurde geschlossen, während diese Runde lief; der Agent hat sie möglicherweise fortgesetzt."
  es: "Ghost se cerró mientras este turno estaba en curso; puede que el agente haya continuado."
  fr: "Ghost s’est fermé pendant ce tour ; l’agent a pu le poursuivre."
  ja: "このターンの途中で Ghost が終了しました。エージェントは続けていた可能性があります。"
  ko: "이 턴이 진행 중일 때 Ghost가 종료되었습니다. 에이전트가 계속 진행했을 수 있습니다."
  pt-BR: "O Ghost foi fechado durante este turno; o agente pode ter continuado."
  ru: "Ghost закрылся во время этого хода; агент мог продолжить его."
  sv: "Ghost stängdes medan den här omgången pågick; agenten kan ha fortsatt med den."
