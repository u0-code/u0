"In a session of its own, deleted once it answers; it spends what a turn spends.":
  zh-CN: "在独立会话中进行，回答后即删除；消耗与一轮对话相同。"
  de: "In einer eigenen Sitzung, die nach der Antwort gelöscht wird; sie kostet so viel wie eine Runde."
  es: "En una sesión propia, eliminada en cuanto responde; gasta lo que gasta un turno."
  fr: "Dans une session à part, supprimée dès qu’elle répond ; elle consomme ce que consomme un tour."
  ja: "専用のセッションで行い、回答後に削除されます。1 ターン分を消費します。"
  ko: "별도의 세션에서 실행되며 응답 후 삭제됩니다. 한 턴만큼의 사용량이 소모됩니다."
  pt-BR: "Em uma sessão própria, apagada assim que responde; consome o que um turno consome."
  ru: "В отдельном сеансе, который удаляется после ответа; тратит столько же, сколько ход."
  sv: "I en egen session, raderad när den har svarat; den kostar det en omgång kostar."
"In a session of yours, not one Ghost turns on its own (a task's, a workflow's), so that no task runs on its own runs. {{event}} in what it says is what happened, marked as data from outside.":
  zh-CN: "在你的会话中，而不是 Ghost 自行发起的会话（任务的、工作流的），这样任务不会因自身的运行而运行。其内容中的 {{event}} 是发生的事情，标记为来自外部的数据。"
  de: "In einer Sitzung von dir, nicht in einer, die Ghost selbst anstößt (die einer Aufgabe, eines Workflows), sodass keine Aufgabe auf ihre eigenen Läufe hin läuft. {{event}} in ihrem Text ist, was geschah, als Daten von außen markiert."
  es: "En una sesión tuya, no en una que Ghost inicie por su cuenta (de una tarea, de un flujo de trabajo), para que ninguna tarea se ejecute por sus propias ejecuciones. {{event}} en lo que dice es lo que ocurrió, marcado como datos de fuera."
  fr: "Dans une session à vous, pas dans une que Ghost lance de lui-même (celle d’une tâche, d’un workflow), pour qu’aucune tâche ne s’exécute sur ses propres exécutions. {{event}} dans ce qu’elle dit est ce qui s’est passé, marqué comme données venues de l’extérieur."
  ja: "Ghost が自分で始めたもの（タスクやワークフローのもの）ではなく、あなたのセッションで。こうすればタスクが自分の実行で動くことはありません。本文の {{event}} は起きたことで、外部からのデータとして示されます。"
  ko: "Ghost가 스스로 시작한 세션(작업, 워크플로의 세션)이 아닌 내 세션에서. 그래야 작업이 자신의 실행으로 실행되지 않습니다. 내용의 {{event}}는 일어난 일이며 외부 데이터로 표시됩니다."
  pt-BR: "Numa sessão sua, não numa que o Ghost inicia por conta própria (de uma tarefa, de um fluxo), para que nenhuma tarefa rode por suas próprias execuções. {{event}} no texto é o que aconteceu, marcado como dados de fora."
  ru: "В вашем сеансе, а не в том, что Ghost запускает сам (сеанс задачи, рабочего процесса), чтобы задача не запускалась от собственных запусков. {{event}} в тексте — то, что произошло, помеченное как данные извне."
  sv: "I en session av dina, inte en som Ghost startar själv (en uppgifts, ett arbetsflödes), så att ingen uppgift körs på sina egna körningar. {{event}} i det den säger är det som hände, märkt som data utifrån."
