"Where your projects' code and issues are. A token of yours is used over the CLI's own sign-in, and kept in the macOS Keychain, never in a file; it may be a 1Password reference (op://).":
  zh-CN: "你的项目代码和议题所在的平台。你的令牌优先于 CLI 自身的登录，保存在 macOS 钥匙串中，从不写入文件；也可以是 1Password 引用（op://）。"
  de: "Wo Code und Issues Ihrer Projekte liegen. Ein eigener Token wird statt der Anmeldung der CLI verwendet und im macOS-Keychain aufbewahrt, nie in einer Datei; er kann eine 1Password-Referenz sein (op://)."
  es: "Dónde están el código y los issues de tus proyectos. Un token tuyo se usa en lugar del inicio de sesión propio de la CLI, y se guarda en el Keychain de macOS, nunca en un archivo; puede ser una referencia de 1Password (op://)."
  fr: "Où se trouvent le code et les tickets de vos projets. Un jeton à vous est utilisé à la place de la connexion de la CLI, et conservé dans le Keychain de macOS, jamais dans un fichier ; ce peut être une référence 1Password (op://)."
  ja: "プロジェクトのコードとイシューがある場所。あなたのトークンは CLI 自身のサインインより優先して使われ、ファイルではなく macOS の Keychain に保存されます。1Password の参照（op://）も指定できます。"
  ko: "프로젝트의 코드와 이슈가 있는 곳. 사용자 토큰은 CLI 자체 로그인보다 우선 사용되며, 파일이 아닌 macOS Keychain에 보관됩니다. 1Password 참조(op://)일 수도 있습니다."
  pt-BR: "Onde estão o código e as issues dos seus projetos. Um token seu é usado no lugar do login da própria CLI e guardado no Keychain do macOS, nunca em um arquivo; ele pode ser uma referência do 1Password (op://)."
  ru: "Где находятся код и проблемы ваших проектов. Ваш токен используется вместо собственного входа CLI и хранится в macOS Keychain, а не в файле; это может быть ссылка 1Password (op://)."
  sv: "Där dina projekts kod och ärenden finns. En token som är din används i stället för CLI:ns egen inloggning och sparas i macOS Keychain, aldrig i en fil; den kan vara en 1Password-referens (op://)."
