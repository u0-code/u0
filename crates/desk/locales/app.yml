  fr: "Après chaque tour, dans la zone de saisie vide : Tab l’accepte, Échap l’ignore."
  ja: "各ターンの後、空の入力欄に表示：Tab で採用、Esc で破棄。"
  ko: "각 턴이 끝난 후 비어 있는 작성기에서 Tab을 누르면 적용, Esc를 누르면 무시합니다."
