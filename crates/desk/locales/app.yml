"Work in stages, run by Ghost's server as one run that outlives a restart: each step's result is kept as it ends, and a step that fails pauses the run there.":
  zh-CN: "分阶段工作，由 Ghost 的服务器作为一次可跨越重启的运行来执行：每一步结束时保存其结果，失败的步骤会让运行在此暂停。"
  de: "In Stufen arbeiten, vom Server von Ghost als ein Lauf ausgeführt, der einen Neustart überdauert: Das Ergebnis jedes Schritts wird bei seinem Ende gespeichert, und ein fehlgeschlagener Schritt pausiert den Lauf dort."
  es: "Trabaja por etapas, ejecutadas por el servidor de Ghost como una ejecución que sobrevive a un reinicio: el resultado de cada paso se guarda al terminar, y un paso que falla pausa la ejecución ahí."
  fr: "Travaillez par étapes, exécutées par le serveur de Ghost en une exécution qui survit à un redémarrage : le résultat de chaque étape est conservé à sa fin, et une étape qui échoue met l’exécution en pause à cet endroit."
  ja: "段階的に作業します。Ghost のサーバが再起動をまたいで 1 回の実行として進めます。各ステップの結果は終了時に保存され、失敗したステップでは実行がそこで一時停止します。"
  ko: "단계별로 작업하며, Ghost의 서버가 재시작 후에도 유지되는 하나의 실행으로 수행합니다. 각 단계의 결과는 끝날 때 보관되며, 실패한 단계에서 실행이 일시 정지됩니다."
  pt-BR: "Trabalhe em etapas, executadas pelo servidor do Ghost como uma execução que sobrevive a um reinício: o resultado de cada etapa é guardado ao terminar, e uma etapa que falha pausa a execução ali."
  ru: "Работа по этапам, которую сервер Ghost выполняет как один запуск, переживающий перезапуск: результат каждого шага сохраняется по его завершении, а сбой шага приостанавливает запуск на нём."
  sv: "Arbeta i etapper, körda av Ghosts server som en körning som överlever en omstart: varje stegs resultat sparas när det slutar, och ett steg som misslyckas pausar körningen där."
