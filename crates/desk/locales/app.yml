"Another account is the agent run again with its own sign-in and settings, side by side with this one: a session begun in it stays with it.":
  zh-CN: "另一个账户会以独立的登录和设置再运行一个该智能体，与当前的并存：在其中开始的会话会一直属于它。"
  de: "Ein weiterer Account ist der Agent, erneut ausgeführt mit eigener Anmeldung und eigenen Einstellungen, neben diesem: Eine darin begonnene Sitzung bleibt dort."
  es: "Otra cuenta es el agente ejecutado de nuevo con su propio inicio de sesión y ajustes, junto a este: una sesión iniciada en ella se queda con ella."
  fr: "Un autre compte est l’agent relancé avec sa propre connexion et ses propres réglages, à côté de celui-ci : une session commencée dans l’un y reste."
  ja: "別のアカウントでは、独自のサインインと設定でエージェントをもう 1 つ実行し、現在のものと並行して使えます。そこで開始したセッションはそのアカウントに属します。"
  ko: "다른 계정은 이 계정과 나란히 자체 로그인과 설정으로 에이전트를 다시 실행하는 것입니다. 거기서 시작한 세션은 그 계정에 남습니다."
  pt-BR: "Outra conta é o agente executado novamente com login e ajustes próprios, lado a lado com esta: uma sessão iniciada nela permanece nela."
  ru: "Другая учётная запись — это тот же агент, запущенный снова со своим входом и настройками рядом с этим: начатый в ней сеанс остаётся в ней."
  sv: "Ett annat konto är agenten körd igen med egen inloggning och egna inställningar, sida vid sida med detta: en session som påbörjas i det stannar i det."
