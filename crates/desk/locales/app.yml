  sv: "Startar %{command} en gång och läser dess version och förmågor."
"Starts %{name} in the session's folder, sends what you say, and draws what it reports. Edits, commands and permissions are %{name}'s own; Ghost only asks you when it asks.":
  zh-CN: "在会话的文件夹中启动 %{name}，转发你说的话，并显示它报告的内容。编辑、命令和权限都由 %{name} 自行处理；Ghost 只在它请求时询问你。"
  de: "Startet %{name} im Ordner der Sitzung, sendet, was Sie sagen, und zeichnet, was es meldet. Bearbeitungen, Befehle und Berechtigungen gehören zu %{name}; Ghost fragt Sie nur, wenn es fragt."
  es: "Inicia %{name} en la carpeta de la sesión, envía lo que dices y dibuja lo que informa. Las ediciones, los comandos y los permisos son de %{name}; Ghost solo te pregunta cuando él pregunta."
  fr: "Démarre %{name} dans le dossier de la session, envoie ce que vous dites et affiche ce qu’il rapporte. Modifications, commandes et autorisations relèvent de %{name} ; Ghost ne vous demande que lorsqu’il demande."
  ja: "セッションのフォルダで %{name} を起動し、あなたの発言を送り、報告内容を表示します。編集、コマンド、権限は %{name} 自身のものです。Ghost はそれが確認を求めたときだけあなたに尋ねます。"
  ko: "세션의 폴더에서 %{name}을(를) 시작하고, 입력한 내용을 보내며, 보고하는 내용을 그립니다. 편집, 명령 및 권한은 %{name} 자체의 것이며, Ghost는 에이전트가 요청할 때만 사용자에게 묻습니다."
  pt-BR: "Inicia %{name} na pasta da sessão, envia o que você diz e desenha o que ele relata. Edições, comandos e permissões são do próprio %{name}; o Ghost só pergunta a você quando ele pergunta."
  ru: "Запускает %{name} в папке сеанса, отправляет ваши сообщения и отображает его отчёты. Правки, команды и разрешения — дело %{name}; Ghost спрашивает вас только тогда, когда спрашивает он."
  sv: "Startar %{name} i sessionens mapp, skickar det du säger och ritar det den rapporterar. Redigeringar, kommandon och behörigheter är %{name}s egna; Ghost frågar dig bara när den frågar."
