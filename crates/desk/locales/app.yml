  fr: "Ses réglages sont affichés tels qu’envoyés la dernière fois et pourront être modifiés dès son retour. u0 réessaie de lui-même en espaçant les essais jusqu’à 30 secondes."
  ja: "最後に受信した設定を表示しています。再接続後に変更できます。u0 は最大 30 秒まで間隔を広げながら自動的に再試行します。"
  ko: "마지막으로 받은 설정이 표시되며 다시 연결되면 변경할 수 있습니다. u0가 최대 30초까지 간격을 늘리며 자동으로 재시도합니다."
  pt-BR: "As configurações são mostradas como enviadas pela última vez e poderão ser alteradas quando voltar. O u0 tenta novamente sozinho, esperando mais a cada tentativa, até 30 segundos."
  ru: "Показаны последние полученные настройки; изменить их можно будет после восстановления связи. u0 повторяет попытки автоматически с увеличивающимся интервалом до 30 секунд."
  sv: "Inställningarna visas som de senast skickades och kan ändras igen när den är tillbaka. u0 försöker igen automatiskt och väntar längre varje gång, upp till 30 sekunder."
