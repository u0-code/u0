"Path: %{path}\nGhost forgets these sessions and their records. Each agent keeps its own sessions.\nFiles on disk are not touched.\nThis cannot be undone.":
  zh-CN: "路径：%{path}\nGhost 将忘记这些会话及其记录。各智能体仍保留自己的会话。\n磁盘上的文件不受影响。\n此操作无法撤销。"
  de: "Pfad: %{path}\nGhost vergisst diese Sitzungen und ihre Aufzeichnungen. Jeder Agent behält seine eigenen Sitzungen.\nDateien auf dem Datenträger bleiben unberührt.\nDies kann nicht widerrufen werden."
  es: "Ruta: %{path}\nGhost olvida estas sesiones y sus registros. Cada agente conserva sus propias sesiones.\nLos archivos en disco no se tocan.\nNo se puede deshacer."
  fr: "Chemin : %{path}\nGhost oublie ces sessions et leurs enregistrements. Chaque agent conserve ses propres sessions.\nLes fichiers sur le disque ne sont pas touchés.\nCette action est irréversible."
  ja: "パス：%{path}\nGhost はこれらのセッションとその記録を忘れます。各エージェントは自分のセッションを保持します。\nディスク上のファイルには触れません。\nこの操作は取り消せません。"
  ko: "경로: %{path}\nGhost는 이 세션과 기록을 지웁니다. 각 에이전트는 자체 세션을 보관합니다.\n디스크의 파일은 건드리지 않습니다.\n이 작업은 실행 취소할 수 없습니다."
  pt-BR: "Caminho: %{path}\nO Ghost esquece estas sessões e os registros delas. Cada agente mantém as próprias sessões.\nOs arquivos no disco não são tocados.\nIsso não pode ser desfeito."
  ru: "Путь: %{path}\nGhost забудет эти сеансы и их записи. Каждый агент хранит свои сеансы сам.\nФайлы на диске не затрагиваются.\nЭто действие нельзя отменить."
  sv: "Sökväg: %{path}\nGhost glömmer de här sessionerna och deras register. Varje agent behåller sina egna sessioner.\nFiler på disken rörs inte.\nDetta kan inte ångras."
