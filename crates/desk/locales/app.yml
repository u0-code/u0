  de: "Wo Return nicht sendet, bricht es die Zeile um. Die andere Taste (⌘Return oder ⇧⌘Return) beginnt daneben einen weiteren Thread oder bewirkt während einer laufenden Runde das Gegenteil der obigen Einstellung."
  es: "Donde Return no envía, inserta un salto de línea. La otra tecla (⌘Return, o ⇧⌘Return) inicia otro hilo junto a él, o mientras hay un turno en curso hace lo contrario del ajuste de arriba."
  fr: "Là où Retour n’envoie pas, il insère un saut de ligne. L’autre touche (⌘Retour, ou ⇧⌘Retour) démarre un autre fil à côté, ou pendant un tour fait l’inverse du réglage ci-dessus."
  ja: "Return で送信しない場合は改行します。もう一方のキー（⌘Return または ⇧⌘Return）は横に別のスレッドを開始します。ターンの進行中は、上の設定と逆の動作をします。"
  ko: "Return으로 보내지 않을 때는 줄을 바꿉니다. 다른 키(⌘Return 또는 ⇧⌘Return)는 옆에 다른 스레드를 시작하거나, 턴이 진행 중일 때는 위 설정과 반대로 동작합니다."
  pt-BR: "Onde Return não envia, ele quebra a linha. A outra tecla (⌘Return ou ⇧⌘Return) inicia outra thread ao lado, ou, durante um turno, faz o oposto do ajuste acima."
  ru: "Там, где Return не отправляет, он переносит строку. Другая клавиша (⌘Return или ⇧⌘Return) начинает рядом ещё один тред, а во время хода делает противоположное настройке выше."
  sv: "Där Retur inte skickar bryter den raden. Den andra tangenten (⌘Retur eller ⇧⌘Retur) börjar en annan tråd bredvid, eller gör motsatsen till inställningen ovan medan en omgång pågår."
