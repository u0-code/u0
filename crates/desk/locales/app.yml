"Nothing is copied. Each agent lists its own threads, by project; a thread is loaded from its agent when you open it, and goes on from there.":
  zh-CN: "不会复制任何内容。每个智能体按项目列出自己的线程；打开线程时从该智能体加载并继续。"
  de: "Nichts wird kopiert. Jeder Agent listet seine eigenen Threads nach Projekt auf; beim Öffnen wird der Thread geladen und dort fortgesetzt."
  es: "No se copia nada. Cada agente lista sus propios hilos por proyecto; al abrirlo se carga desde su agente y continúa desde ahí."
  fr: "Rien n'est copié. Chaque agent liste ses propres fils par projet ; un fil est chargé depuis son agent à l'ouverture et reprend là."
  ja: "コピーは行われません。各エージェントがプロジェクトごとに自身のスレッドを一覧し、開くとその場から続きを行えます。"
  ko: "아무것도 복사되지 않습니다. 각 에이전트가 프로젝트별로 자체 스레드를 나열하며 열 때 에이전트에서 불러와 이어갑니다."
  pt-BR: "Nada é copiado. Cada agente lista seus próprios threads por projeto; ao abrir, o thread é carregado do agente e continua dali."
  ru: "Ничего не копируется. Каждый агент показывает свои треды по проектам; при открытии тред загружается из агента и продолжается."
  sv: "Inget kopieras. Varje agent listar sina egna trådar per projekt; en tråd laddas från sin agent när du öppnar den."
"On %{branch}, %{files} are not in any commit. They go too.":
  zh-CN: "在分支 %{branch} 上，%{files} 尚未提交，它们也会一并被删除。"
  de: "Auf %{branch} sind %{files} in keinem Commit enthalten. Sie werden ebenfalls gelöscht."
  es: "En %{branch}, %{files} no están en ninguna confirmación. También se eliminarán."
  fr: "Sur %{branch}, %{files} ne figurent dans aucune validation. Ils seront aussi supprimés."
  ja: "%{branch} 上の %{files} は未コミットです。これらも削除されます。"
  ko: "%{branch}에서 %{files} 파일이 어떤 커밋에도 포함되어 있지 않습니다. 함께 삭제됩니다."
  pt-BR: "Em %{branch}, %{files} não estão em nenhum commit. Eles também serão removidos."
  ru: "В ветке %{branch} файлы %{files} не закоммичены. Они тоже будут удалены."
  sv: "På %{branch} finns %{files} inte i någon commit. De tas också bort."
"Only files change; the conversation stays as it is. Redo brings the changes back, and your own uncommitted work is kept. Click a file to preview what goes back.":
  zh-CN: "只有文件会更改；对话内容保持不变。“重做”可找回这些改动，且你自己的未提交工作会保留。点按文件可预览将恢复的内容。"
  de: "Nur Dateien ändern sich; die Unterhaltung bleibt bestehen. Wiederholen stellt die Änderungen wieder her, eigene uncommittete Arbeit bleibt erhalten. Datei anklicken für Vorschau."
  es: "Solo cambian los archivos; la conversación sigue igual. Rehacer recupera los cambios y tu trabajo sin confirmar se conserva. Haz clic en un archivo para previsualizar."
  fr: "Seuls les fichiers changent ; la conversation reste intacte. Rétablir remet les modifications et votre travail non validé est conservé. Cliquez sur un fichier pour l'aperçu."
  ja: "変更されるのはファイルのみで、会話はそのまま残ります。やり直しで変更を戻せ、自分の未コミット作業も保たれます。ファイルをクリックしてプレビューできます。"
  ko: "파일만 변경되며 대화 내용은 그대로 유지됩니다. 다시 실행으로 변경 사항을 복원할 수 있고 커밋하지 않은 작업도 보존됩니다. 파일을 클릭해 미리 보세요."
  pt-BR: "Apenas os arquivos mudam; a conversa permanece igual. Refazer traz as alterações de volta e seu trabalho não confirmado é mantido. Clique em um arquivo para visualizar."
  ru: "Меняются только файлы, переписка остаётся прежней. Повтор вернёт изменения, а ваши незакоммиченные правки сохранятся. Нажмите на файл для предпросмотра."
  sv: "Endast filer ändras; konversationen förblir som den är. Gör om tar tillbaka ändringarna och ditt eget arbete behålls. Klicka på en fil för att förhandsgranska."
