"How Merge beside a thread, and merging once its checks pass, merge a pull request; the PRs page offers each.":
  zh-CN: "线程旁的「合并」以及检查通过后自动合并时，拉取请求的合并方式；PR 页面提供每一种。"
  de: "Wie „Mergen“ neben einem Thread und das Mergen nach bestandenen Prüfungen einen Pull Request mergen; die PR-Seite bietet beides an."
  es: "Cómo fusionan un pull request Fusionar junto a un hilo y la fusión al pasar sus comprobaciones; la página de PR ofrece cada uno."
  fr: "Comment Fusionner à côté d’un fil, et la fusion une fois ses vérifications réussies, fusionnent une pull request ; la page des PR propose chacune."
  ja: "スレッド横の「マージ」と、チェック通過後のマージで、プルリクエストをどうマージするか。PR ページではそれぞれを選べます。"
  ko: "스레드 옆의 병합과 검사 통과 후 병합이 풀 리퀘스트를 병합하는 방식입니다. PR 페이지에서 각각 선택할 수 있습니다."
  pt-BR: "Como Merge ao lado de uma thread, e o merge assim que as verificações passarem, fazem merge de um pull request; a página de PRs oferece cada um."
  ru: "Как «Слить» рядом с тредом и слияние после прохождения проверок сливают пул-реквест; страница PR предлагает каждый способ."
  sv: "Hur Sammanfoga bredvid en tråd, och sammanfogning när kontrollerna har gått igenom, sammanfogar en pull request; PR-sidan erbjuder båda."
