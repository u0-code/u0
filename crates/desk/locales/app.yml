"Read only: it watches threads, diffs and your projects' files, and changes nothing. Its calls are checked here, on this Mac.":
  zh-CN: "只读：它查看线程、差异和你项目中的文件，不做任何更改。它的调用在这台 Mac 上检查。"
  de: "Nur lesen: Es sieht Threads, Diffs und die Dateien deiner Projekte und ändert nichts. Seine Aufrufe werden hier auf diesem Mac geprüft."
  es: "Solo lectura: ve hilos, diffs y los archivos de tus proyectos, y no cambia nada. Sus llamadas se comprueban aquí, en este Mac."
  fr: "Lecture seule : il voit les fils, les diffs et les fichiers de vos projets, et ne change rien. Ses appels sont vérifiés ici, sur ce Mac."
  ja: "読み取りのみ：スレッド、差分、プロジェクトのファイルを見るだけで、何も変更しません。呼び出しはこの Mac で確認されます。"
  ko: "읽기 전용: 스레드, 차이, 프로젝트 파일을 보기만 하고 아무것도 바꾸지 않습니다. 호출은 이 Mac에서 확인됩니다."
  pt-BR: "Somente leitura: vê threads, diffs e os arquivos dos seus projetos, e não muda nada. Suas chamadas são verificadas aqui, neste Mac."
  ru: "Только чтение: видит треды, изменения и файлы ваших проектов и ничего не меняет. Его вызовы проверяются здесь, на этом Mac."
