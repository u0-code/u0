"The files are back as they were before turn %{turn}. %{name} still remembers that turn: tell it what changed.":
  zh-CN: "文件已恢复到第 %{turn} 轮之前的样子。%{name} 仍记得那一轮：请告诉它发生了什么变化。"
  de: "Die Dateien sind wieder auf dem Stand vor Runde %{turn}. %{name} erinnert sich noch an diese Runde: Sagen Sie, was sich geändert hat."
  es: "Los archivos están como antes del turno %{turn}. %{name} aún recuerda ese turno: dile qué cambió."
  fr: "Les fichiers sont revenus à leur état d’avant le tour %{turn}. %{name} se souvient encore de ce tour : dites-lui ce qui a changé."
  ja: "ファイルはターン %{turn} の前の状態に戻りました。%{name} はそのターンをまだ覚えています。何が変わったか伝えてください。"
  ko: "파일이 턴 %{turn} 이전 상태로 되돌아갔습니다. %{name}은(는) 아직 그 턴을 기억하므로 무엇이 바뀌었는지 알려 주십시오."
  pt-BR: "Os arquivos voltaram a ser como antes do turno %{turn}. %{name} ainda se lembra desse turno: diga a ele o que mudou."
  ru: "Файлы возвращены к состоянию до хода %{turn}. %{name} всё ещё помнит этот ход: скажите ему, что изменилось."
  sv: "Filerna är tillbaka som de var före omgång %{turn}. %{name} minns fortfarande den omgången: berätta för den vad som ändrats."
