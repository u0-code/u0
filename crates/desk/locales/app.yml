"%{lets_in}. Works once, for ten minutes (made %{ago}): open it on the other Mac, or scan its code, or paste it under Pair with another Mac there.":
  zh-CN: "%{lets_in}。可用一次，有效十分钟（%{ago}生成）：在另一台 Mac 上打开它，或扫描其二维码，或粘贴到那边的“与另一台 Mac 配对”。"
  de: "%{lets_in}. Gilt einmal, zehn Minuten lang (erstellt %{ago}): Öffne ihn auf dem anderen Mac, scanne seinen Code oder füge ihn dort unter Mit einem anderen Mac koppeln ein."
  es: "%{lets_in}. Sirve una vez, durante diez minutos (creado %{ago}): ábrelo en el otro Mac, escanea su código o pégalo allí en Emparejar con otro Mac."
  fr: "%{lets_in}. Valable une fois, pendant dix minutes (créé %{ago}) : ouvrez-le sur l’autre Mac, scannez son code ou collez-le là-bas sous Associer à un autre Mac."
  ja: "%{lets_in}。1 回だけ、10 分間有効（%{ago}作成）：もう一方の Mac で開くか、コードを読み取るか、そちらの「別の Mac とペアリング」に貼り付けます。"
  ko: "%{lets_in}. 한 번, 10분 동안 유효합니다(%{ago} 생성): 다른 Mac에서 열거나 코드를 스캔하거나 그곳의 다른 Mac과 페어링에 붙여 넣으세요."
  pt-BR: "%{lets_in}. Vale uma vez, por dez minutos (criado %{ago}): abra-o no outro Mac, escaneie o código ou cole-o lá em Parear com outro Mac."
  ru: "%{lets_in}. Действует один раз, десять минут (создана %{ago}): откройте её на другом Mac, отсканируйте код или вставьте там в «Связать с другим Mac»."
  sv: "%{lets_in}. Fungerar en gång, i tio minuter (skapad %{ago}): öppna den på den andra Macen, skanna dess kod eller klistra in den där under Parkoppla med en annan Mac."
