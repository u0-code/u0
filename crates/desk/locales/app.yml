"Starts %{name} in the thread's folder, sends what you say, and draws what it reports. Edits, commands and permissions are %{name}'s own; u0 only asks you when it asks.":
  zh-CN: "在线程的文件夹中启动 %{name}，转发你说的话，并显示它报告的内容。编辑、命令和权限都由 %{name} 自行处理；u0 只在它请求时询问你。"
  de: "Startet %{name} im Ordner des Threads, sendet, was Sie sagen, und zeichnet, was es meldet. Bearbeitungen, Befehle und Berechtigungen gehören zu %{name}; u0 fragt Sie nur, wenn es fragt."
  es: "Inicia %{name} en la carpeta del hilo, envía lo que dices y dibuja lo que informa. Las ediciones, los comandos y los permisos son de %{name}; u0 solo te pregunta cuando él pregunta."
  fr: "Démarre %{name} dans le dossier du fil, envoie ce que vous dites et affiche ce qu’il rapporte. Modifications, commandes et autorisations relèvent de %{name} ; u0 ne vous demande que lorsqu’il demande."
  ja: "スレッドのフォルダで %{name} を起動し、あなたの発言を送り、報告内容を表示します。編集、コマンド、権限は %{name} 自身のものです。u0 はそれが確認を求めたときだけあなたに尋ねます。"
  ko: "스레드의 폴더에서 %{name}을(를) 시작하고, 입력한 내용을 보내며, 보고하는 내용을 그립니다. 편집, 명령 및 권한은 %{name} 자체의 것이며, u0는 에이전트가 요청할 때만 사용자에게 묻습니다."
  pt-BR: "Inicia %{name} na pasta da thread, envia o que você diz e desenha o que ele relata. Edições, comandos e permissões são do próprio %{name}; o u0 só pergunta a você quando ele pergunta."
  ru: "Запускает %{name} в папке треда, отправляет ваши сообщения и отображает его отчёты. Правки, команды и разрешения — дело %{name}; u0 спрашивает вас только тогда, когда спрашивает он."
  sv: "Startar %{name} i trådens mapp, skickar det du säger och ritar det den rapporterar. Redigeringar, kommandon och behörigheter är %{name}s egna; u0 frågar dig bara när den frågar."
