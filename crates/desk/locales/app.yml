"As u0 starts and each time it fetches, while it is checked out with nothing changed, and only where it moves straight on.":
  zh-CN: "在 u0 启动和每次拉取时，若已检出且无改动，并且只能快进时进行。"
  de: "Beim Start von u0 und bei jedem Fetch, solange er ohne Änderungen ausgecheckt ist, und nur, wenn er direkt vorrücken kann."
  es: "Al iniciarse u0 y cada vez que hace fetch, mientras tiene checkout sin cambios, y solo cuando avanza directamente."
  fr: "Au démarrage de u0 et à chaque fetch, tant qu’elle est extraite sans modification, et seulement quand elle avance directement."
  ja: "u0 の起動時とフェッチのたびに、変更なしでチェックアウトされていて、早送りできる場合のみ。"
  ko: "u0가 시작될 때와 가져올 때마다, 변경 사항 없이 체크아웃된 상태이고 바로 앞으로 이동할 수 있는 경우에만."
  pt-BR: "Ao iniciar o u0 e a cada fetch, enquanto estiver com checkout feito sem alterações, e apenas quando avançar diretamente."
  ru: "При запуске u0 и при каждом получении изменений, если ветка переключена и ничего не изменено, и только при перемотке вперёд."
  sv: "När u0 startar och varje gång den hämtar, medan den är utcheckad utan ändringar, och bara där den kan flyttas rakt fram."
"As u0 starts and every four hours; an update is installed only when you say.":
  zh-CN: "u0 启动时及每四小时检查一次；只有在你同意时才会安装更新。"
  de: "Beim Start von u0 und alle vier Stunden; ein Update wird nur auf Ihr Kommando installiert."
  es: "Al iniciarse u0 y cada cuatro horas; una actualización solo se instala cuando lo indiques."
  fr: "Au démarrage de u0 et toutes les quatre heures ; une mise à jour n’est installée que sur votre demande."
  ja: "u0 の起動時と 4 時間ごと。アップデートはあなたが指示したときのみインストールされます。"
  ko: "u0가 시작될 때와 4시간마다. 업데이트는 사용자가 지시할 때만 설치됩니다."
  pt-BR: "Ao iniciar o u0 e a cada quatro horas; uma atualização só é instalada quando você mandar."
  ru: "При запуске u0 и каждые четыре часа; обновление устанавливается только с вашего согласия."
  sv: "När u0 startar och var fjärde timme; en uppdatering installeras bara när du säger till."
