"u0 has no model of its own: an agent of yours writes what u0 writes for you.":
  zh-CN: "u0 没有自己的模型：u0 为你写的内容由你的某个智能体撰写。"
  de: "u0 hat kein eigenes Modell: Einer Ihrer Agents schreibt, was u0 für Sie schreibt."
  es: "u0 no tiene modelo propio: un agente tuyo escribe lo que u0 escribe por ti."
  fr: "u0 n’a pas de modèle à lui : c’est un de vos agents qui écrit ce que u0 rédige pour vous."
  ja: "u0 には独自のモデルがありません。u0 があなたのために書く内容は、あなたのエージェントが書きます。"
  ko: "u0에는 자체 모델이 없습니다. u0가 대신 작성하는 내용은 사용자의 에이전트가 작성합니다."
  pt-BR: "O u0 não tem modelo próprio: um agente seu escreve o que o u0 escreve para você."
  ru: "У u0 нет своей модели: то, что u0 пишет для вас, пишет один из ваших агентов."
  sv: "u0 har ingen egen modell: en av dina agenter skriver det u0 skriver åt dig."
"u0 keeps its settings and the agents it installs in %{home}.":
  zh-CN: "u0 将设置和安装的智能体保存在 %{home}。"
  de: "u0 bewahrt seine Einstellungen und die installierten Agents in %{home} auf."
  es: "u0 guarda sus ajustes y los agentes que instala en %{home}."
  fr: "u0 conserve ses réglages et les agents qu’il installe dans %{home}."
  ja: "u0 は設定とインストールしたエージェントを %{home} に保存します。"
  ko: "u0는 설정과 설치한 에이전트를 %{home}에 보관합니다."
  pt-BR: "O u0 guarda os ajustes e os agentes que instala em %{home}."
  ru: "u0 хранит свои настройки и установленных агентов в %{home}."
  sv: "u0 sparar sina inställningar och agenterna den installerar i %{home}."
