"A POST to it runs the task; {{body}} in what it says is what was sent, marked as data from outside. A call made while u0 is not running is not held: the sender has to send it again.":
  zh-CN: "向它发送 POST 即运行任务；提示中的 {{body}} 会替换为发送的内容，并标记为来自外部的数据。u0 未运行时的调用不会被保留：发送方需要重新发送。"
  de: "Ein POST darauf führt die Aufgabe aus; {{body}} darin ist das Gesendete, als Daten von außen markiert. Ein Aufruf, während u0 nicht läuft, wird nicht gehalten: Der Absender muss ihn erneut senden."
  es: "Un POST a esta dirección ejecuta la tarea; {{body}} en lo que dice es lo que se envió, marcado como datos externos. Una llamada hecha mientras u0 no está en ejecución no se guarda: el remitente tiene que enviarla de nuevo."
  fr: "Un POST vers cette adresse exécute la tâche ; {{body}} dans ce qu’elle dit est ce qui a été envoyé, marqué comme données venant de l’extérieur. Un appel fait quand u0 ne tourne pas n’est pas conservé : l’expéditeur doit le renvoyer."
  ja: "POST を送るとタスクが実行されます。プロンプト内の {{body}} は送信された内容に置き換えられ、外部からのデータとしてマークされます。u0 が実行されていない間の呼び出しは保持されないため、送信側が再送する必要があります。"
  ko: "여기로 POST를 보내면 작업이 실행됩니다. 내용의 {{body}}는 전송된 내용이며 외부 데이터로 표시됩니다. u0가 실행 중이 아닐 때의 호출은 보관되지 않으므로 보낸 쪽에서 다시 보내야 합니다."
  pt-BR: "Um POST para ele executa a tarefa; {{body}} no texto é o que foi enviado, marcado como dado externo. Uma chamada feita enquanto o u0 não está em execução não é guardada: o remetente precisa enviá-la novamente."
  ru: "POST-запрос к нему запускает задачу; {{body}} в её тексте — это то, что было отправлено, помеченное как внешние данные. Вызов, сделанный, когда u0 не запущен, не сохраняется: отправителю нужно повторить его."
  sv: "En POST till den kör uppgiften; {{body}} i det den säger är det som skickades, markerat som data utifrån. Ett anrop som görs medan u0 inte körs sparas inte: avsändaren måste skicka det igen."
"A POST to it runs the task; {{body}}, {{body.<field>}} or {{header.<name>}} in what it says is what was sent, marked as data from outside; it can still try to steer the agent, so read it as you would anything pasted in. A call made while u0 is not running is not held: the sender has to send it again.":
  zh-CN: "向它发送 POST 即运行任务；其内容中的 {{body}}、{{body.<field>}} 或 {{header.<name>}} 是发送来的内容，标记为来自外部的数据；它仍可能试图引导智能体，请像对待任何粘贴进来的内容一样看待它。u0 未运行时的调用不会保留：发送方需要重新发送。"
  de: "Ein POST an sie führt die Aufgabe aus; {{body}}, {{body.<field>}} oder {{header.<name>}} in ihrem Text ist das Gesendete, als Daten von außen markiert; es kann dennoch versuchen, den Agenten zu lenken, also lies es wie alles Eingefügte. Ein Aufruf, während u0 nicht läuft, wird nicht gehalten: Der Absender muss ihn erneut senden."
  es: "Un POST a ella ejecuta la tarea; {{body}}, {{body.<field>}} o {{header.<name>}} en lo que dice es lo enviado, marcado como datos de fuera; aun así puede intentar dirigir al agente, así que léelo como cualquier cosa pegada. Una llamada hecha mientras u0 no se ejecuta no se guarda: el remitente debe enviarla de nuevo."
  fr: "Un POST vers elle lance la tâche ; {{body}}, {{body.<field>}} ou {{header.<name>}} dans ce qu’elle dit est ce qui a été envoyé, marqué comme données venues de l’extérieur ; cela peut tout de même tenter d’orienter l’agent, lisez-le donc comme tout ce qui est collé. Un appel fait pendant que u0 ne tourne pas n’est pas gardé : l’expéditeur doit le renvoyer."
  ja: "これへの POST でタスクが実行されます。本文の {{body}}、{{body.<field>}}、{{header.<name>}} は送られた内容で、外部からのデータとして示されます。それでもエージェントを誘導しようとすることがあるので、貼り付けた内容と同じように扱ってください。u0 が動いていない間の呼び出しは保持されないため、送信元が送り直す必要があります。"
  ko: "여기에 POST하면 작업이 실행됩니다. 내용의 {{body}}, {{body.<field>}}, {{header.<name>}}는 보낸 내용이며 외부 데이터로 표시됩니다. 그래도 에이전트를 조종하려 할 수 있으니 붙여 넣은 내용처럼 읽으세요. u0가 실행 중이 아닐 때의 호출은 보관되지 않으므로 보내는 쪽이 다시 보내야 합니다."
  pt-BR: "Um POST nela executa a tarefa; {{body}}, {{body.<field>}} ou {{header.<name>}} no texto é o que foi enviado, marcado como dados de fora; ainda pode tentar conduzir o agente, então leia como qualquer coisa colada. Uma chamada feita enquanto o u0 não está rodando não é guardada: o remetente precisa enviá-la de novo."
  ru: "POST на неё запускает задачу; {{body}}, {{body.<field>}} или {{header.<name>}} в тексте — то, что прислали, помеченное как данные извне; это всё равно может пытаться направлять агента, так что читайте это как любой вставленный текст. Вызов, сделанный, пока u0 не запущен, не сохраняется: отправителю придётся прислать его снова."
  sv: "En POST till den kör uppgiften; {{body}}, {{body.<field>}} eller {{header.<name>}} i det den säger är det som skickades, märkt som data utifrån; det kan ändå försöka styra agenten, så läs det som allt du klistrar in. Ett anrop som görs medan u0 inte körs sparas inte: avsändaren måste skicka det igen."
"A clone goes in <host>/<owner>/<repo> there, as ghq lays them out.":
  zh-CN: "克隆放在其中的 <host>/<owner>/<repo>，与 ghq 的布局相同。"
  de: "Ein Klon kommt dort nach <host>/<owner>/<repo>, so wie ghq sie anordnet."
  es: "Un clon va en <host>/<owner>/<repo> allí, como los organiza ghq."
  fr: "Un clone va dans <host>/<owner>/<repo> à cet endroit, comme les dispose ghq."
  ja: "クローンは ghq の配置と同じく、そこの <host>/<owner>/<repo> に置かれます。"
  ko: "복제본은 ghq 방식대로 그곳의 <host>/<owner>/<repo>에 저장됩니다."
  pt-BR: "Um clone vai para <host>/<owner>/<repo> lá, como o ghq os organiza."
  ru: "Клон помещается туда в <host>/<owner>/<repo>, как это делает ghq."
  sv: "En klon hamnar i <host>/<owner>/<repo> där, så som ghq ordnar dem."
"A command of yours starts it instead of the registry's way (your own build, a version manager's): it must speak ACP on its standard input and output.":
  zh-CN: "用你自己的命令代替注册表的方式启动它（你自己的构建、版本管理器提供的）：它必须在标准输入输出上使用 ACP。"
  de: "Ein eigener Befehl startet es statt des Wegs der Registry (Ihr eigener Build, der eines Versionsmanagers): Er muss ACP über Standardeingabe und -ausgabe sprechen."
  es: "Un comando tuyo lo inicia en lugar del método del registro (tu propia compilación, la de un gestor de versiones): debe hablar ACP por su entrada y salida estándar."
  fr: "Une commande à vous le démarre au lieu de la méthode du registre (votre propre build, celle d’un gestionnaire de versions) : elle doit parler ACP sur son entrée et sa sortie standard."
  ja: "レジストリの方法の代わりに独自のコマンドで起動します（独自ビルドやバージョンマネージャのものなど）。標準入出力で ACP を話す必要があります。"
  ko: "레지스트리 방식 대신 사용자 명령으로 시작합니다(직접 빌드한 버전, 버전 관리자 등). 표준 입력과 출력으로 ACP를 사용해야 합니다."
  pt-BR: "Um comando seu o inicia em vez do modo do registro (seu próprio build, o de um gerenciador de versões): ele precisa falar ACP pela entrada e saída padrão."
  ru: "Ваша команда запускает его вместо способа из реестра (ваша сборка, менеджер версий): она должна говорить на ACP через стандартный ввод и вывод."
  sv: "Ett eget kommando startar den i stället för registrets sätt (ditt eget bygge, en versionshanterares): det måste tala ACP på sin standard in- och utmatning."
