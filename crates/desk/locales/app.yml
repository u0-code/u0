"As Ghost starts and each time it fetches, while it is checked out with nothing changed, and only where it moves straight on.":
  zh-CN: "在 Ghost 启动和每次拉取时，若已检出且无改动，并且只能快进时进行。"
  de: "Beim Start von Ghost und bei jedem Fetch, solange er ohne Änderungen ausgecheckt ist, und nur, wenn er direkt vorrücken kann."
  es: "Al iniciarse Ghost y cada vez que hace fetch, mientras tiene checkout sin cambios, y solo cuando avanza directamente."
  fr: "Au démarrage de Ghost et à chaque fetch, tant qu’elle est extraite sans modification, et seulement quand elle avance directement."
  ja: "Ghost の起動時とフェッチのたびに、変更なしでチェックアウトされていて、早送りできる場合のみ。"
  ko: "Ghost가 시작될 때와 가져올 때마다, 변경 사항 없이 체크아웃된 상태이고 바로 앞으로 이동할 수 있는 경우에만."
  pt-BR: "Ao iniciar o Ghost e a cada fetch, enquanto estiver com checkout feito sem alterações, e apenas quando avançar diretamente."
  ru: "При запуске Ghost и при каждом получении изменений, если ветка переключена и ничего не изменено, и только при перемотке вперёд."
  sv: "När Ghost startar och varje gång den hämtar, medan den är utcheckad utan ändringar, och bara där den kan flyttas rakt fram."
"As Ghost starts and every four hours; an update is installed only when you say.":
  zh-CN: "Ghost 启动时及每四小时检查一次；只有在你同意时才会安装更新。"
  de: "Beim Start von Ghost und alle vier Stunden; ein Update wird nur auf Ihr Kommando installiert."
  es: "Al iniciarse Ghost y cada cuatro horas; una actualización solo se instala cuando lo indiques."
  fr: "Au démarrage de Ghost et toutes les quatre heures ; une mise à jour n’est installée que sur votre demande."
  ja: "Ghost の起動時と 4 時間ごと。アップデートはあなたが指示したときのみインストールされます。"
  ko: "Ghost가 시작될 때와 4시간마다. 업데이트는 사용자가 지시할 때만 설치됩니다."
  pt-BR: "Ao iniciar o Ghost e a cada quatro horas; uma atualização só é instalada quando você mandar."
  ru: "При запуске Ghost и каждые четыре часа; обновление устанавливается только с вашего согласия."
  sv: "När Ghost startar och var fjärde timme; en uppdatering installeras bara när du säger till."
