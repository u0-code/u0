"Read only: it watches sessions, diffs and your projects' files, and changes nothing. Its calls are checked here, on this Mac.":
  zh-CN: "只读：它查看会话、差异和你项目中的文件，不做任何更改。它的调用在这台 Mac 上检查。"
  de: "Nur lesen: Es sieht Sitzungen, Diffs und die Dateien deiner Projekte und ändert nichts. Seine Aufrufe werden hier auf diesem Mac geprüft."
  es: "Solo lectura: ve sesiones, diffs y los archivos de tus proyectos, y no cambia nada. Sus llamadas se comprueban aquí, en este Mac."
  fr: "Lecture seule : il voit les sessions, les diffs et les fichiers de vos projets, et ne change rien. Ses appels sont vérifiés ici, sur ce Mac."
  ja: "読み取りのみ：セッション、差分、プロジェクトのファイルを見るだけで、何も変更しません。呼び出しはこの Mac で確認されます。"
  ko: "읽기 전용: 세션, 차이, 프로젝트 파일을 보기만 하고 아무것도 바꾸지 않습니다. 호출은 이 Mac에서 확인됩니다."
  pt-BR: "Somente leitura: vê sessões, diffs e os arquivos dos seus projetos, e não muda nada. Suas chamadas são verificadas aqui, neste Mac."
  ru: "Только чтение: видит сеансы, изменения и файлы ваших проектов и ничего не меняет. Его вызовы проверяются здесь, на этом Mac."
  sv: "Endast läsning: den ser sessioner, diffar och dina projekts filer och ändrar ingenting. Dess anrop kontrolleras här, på den här Macen."
