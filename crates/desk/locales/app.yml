"Model ids of yours are offered in the composer beside those the agent lists; the agent may refuse one it does not know.":
  zh-CN: "你添加的模型 ID 会与智能体列出的模型一起出现在输入框中；智能体可能拒绝它不认识的模型。"
  de: "Ihre Modell-IDs werden im Eingabefeld neben denen angeboten, die der Agent auflistet; der Agent kann eine ablehnen, die er nicht kennt."
  es: "Los ids de modelo tuyos se ofrecen en el compositor junto a los que lista el agente; el agente puede rechazar uno que no conozca."
  fr: "Les identifiants de modèle que vous ajoutez sont proposés dans la zone de saisie à côté de ceux que l’agent liste ; l’agent peut refuser un modèle qu’il ne connaît pas."
  ja: "追加したモデル ID は、エージェントが示すモデルと並んで入力欄に表示されます。エージェントは知らないモデルを拒否する場合があります。"
  ko: "사용자가 지정한 모델 ID는 에이전트가 나열한 모델과 함께 작성기에 표시됩니다. 에이전트가 알지 못하는 모델은 거부될 수 있습니다."
  pt-BR: "Ids de modelo seus são oferecidos na caixa de mensagem ao lado dos que o agente lista; o agente pode recusar um que não conheça."
  ru: "Ваши идентификаторы моделей предлагаются в поле ввода рядом с теми, что перечисляет агент; агент может отклонить незнакомую ему модель."
  sv: "Dina egna modell-id:n erbjuds i skrivfältet bredvid dem agenten listar; agenten kan neka en den inte känner till."
