"After each turn, in the empty composer: Tab takes it, Esc lets it go.":
  zh-CN: "每轮结束后显示在空的输入框中：Tab 采用，Esc 放弃。"
  de: "Nach jeder Runde, im leeren Eingabefeld: Tab übernimmt, Esc verwirft."
  es: "Tras cada turno, en el compositor vacío: Tab la acepta, Esc la descarta."
  fr: "Après chaque tour, dans la zone de saisie vide : Tab l’accepte, Échap l’ignore."
  ja: "各ターンの後、空の入力欄に表示：Tab で採用、Esc で破棄。"
  ko: "각 턴이 끝난 후 비어 있는 작성기에서 Tab을 누르면 적용, Esc를 누르면 무시합니다."
  pt-BR: "Após cada turno, na caixa de mensagem vazia: Tab aceita, Esc descarta."
  ru: "После каждого хода, в пустом поле ввода: Tab принимает, Esc отклоняет."
  sv: "Efter varje omgång, i det tomma skrivfältet: Tab tar det, Esc släpper det."
"After that it is turned away, and pairs again with a new link.":
  zh-CN: "之后它会被拒绝，需要用新链接重新配对。"
  de: "Danach wird es abgewiesen und koppelt sich mit einem neuen Link erneut."
  es: "Después se le rechaza y se empareja de nuevo con un enlace nuevo."
