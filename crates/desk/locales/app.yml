"Answers shows what you said and its answers; quiet leaves out the calls that went well; normal folds each run of calls into a line; thinking shows its reasoning too; verbose shows every call and step.":
  zh-CN: "仅回答显示你说的话和回答；安静省略顺利完成的调用；普通把每组调用折叠为一行；思考还会显示推理过程；详细显示每个调用和步骤。"
  de: "„Antworten“ zeigt Ihre Nachrichten und die Antworten; „ruhig“ lässt erfolgreiche Aufrufe weg; „normal“ fasst jede Folge von Aufrufen in einer Zeile zusammen; „Denken“ zeigt auch die Überlegungen; „ausführlich“ zeigt jeden Aufruf und Schritt."
  es: "Respuestas muestra lo que dijiste y sus respuestas; silencioso omite las llamadas que salieron bien; normal agrupa cada serie de llamadas en una línea; razonamiento muestra también su razonamiento; detallado muestra cada llamada y paso."
  fr: "Réponses montre ce que vous avez dit et ses réponses ; discret omet les appels réussis ; normal replie chaque série d’appels en une ligne ; réflexion montre aussi son raisonnement ; détaillé montre chaque appel et chaque étape."
  ja: "「回答のみ」はあなたの発言と回答を表示します。「静か」は成功した呼び出しを省きます。「標準」は一連の呼び出しを 1 行に折りたたみます。「思考」は推論も表示します。「詳細」はすべての呼び出しとステップを表示します。"
  ko: "응답은 입력한 내용과 그 응답을 표시합니다. 간결은 성공한 호출을 생략하고, 보통은 연속된 호출을 한 줄로 접고, 생각은 추론도 표시하며, 상세는 모든 호출과 단계를 표시합니다."
  pt-BR: "Respostas mostra o que você disse e as respostas; silencioso omite as chamadas que deram certo; normal agrupa cada sequência de chamadas em uma linha; raciocínio mostra também o raciocínio; detalhado mostra cada chamada e etapa."
  ru: "«Ответы» показывает ваши сообщения и ответы на них; «Тихо» скрывает успешные вызовы; «Обычно» сворачивает каждую серию вызовов в строку; «Размышления» показывает и ход рассуждений; «Подробно» показывает каждый вызов и шаг."
  sv: "Svar visar det du sade och svaren; tyst utelämnar anropen som gick bra; normal viker ihop varje följd av anrop till en rad; tänkande visar även resonemanget; utförlig visar varje anrop och steg."
