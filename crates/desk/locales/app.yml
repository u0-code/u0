"Set in the agent's environment as it starts. A secret one is kept in the macOS Keychain, never in Ghost's files; a value may be a 1Password reference, read by op as it starts.":
  zh-CN: "在智能体启动时设置到其环境中。机密值保存在 macOS 钥匙串中，从不写入 Ghost 的文件；值也可以是 1Password 引用，启动时由 op 读取。"
  de: "Wird beim Start in der Umgebung des Agents gesetzt. Ein geheimer Wert liegt im macOS-Keychain, nie in Dateien von Ghost; ein Wert kann eine 1Password-Referenz sein, die op beim Start liest."
  es: "Se define en el entorno del agente al iniciarse. Uno secreto se guarda en el Keychain de macOS, nunca en los archivos de Ghost; un valor puede ser una referencia de 1Password, que op lee al iniciarse."
  fr: "Défini dans l’environnement de l’agent à son démarrage. Une variable secrète est conservée dans le Keychain de macOS, jamais dans les fichiers de Ghost ; une valeur peut être une référence 1Password, lue par op au démarrage."
  ja: "エージェントの起動時にその環境に設定されます。シークレットは macOS の Keychain に保存され、Ghost のファイルには書き込まれません。値には 1Password の参照も指定でき、起動時に op が読み取ります。"
  ko: "에이전트가 시작될 때 환경에 설정됩니다. 비밀 값은 Ghost의 파일이 아닌 macOS Keychain에 보관됩니다. 값은 시작 시 op가 읽는 1Password 참조일 수 있습니다."
  pt-BR: "Definido no ambiente do agente ao iniciar. Um secreto é guardado no Keychain do macOS, nunca nos arquivos do Ghost; um valor pode ser uma referência do 1Password, lida pelo op ao iniciar."
  ru: "Задаётся в окружении агента при запуске. Секретное значение хранится в macOS Keychain, а не в файлах Ghost; значение может быть ссылкой 1Password, которую op читает при запуске."
  sv: "Anges i agentens miljö när den startar. En hemlig sparas i macOS Keychain, aldrig i Ghosts filer; ett värde kan vara en 1Password-referens, som läses av op när den startar."
