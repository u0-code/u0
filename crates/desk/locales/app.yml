"A guide leads you through the changes in the order that makes them easiest to read, with what to look at in each. The writer writes it.":
  zh-CN: "导读按最易读懂的顺序带你浏览这些改动，并说明每处该看什么。由写作者撰写。"
  de: "Ein Leitfaden führt Sie durch die Änderungen in der Reihenfolge, in der sie sich am leichtesten lesen lassen, mit dem, worauf jeweils zu achten ist. Der Schreiber verfasst ihn."
  es: "Una guía te lleva por los cambios en el orden que los hace más fáciles de leer, con lo que hay que mirar en cada uno. La escribe el redactor."
  fr: "Un guide vous fait parcourir les modifications dans l’ordre le plus facile à lire, avec ce qu’il faut regarder dans chacune. Le rédacteur l’écrit."
  ja: "ガイドは、変更を最も読みやすい順序で案内し、それぞれで何を見るべきかを示します。ライターが書きます。"
  ko: "가이드는 변경 사항을 가장 읽기 쉬운 순서로 안내하며 각 항목에서 살펴볼 점을 알려 줍니다. 작성자가 작성합니다."
  pt-BR: "Um guia conduz você pelas alterações na ordem que as torna mais fáceis de ler, com o que observar em cada uma. O redator o escreve."
  ru: "Гид проводит вас по изменениям в порядке, в котором их проще всего читать, и подсказывает, на что смотреть в каждом. Его пишет агент-автор."
  sv: "En guide leder dig genom ändringarna i den ordning som gör dem lättast att läsa, med vad du ska titta på i varje. Skribenten skriver den."
