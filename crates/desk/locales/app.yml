"The display may sleep; a turn going on is not cut short by the Mac sleeping.":
  zh-CN: "显示器可以休眠；正在进行的一轮不会因 Mac 休眠而中断。"
  de: "Der Bildschirm darf in den Ruhezustand gehen; eine laufende Runde wird nicht durch den Ruhezustand des Mac abgebrochen."
  es: "La pantalla puede reposar; un turno en curso no se interrumpe porque el Mac entre en reposo."
  fr: "L’écran peut se mettre en veille ; un tour en cours n’est pas interrompu par la veille du Mac."
  ja: "ディスプレイはスリープしても構いません。Mac のスリープで進行中のターンが中断されることはありません。"
  ko: "디스플레이는 잠자기 상태가 될 수 있습니다. 진행 중인 턴은 Mac 잠자기로 중단되지 않습니다."
  pt-BR: "A tela pode repousar; um turno em andamento não é interrompido pelo repouso do Mac."
  ru: "Дисплей может засыпать; идущий ход не прерывается из-за сна Mac."
  sv: "Skärmen kan gå i vila; en pågående omgång avbryts inte av att Mac-datorn går i vila."
