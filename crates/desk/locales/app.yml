  fr: "Sa branche reste, ainsi qu’un worktree avec des modifications non validées ; rouvert, le fil l’extrait à nouveau."
  ja: "ブランチは残り、コミットされていない変更のあるワークツリーも残ります。再び開くと、スレッドが再度チェックアウトします。"
  ko: "브랜치는 유지되고 커밋되지 않은 변경 사항이 있는 워크트리도 유지됩니다. 다시 열면 스레드가 다시 체크아웃합니다."
  pt-BR: "O branch permanece, assim como um worktree com alterações sem commit; ao abrir novamente, a thread faz checkout dele de novo."
  ru: "Ветка остаётся, как и рабочее дерево с незакоммиченными изменениями; при повторном открытии тред снова переключится на неё."
