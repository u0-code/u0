"As an agent says them while you work: Claude's adapter does; Codex's says them only in answer to /status.":
  zh-CN: "由智能体在你工作时告知：Claude 的适配器会告知；Codex 的仅在回应 /status 时告知。"
  de: "So, wie ein Agent sie während der Arbeit nennt: Der Adapter von Claude tut es; der von Codex nennt sie nur als Antwort auf /status."
  es: "Según los dice un agente mientras trabajas: el adaptador de Claude lo hace; el de Codex solo los dice en respuesta a /status."
  fr: "Tels que l’agent les indique pendant que vous travaillez : l’adaptateur de Claude le fait ; celui de Codex ne les indique qu’en réponse à /status."
  ja: "作業中にエージェントが伝える値：Claude のアダプタは伝えます。Codex のアダプタは /status への応答でのみ伝えます。"
  ko: "작업 중 에이전트가 알려 줄 때: Claude의 어댑터는 알려 주며, Codex의 어댑터는 /status에 응답할 때만 알려 줍니다."
  pt-BR: "Conforme o agente os informa enquanto você trabalha: o adaptador do Claude informa; o do Codex só informa em resposta a /status."
  ru: "По мере того как агент сообщает их во время работы: адаптер Claude так делает; адаптер Codex — только в ответ на /status."
  sv: "När en agent säger dem medan du arbetar: Claudes adapter gör det; Codex säger dem bara som svar på /status."
