"Named from what you first ask, once the worktree is made.":
  zh-CN: "工作树创建后，根据你的第一个请求命名。"
  de: "Benannt nach Ihrer ersten Frage, sobald der Worktree erstellt ist."
  es: "Se nombra a partir de lo primero que pidas, una vez creado el worktree."
  fr: "Nommée d’après votre première demande, une fois le worktree créé."
  ja: "ワークツリーの作成後、最初の依頼内容から名前が付けられます。"
  ko: "워크트리가 만들어지면 처음 요청한 내용으로 이름을 정합니다."
  pt-BR: "Nomeado a partir do que você pedir primeiro, assim que o worktree for criado."
  ru: "Называется по вашему первому запросу после создания рабочего дерева."
  sv: "Namnges utifrån det du först frågar, när arbetsträdet har skapats."
"Names and terms to listen for, one to a line; “heard = written” writes what is heard otherwise.":
  zh-CN: "要留意的名称和术语，每行一个；「听到的 = 写成的」可把听到的内容改写为别的写法。"
  de: "Namen und Begriffe, auf die geachtet werden soll, einer pro Zeile; „gehört = geschrieben“ schreibt, was sonst anders gehört wird."
  es: "Nombres y términos que reconocer, uno por línea; “oído = escrito” escribe lo que se oye de otra forma."
  fr: "Noms et termes à reconnaître, un par ligne ; « entendu = écrit » écrit autrement ce qui est entendu."
  ja: "聞き取る名前や用語を 1 行に 1 つ。「聞こえた語 = 書く語」で聞き取った語を別の表記にします。"
  ko: "인식할 이름과 용어를 한 줄에 하나씩 입력합니다. “들린 말 = 쓸 말” 형식이면 다르게 들린 말을 지정한 대로 씁니다."
  pt-BR: "Nomes e termos a reconhecer, um por linha; “ouvido = escrito” escreve o que é ouvido de outra forma."
  ru: "Имена и термины, которые нужно распознавать, по одному в строке; «услышано = написано» записывает то, что слышится иначе."
  sv: "Namn och termer att lyssna efter, en per rad; ”hört = skrivet” skriver det som hörs på annat sätt."
