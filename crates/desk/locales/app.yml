"Install it with brew install gh and sign in with gh auth login, or give a token in Source control › Hosts. u0 looks for it on the PATH your login shell sets up.":
  zh-CN: "请运行 brew install gh 安装并通过 gh auth login 登录，或在「源代码管理 › 主机」中填写令牌。u0 会在登录 shell 配置的 PATH 中查找它。"
  de: "Installieren Sie es mit brew install gh und melden Sie sich mit gh auth login an, oder geben Sie unter Versionsverwaltung › Hosts ein Token an. u0 sucht im PATH Ihrer Login-Shell danach."
  es: "Instálalo con brew install gh e inicia sesión con gh auth login, o da un token en Control de código › Hosts. u0 lo busca en el PATH que configura tu shell de inicio."
  fr: "Installez-le avec brew install gh et connectez-vous avec gh auth login, ou donnez un jeton dans Contrôle de source › Hôtes. u0 le cherche dans le PATH configuré par votre shell de connexion."
  ja: "brew install gh でインストールして gh auth login でサインインするか、ソース管理 › ホストでトークンを設定してください。u0 はログインシェルの PATH から探します。"
  ko: "brew install gh로 설치한 뒤 gh auth login으로 로그인하거나 소스 제어 › 호스트에서 토큰을 입력하세요. u0는 로그인 셸이 설정한 PATH에서 찾습니다."
  pt-BR: "Instale com brew install gh e entre com gh auth login, ou informe um token em Controle de código-fonte › Hosts. O u0 procura no PATH definido pelo shell de login."
  ru: "Установите его через brew install gh и войдите с помощью gh auth login либо укажите токен в «Управление версиями › Хосты». u0 ищет его в PATH вашей оболочки входа."
  sv: "Installera med brew install gh och logga in med gh auth login, eller ange en token i Källkodshantering › Värdar. u0 letar i den PATH som ditt inloggningsskal sätter upp."
