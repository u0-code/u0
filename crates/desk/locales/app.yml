"Installs use each agent's own installer, and each agent signs in its own way. An agent starts in its own default mode, listed by the agent, and asks before it acts as that mode says.":
  zh-CN: "安装使用每个智能体自己的安装程序，登录也按各自方式进行。智能体以其列出的默认模式启动，并按该模式规则在行动前询问。"
  de: "Installationen nutzen den eigenen Installer jedes Agenten, und jeder meldet sich auf seine Weise an. Ein Agent startet im eigenen Standardmodus und fragt wie dort festgelegt."
  es: "Las instalaciones usan el instalador propio de cada agente y cada uno inicia sesión a su manera. Empieza en su modo predeterminado y pregunta antes de actuar según ese modo."
  fr: "L'installation utilise l'installeur propre à chaque agent, et chacun se connecte à sa façon. Un agent démarre dans son mode par défaut et demande avant d'agir selon ce mode."
  ja: "インストールは各エージェント自身のインストーラを使い、サインインも各々の方法で行います。既定モードで起動し、そのモードに従って実行前に確認します。"
  ko: "설치는 각 에이전트의 고유 설치 관리자를 사용하며 로그인도 각자의 방식으로 진행됩니다. 에이전트가 제시한 기본 모드로 시작하며 해당 모드에 따라 실행 전 확인합니다."
  pt-BR: "As instalações usam o instalador de cada agente, e cada um entra à sua maneira. O agente inicia no próprio modo padrão e pede permissão conforme esse modo."
  ru: "Установка выполняется собственным установщиком каждого агента, и вход у каждого свой. Агент запускается в своём режиме по умолчанию и запрашивает разрешение согласно ему."
  sv: "Installationer använder varje agents egen installerare och varje agent loggar in på sitt sätt. En agent startar i sitt eget standardläge och frågar innan den agerar enligt det läget."
