  zh-CN: "之后它会被拒绝，需要用新链接重新配对。"
  de: "Danach wird es abgewiesen und koppelt sich mit einem neuen Link erneut."
  es: "Después se le rechaza y se empareja de nuevo con un enlace nuevo."
  fr: "Ensuite il est refusé et s’associe de nouveau avec un nouveau lien."
  ja: "その後は拒否され、新しいリンクでもう一度ペアリングします。"
  ko: "그 후에는 거부되며 새 링크로 다시 페어링합니다."
