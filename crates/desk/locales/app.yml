"This Mac listens, and %{host} pairs back with a key of its own, which this Mac lists under the devices that control it.":
  zh-CN: "这台 Mac 开始监听，%{host} 用它自己的密钥反向配对，这台 Mac 会将其列在控制它的设备中。"
  de: "Dieser Mac lauscht, und %{host} koppelt sich mit einem eigenen Schlüssel zurück, den dieser Mac unter den Geräten auflistet, die ihn steuern."
  es: "Este Mac escucha, y %{host} se empareja de vuelta con una clave propia, que este Mac incluye entre los dispositivos que lo controlan."
  fr: "Ce Mac écoute, et %{host} s’appaire en retour avec sa propre clé, que ce Mac liste parmi les appareils qui le contrôlent."
  ja: "この Mac が待ち受け、%{host} は独自の鍵でペアリングし返します。この Mac はそれを、この Mac を操作するデバイスに表示します。"
  ko: "이 Mac이 수신 대기하면 %{host}이(가) 자체 키로 다시 페어링하며, 이 Mac은 그 키를 자신을 제어하는 기기 목록에 표시합니다."
  pt-BR: "Este Mac escuta, e %{host} pareia de volta com uma chave própria, que este Mac lista entre os dispositivos que o controlam."
  ru: "Этот Mac слушает, а %{host} сопрягается в ответ со своим ключом, который этот Mac показывает среди устройств, управляющих им."
  sv: "Den här Mac-datorn lyssnar, och %{host} parkopplas tillbaka med en egen nyckel, som den här Mac-datorn listar under enheterna som styr den."
"This Mac makes a key for it and sends only its public half, %{print}. %{host} lists it under the devices that control it.":
  zh-CN: "这台 Mac 为它生成一个密钥，只发送公钥部分 %{print}。%{host} 会将其列在控制它的设备中。"
  de: "Dieser Mac erstellt einen Schlüssel dafür und sendet nur dessen öffentliche Hälfte, %{print}. %{host} listet ihn unter den Geräten auf, die ihn steuern."
  es: "Este Mac crea una clave para él y solo envía su mitad pública, %{print}. %{host} la incluye entre los dispositivos que lo controlan."
  fr: "Ce Mac crée une clé pour lui et n’envoie que sa moitié publique, %{print}. %{host} la liste parmi les appareils qui le contrôlent."
  ja: "この Mac はそのための鍵を作成し、公開鍵 %{print} だけを送ります。%{host} はそれを、自分を操作するデバイスに表示します。"
  ko: "이 Mac은 키를 만들어 공개 키 부분 %{print}만 보냅니다. %{host}은(는) 이를 자신을 제어하는 기기 목록에 표시합니다."
  pt-BR: "Este Mac cria uma chave para ele e envia apenas a metade pública, %{print}. %{host} a lista entre os dispositivos que o controlam."
  ru: "Этот Mac создаёт для него ключ и отправляет только открытую часть, %{print}. %{host} показывает её среди устройств, управляющих им."
  sv: "Den här Mac-datorn skapar en nyckel för den och skickar bara dess offentliga halva, %{print}. %{host} listar den under enheterna som styr den."
