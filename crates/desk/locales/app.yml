"A project’s host is read from its origin, and this repository has none. Add one with git remote add origin, then read again.":
  zh-CN: "项目的主机读取自其 origin，而此仓库尚未配置。请使用 git remote add origin 添加后再重新读取。"
  de: "Der Host eines Projekts wird aus seinem origin gelesen, und dieses Repository hat keinen. Fügen Sie einen mit git remote add origin hinzu und lesen Sie erneut."
  es: "El host de un proyecto se lee desde su origin, y este repositorio no tiene ninguno. Añade uno con git remote add origin y vuelve a leer."
  fr: "L’hôte d’un projet est lu depuis son origin, et ce dépôt n’en a pas. Ajoutez-en un avec git remote add origin, puis relisez."
  ja: "プロジェクトのホストは origin から読み取られますが、このリポジトリにはありません。git remote add origin で追加してから再読み込みしてください。"
  ko: "프로젝트의 호스트는 origin에서 읽으며, 이 저장소에는 없습니다. git remote add origin으로 추가한 뒤 다시 읽으세요."
  pt-BR: "O host de um projeto é lido de seu origin, e este repositório não tem nenhum. Adicione um com git remote add origin e leia novamente."
  ru: "Хост проекта определяется по его origin, а у этого репозитория его нет. Добавьте его через git remote add origin и прочитайте снова."
  sv: "Ett projekts värd läses från dess origin, och detta arkiv saknar en. Lägg till en med git remote add origin och läs igen."
