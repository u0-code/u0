  fr: "Le registre ACP, relu toutes les heures."
  ja: "ACP レジストリ。1 時間ごとに再読み込みされます。"
  ko: "매시간 다시 읽는 ACP 레지스트리."
  pt-BR: "O registro ACP, lido novamente a cada hora."
  ru: "Реестр ACP, перечитывается каждый час."
  sv: "ACP-registret, läst igen varje timme."
"The Macs paired with are in this window beside this one; pair with another's link.":
  zh-CN: "已配对的 Mac 与这台并列显示在此窗口中；用另一台的链接配对。"
  de: "Die gekoppelten Macs stehen in diesem Fenster neben diesem; koppeln Sie mit dem Link eines anderen."
  es: "Los Mac emparejados están en esta ventana junto a este; empareja con el enlace de otro."
  fr: "Les Mac appairés sont dans cette fenêtre à côté de celui-ci ; appairez avec le lien d’un autre."
  ja: "ペアリングした Mac は、このウインドウでこの Mac と並んで表示されます。別の Mac のリンクでペアリングしてください。"
  ko: "페어링된 Mac은 이 윈도우에서 이 Mac 옆에 표시됩니다. 다른 Mac의 링크로 페어링하십시오."
  pt-BR: "Os Macs pareados ficam nesta janela ao lado deste; pareie com o link de outro."
  ru: "Сопряжённые Mac находятся в этом окне рядом с этим; для сопряжения с другим используйте его ссылку."
  sv: "Mac-datorerna du parkopplats med finns i det här fönstret bredvid den här; parkoppla med en annans länk."
