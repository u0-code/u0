"Ghost has no model of its own: an agent of yours writes what Ghost writes for you.":
  zh-CN: "Ghost 没有自己的模型：Ghost 为你写的内容由你的某个智能体撰写。"
  de: "Ghost hat kein eigenes Modell: Einer Ihrer Agents schreibt, was Ghost für Sie schreibt."
