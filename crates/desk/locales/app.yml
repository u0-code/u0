"Ask what you would rather not ask in the session: the agent knows all of it, and nothing said here goes in it.":
  zh-CN: "问那些你不想在会话中问的问题：智能体了解全部内容，而这里说的不会进入会话。"
  de: "Fragen Sie, was Sie in der Sitzung lieber nicht fragen: Der Agent kennt alles daraus, und nichts von hier fließt ein."
  es: "Pregunta lo que preferirías no preguntar en la sesión: el agente lo sabe todo, y nada de lo que se diga aquí entra en ella."
  fr: "Demandez ce que vous préférez ne pas demander dans la session : l’agent la connaît entièrement, et rien de ce qui est dit ici n’y figure."
  ja: "セッション内では聞きにくいことを質問できます。エージェントはすべてを把握していますが、ここでの発言はセッションには入りません。"
  ko: "세션에서 묻기 곤란한 것을 질문하십시오. 에이전트는 세션의 모든 내용을 알고 있으며, 여기서 한 말은 세션에 포함되지 않습니다."
  pt-BR: "Pergunte o que você prefere não perguntar na sessão: o agente sabe tudo dela, e nada dito aqui entra nela."
  ru: "Спросите то, что не хотите спрашивать в сеансе: агент знает всё из него, а сказанное здесь туда не попадает."
  sv: "Fråga det du helst inte frågar i sessionen: agenten vet allt om den, och inget som sägs här hamnar i den."
