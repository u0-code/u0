"Each is a JSON file in %{folder}: its steps say a prompt to an agent, run a command, or ask you.":
  zh-CN: "每个都是 %{folder} 中的一个 JSON 文件：其步骤可以向智能体发送提示、运行命令或询问你。"
  de: "Jeder ist eine JSON-Datei in %{folder}: Seine Schritte sagen einem Agent einen Prompt, führen einen Befehl aus oder fragen Sie."
  es: "Cada uno es un archivo JSON en %{folder}: sus pasos dicen un prompt a un agente, ejecutan un comando o te preguntan."
  fr: "Chacun est un fichier JSON dans %{folder} : ses étapes disent un prompt à un agent, exécutent une commande, ou vous posent une question."
  ja: "それぞれが %{folder} 内の JSON ファイルです。ステップでは、エージェントへのプロンプト送信、コマンドの実行、またはあなたへの質問を行います。"
  ko: "각각 %{folder}에 있는 JSON 파일이며, 단계마다 에이전트에 프롬프트를 전달하거나, 명령을 실행하거나, 사용자에게 질문합니다."
  pt-BR: "Cada um é um arquivo JSON em %{folder}: suas etapas dizem um prompt a um agente, executam um comando ou perguntam a você."
  ru: "Каждый — это JSON-файл в %{folder}: его шаги отправляют запрос агенту, выполняют команду или спрашивают вас."
  sv: "Var och en är en JSON-fil i %{folder}: dess steg säger en prompt till en agent, kör ett kommando eller frågar dig."
"Each level sends what the one before it does, and more; none sends what you or an agent wrote, a path, a name of yours or an error's words. README.md lists every field.":
  zh-CN: "每一级都发送前一级的内容并多一些；任何一级都不会发送你或智能体写的内容、路径、你的名称或错误文本。README.md 列出了所有字段。"
  de: "Jede Stufe sendet, was die vorherige sendet, und mehr; keine sendet, was Sie oder ein Agent geschrieben haben, einen Pfad, einen Ihrer Namen oder den Text eines Fehlers. README.md listet jedes Feld auf."
  es: "Cada nivel envía lo que el anterior y algo más; ninguno envía lo que escribiste tú o un agente, una ruta, un nombre tuyo ni el texto de un error. README.md enumera cada campo."
  fr: "Chaque niveau envoie ce qu’envoie le précédent, et plus ; aucun n’envoie ce que vous ou un agent avez écrit, un chemin, un de vos noms ou le texte d’une erreur. README.md liste chaque champ."
  ja: "各レベルは 1 つ前のレベルの内容に加えて、さらに送信します。あなたやエージェントが書いた内容、パス、あなたの名前、エラーの文言はどのレベルでも送信されません。README.md にすべての項目が記載されています。"
  ko: "각 수준은 이전 수준이 보내는 것에 더해 더 많은 것을 보냅니다. 어떤 수준도 사용자나 에이전트가 작성한 내용, 경로, 사용자 이름 또는 오류 문구는 보내지 않습니다. README.md에 모든 필드가 나열되어 있습니다."
  pt-BR: "Cada nível envia o que o anterior envia, e mais; nenhum envia o que você ou um agente escreveu, um caminho, um nome seu ou o texto de um erro. O README.md lista cada campo."
  ru: "Каждый уровень отправляет то же, что и предыдущий, и больше; ни один не отправляет то, что написали вы или агент, пути, ваши имена или текст ошибок. В README.md перечислены все поля."
  sv: "Varje nivå skickar det som den före skickar, och mer; ingen skickar det du eller en agent skrev, en sökväg, ett namn som är ditt eller ett fels ord. README.md listar varje fält."
"Each new thread of it is given u0's tools, as an MCP server: the threads u0 keeps, a diff, a task handed to another thread, a pull request, a task scheduled, a question put to you. What acts asks you here first.":
  zh-CN: "它的每个新线程都会获得 u0 的工具（一个 MCP 服务器）：u0 保存的线程、差异、交给另一个线程的任务、拉取请求、计划任务、向你提出的问题。会产生动作的工具会先在这里征求你的同意。"
  de: "Jeder neue Thread damit erhält die Werkzeuge von u0 als MCP-Server: die Threads, die u0 führt, einen Diff, eine an einen anderen Thread übergebene Aufgabe, einen Pull Request, eine geplante Aufgabe, eine Frage an Sie. Was handelt, fragt Sie zuerst hier."
  es: "Cada hilo nuevo suyo recibe las herramientas de u0, como servidor MCP: los hilos que u0 guarda, un diff, una tarea pasada a otro hilo, un pull request, una tarea programada, una pregunta para ti. Lo que actúa te pregunta aquí primero."
  fr: "Chaque nouveau fil reçoit les outils de u0, sous forme de serveur MCP : les fils que u0 conserve, un diff, une tâche confiée à un autre fil, une pull request, une tâche planifiée, une question qui vous est posée. Ce qui agit vous demande d’abord ici."
  ja: "新しいスレッドには、u0 のツールが MCP サーバとして提供されます：u0 が保持するスレッド、差分、別のスレッドに渡すタスク、プルリクエスト、スケジュールしたタスク、あなたへの質問。操作を伴うものは、まずここであなたに確認します。"
  ko: "새 스레드마다 u0의 도구가 MCP 서버로 제공됩니다: u0가 보관하는 스레드, 차이, 다른 스레드에 넘긴 작업, 풀 리퀘스트, 예약된 작업, 사용자에게 하는 질문. 실행하는 도구는 먼저 여기에서 확인을 요청합니다."
  pt-BR: "Cada nova thread dele recebe as ferramentas do u0, como um servidor MCP: as threads que o u0 mantém, um diff, uma tarefa passada a outra thread, um pull request, uma tarefa agendada, uma pergunta feita a você. O que age pergunta a você aqui primeiro."
  ru: "Каждый новый тред получает инструменты u0 как MCP-сервер: треды, которые хранит u0, различия, задачу, переданную другому треду, пул-реквест, запланированную задачу, вопрос к вам. Всё, что выполняет действия, сначала спрашивает вас здесь."
  sv: "Varje ny tråd med den får u0:s verktyg, som en MCP-server: trådarna u0 sparar, en diff, en uppgift som lämnas till en annan tråd, en pull request, en schemalagd uppgift, en fråga till dig. Det som utför något frågar dig här först."
