"Works once, for ten minutes (made %{ago}): open it on the other Mac, or scan its code, or paste it under Pair with another Mac there.":
  zh-CN: "仅可使用一次，十分钟内有效（生成于 %{ago}）：在另一台 Mac 上打开，或扫描二维码，或粘贴到那里的「与另一台 Mac 配对」下。"
