"Stable is each release, as the ghost cask installs it; Nightly is what main is now, rebuilt with each change, as ghost@nightly installs it.":
  zh-CN: "稳定版是每个正式版本，由 ghost cask 安装；每夜版是 main 的当前状态，每次改动都会重新构建，由 ghost@nightly 安装。"
  de: "„Stabil“ ist jede Version, wie der Cask ghost sie installiert; „Nightly“ ist der aktuelle Stand von main, bei jeder Änderung neu gebaut, wie ghost@nightly ihn installiert."
  es: "Estable es cada versión, tal como la instala el cask ghost; Nightly es lo que main es ahora, recompilado con cada cambio, tal como lo instala ghost@nightly."
  fr: "Stable correspond à chaque version publiée, telle que le cask ghost l’installe ; Nightly est l’état actuel de main, reconstruit à chaque modification, tel que ghost@nightly l’installe."
  ja: "安定版は各リリースで、ghost cask がインストールします。ナイトリーは現在の main を変更のたびにビルドしたもので、ghost@nightly がインストールします。"
  ko: "안정은 ghost cask가 설치하는 각 릴리스이며, 나이틀리는 변경될 때마다 다시 빌드되는 현재 main으로 ghost@nightly가 설치합니다."
  pt-BR: "Estável é cada versão lançada, como o cask ghost a instala; Nightly é o que o main é agora, recompilado a cada alteração, como o ghost@nightly o instala."
  ru: "«Стабильный» — каждый релиз, как его устанавливает cask ghost; «Ночная сборка» — текущий main, пересобираемый с каждым изменением, как его устанавливает ghost@nightly."
  sv: "Stabil är varje release, så som ghost-casken installerar den; Nattlig är det main är nu, byggt på nytt vid varje ändring, så som ghost@nightly installerar den."
