"The thread shows the PR's checks and reviews, and settles by itself once the pull request merges.":
  zh-CN: "线程会显示该 PR 的检查和评审，并在拉取请求合并后自动结清。"
  de: "Der Thread zeigt Checks und Reviews des PRs und gilt nach dem Mergen automatisch als erledigt."
  es: "El hilo muestra las comprobaciones y revisiones del PR y se liquida solo cuando se fusiona."
  fr: "Le fil affiche les vérifications et revues de la PR et se règle automatiquement une fois fusionnée."
  ja: "スレッドに PR のチェックとレビューが表示され、マージされると自動的に完了扱いになります。"
  ko: "스레드에 PR의 검사 및 리뷰가 표시되며 풀 리퀘스트가 병합되면 자동으로 정리됩니다."
  pt-BR: "O thread mostra as verificações e revisões do PR e é concluído automaticamente quando o PR é mesclado."
  ru: "В треде отображаются проверки и ревью PR, а после слияния он автоматически завершается."
  sv: "Tråden visar PR-kontroller och granskningar och markeras klar när den slås samman."
"The thread, its worktree and its checkpoints are removed for good.":
  zh-CN: "该线程、它的工作树及其检查点将被永久移除。"
  de: "Der Thread, sein Worktree und seine Checkpoints werden endgültig entfernt."
  es: "El hilo, su árbol de trabajo y sus puntos de control se eliminarán definitivamente."
  fr: "Le fil, son arbre de travail et ses points de contrôle sont supprimés définitivement."
  ja: "スレッド、ワークツリー、チェックポイントは完全に削除されます。"
  ko: "스레드와 작업 트리, 체크포인트가 영구적으로 삭제됩니다."
  pt-BR: "O thread, sua worktree e seus checkpoints serão removidos permanentemente."
  ru: "Тред, его рабочее дерево и контрольные точки будут удалены навсегда."
  sv: "Tråden, dess arbetsträd och dess kontrollpunkter tas bort permanent."
