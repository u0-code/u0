"A device comes in by its key, never by a password or an account. Nothing goes through a server of ours.":
  zh-CN: "设备通过它自己的密钥接入，从不用密码或账号。没有任何数据经过我们的服务器。"
  de: "Ein Gerät verbindet sich über seinen Schlüssel, nie über ein Passwort oder Konto. Nichts läuft über einen unserer Server."
  es: "Un dispositivo entra con su clave, nunca con contraseña ni cuenta. Nada pasa por un servidor nuestro."
  fr: "Un appareil se connecte par sa clé, jamais par mot de passe ou compte. Rien ne passe par un serveur à nous."
  ja: "デバイスは自身の鍵で接続し、パスワードやアカウントは使いません。当社のサーバーを経由するものは一切ありません。"
  ko: "기기는 비밀번호나 계정이 아닌 고유 키로 연결됩니다. 당사 서버를 거치는 데이터는 없습니다."
  pt-BR: "Um dispositivo entra pela própria chave, nunca por senha ou conta. Nada passa por um servidor nosso."
  ru: "Устройство подключается по своему ключу, без пароля и аккаунта. Ничто не проходит через наши серверы."
  sv: "En enhet ansluter med sin nyckel, aldrig med lösenord eller konto. Inget går via någon server hos oss."
"A project is a folder on one of your machines. Its threads, worktrees and pull requests live under it.":
  zh-CN: "项目是你某台机器上的一个文件夹。它的线程、工作树和拉取请求都归于其下。"
  de: "Ein Projekt ist ein Ordner auf einem Ihrer Rechner. Seine Threads, Worktrees und Pull Requests liegen darunter."
  es: "Un proyecto es una carpeta en una de tus máquinas. Sus hilos, árboles de trabajo y solicitudes de extracción viven en él."
  fr: "Un projet est un dossier sur l'une de vos machines. Ses fils, arbres de travail et demandes de fusion s'y rattachent."
  ja: "プロジェクトはお使いのマシンのフォルダです。スレッド、ワークツリー、プルリクエストがその下にまとまります。"
  ko: "프로젝트는 머신의 폴더입니다. 스레드, 작업 트리와 풀 리퀘스트가 그 아래에 모입니다."
  pt-BR: "Um projeto é uma pasta em uma das suas máquinas. Seus threads, worktrees e pull requests ficam sob ele."
  ru: "Проект — это папка на одной из ваших машин. Его треды, рабочие деревья и пул-реквесты находятся в ней."
  sv: "Ett projekt är en mapp på en av dina datorer. Dess trådar, arbetsträd och pull-begäranden ligger under det."
"Add the folders you work in. Your agents worked in these; tick one to add it as a project.":
  zh-CN: "添加你工作的文件夹。你的智能体曾在这些文件夹中工作；勾选即可添加为项目。"
  de: "Fügen Sie Ihre Arbeitsordner hinzu. Ihre Agenten haben hier gearbeitet; wählen Sie einen als Projekt aus."
  es: "Añade las carpetas donde trabajas. Tus agentes ya trabajaron en estas; marca una para añadirla como proyecto."
  fr: "Ajoutez vos dossiers de travail. Vos agents ont travaillé dans ceux-ci ; cochez-en un pour l'ajouter comme projet."
  ja: "作業するフォルダを追加します。エージェントが作業した履歴のあるフォルダにチェックを入れるとプロジェクトになります。"
  ko: "작업하는 폴더를 추가하세요. 에이전트가 이미 작업한 폴더를 선택해 프로젝트로 추가할 수 있습니다."
  pt-BR: "Adicione as pastas em que você trabalha. Seus agentes trabalharam nestas; marque uma para adicioná-la como projeto."
  ru: "Добавьте рабочие папки. Ваши агенты уже работали в них; отметьте папку, чтобы сделать её проектом."
  sv: "Lägg till mapparna du arbetar i. Dina agenter har arbetat i dessa; kryssa i en för att lägga till som projekt."
"Any folder works. If it is a Git repository, u0 also finds its branches and pull requests.":
  zh-CN: "任何文件夹都可以。如果是 Git 仓库，u0 还会找到它的分支和拉取请求。"
  de: "Jeder Ordner funktioniert. Ist es ein Git-Repository, findet u0 auch Branches und Pull Requests."
  es: "Cualquier carpeta sirve. Si es un repositorio Git, u0 también encuentra sus ramas y solicitudes de extracción."
  fr: "Tout dossier convient. S'il s'agit d'un dépôt Git, u0 trouve aussi ses branches et demandes de fusion."
  ja: "どのフォルダでも構いません。Git リポジトリであれば、ブランチやプルリクエストも検出します。"
  ko: "어떤 폴더든 가능합니다. Git 저장소라면 브랜치와 풀 리퀘스트도 함께 찾습니다."
  pt-BR: "Qualquer pasta funciona. Se for um repositório Git, o u0 também encontra branches e pull requests."
  ru: "Подойдёт любая папка. Если это Git-репозиторий, u0 также найдёт его ветки и пул-реквесты."
  sv: "Vilken mapp som helst fungerar. Om det är ett Git-arkiv hittar u0 även grenar och pull-begäranden."
