"What it may do and for how long were set on the link. To give more, turn it away and pair again with a new link.":
  zh-CN: "它的权限与有效期已在链接上设定。如需授予更多权限，请拒绝后使用新链接重新配对。"
  de: "Rechte und Dauer wurden im Link festgelegt. Für mehr Rechte ablehnen und mit neuem Link erneut koppeln."
  es: "Lo que puede hacer y por cuánto tiempo se fijaron en el enlace. Para darle más, recházalo y vincula de nuevo con otro enlace."
  fr: "Ses droits et sa durée ont été fixés par le lien. Pour accorder plus, refusez-le et jumelez à nouveau avec un nouveau lien."
  ja: "権限と有効期間はリンク作成時に設定されています。広げるには一度拒否し、新しいリンクで再ペアリングしてください。"
  ko: "권한과 기간은 링크에서 설정되었습니다. 더 많은 권한을 주려면 거절한 뒤 새 링크로 다시 페어링하세요."
  pt-BR: "O que pode fazer e por quanto tempo foram definidos no link. Para conceder mais, recuse e pareie novamente com um novo link."
  ru: "Права и срок заданы в ссылке. Чтобы дать больше прав, отклоните устройство и привяжите заново по новой ссылке."
  sv: "Vad den får göra och hur länge bestämdes i länken. För att ge mer, avvisa och parkoppla igen med en ny länk."
"With -s user, Claude Code adds u0 for every project. u0 --mcp finds the port and key in ~/.u0/mcp.json, made anew each time u0 starts.":
  zh-CN: "使用 -s user 时，Claude Code 会为所有项目添加 u0。u0 --mcp 会读取每次 u0 启动时重新生成的 ~/.u0/mcp.json 中的端口与密钥。"
  de: "Mit -s user fügt Claude Code u0 für jedes Projekt hinzu. u0 --mcp liest Port und Schlüssel aus ~/.u0/mcp.json, die bei jedem Start neu erzeugt werden."
  es: "Con -s user, Claude Code añade u0 para cada proyecto. u0 --mcp lee el puerto y la clave en ~/.u0/mcp.json, renovados cada vez que inicia u0."
  fr: "Avec -s user, Claude Code ajoute u0 pour chaque projet. u0 --mcp lit le port et la clé dans ~/.u0/mcp.json, régénérés à chaque démarrage de u0."
  ja: "-s user を付けると Claude Code の全プロジェクトに u0 が追加されます。u0 --mcp は u0 起動ごとに再生成される ~/.u0/mcp.json からポートと鍵を読み取ります。"
  ko: "-s user 옵션을 주면 Claude Code의 모든 프로젝트에 u0가 추가됩니다. u0 --mcp는 u0 시작 시마다 새로 생성되는 ~/.u0/mcp.json에서 포트와 키를 찾습니다."
  pt-BR: "Com -s user, o Claude Code adiciona o u0 para todos os projetos. u0 --mcp lê a porta e a chave em ~/.u0/mcp.json, recriado a cada início do u0."
  ru: "С флагом -s user Claude Code добавляет u0 для всех проектов. u0 --mcp берёт порт и ключ из ~/.u0/mcp.json, создаваемого заново при каждом запуске u0."
  sv: "Med -s user lägger Claude Code till u0 för alla projekt. u0 --mcp läser port och nyckel i ~/.u0/mcp.json som skapas på nytt vid varje start."
