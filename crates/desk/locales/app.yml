"The ACP registry is read again each hour; an agent that stops working is updated to the newest.":
  zh-CN: "每小时重新读取 ACP 注册表；无法工作的智能体会被更新到最新版本。"
  de: "Die ACP-Registry wird stündlich neu gelesen; ein Agent, der nicht mehr funktioniert, wird auf die neueste Version aktualisiert."
  es: "El registro de ACP se vuelve a leer cada hora; un agente que deja de funcionar se actualiza a la versión más reciente."
  fr: "Le registre ACP est relu toutes les heures ; un agent qui ne fonctionne plus est mis à jour vers la dernière version."
  ja: "ACP レジストリは 1 時間ごとに再読み込みされます。動かなくなったエージェントは最新版にアップデートされます。"
  ko: "ACP 레지스트리는 매시간 다시 읽으며, 작동을 멈춘 에이전트는 최신 버전으로 업데이트됩니다."
  pt-BR: "O registro ACP é lido novamente a cada hora; um agente que deixa de funcionar é atualizado para o mais recente."
  ru: "Реестр ACP перечитывается каждый час; переставший работать агент обновляется до новейшей версии."
  sv: "ACP-registret läses igen varje timme; en agent som slutar fungera uppdateras till den senaste."
"The ACP registry, read again each hour.":
  zh-CN: "ACP 注册表，每小时重新读取。"
  de: "Die ACP-Registry, stündlich neu gelesen."
