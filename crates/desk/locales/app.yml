"An agent outside Ghost reaches Ghost's tools by the key in mcp.json (ghost --mcp, or over HTTP on this Mac). Off, it only reads; on, it may say something in a session or stop its turn, each asked of you there.":
  zh-CN: "Ghost 之外的智能体通过 mcp.json 中的密钥访问 Ghost 的工具（ghost --mcp，或在这台 Mac 上通过 HTTP）。关闭时只能读取；开启时可以在会话中发言或停止其回合，每次都会在那里征求你的同意。"
  de: "Ein Agent außerhalb von Ghost erreicht Ghosts Werkzeuge mit dem Schlüssel in mcp.json (ghost --mcp oder über HTTP auf diesem Mac). Aus: Er liest nur; an: Er darf in einer Sitzung etwas sagen oder ihren Zug stoppen, jeweils dort bei dir erfragt."
  es: "Un agente fuera de Ghost llega a las herramientas de Ghost con la clave de mcp.json (ghost --mcp, o por HTTP en este Mac). Desactivado, solo lee; activado, puede decir algo en una sesión o detener su turno, preguntándote cada vez allí."
  fr: "Un agent hors de Ghost atteint les outils de Ghost avec la clé de mcp.json (ghost --mcp, ou en HTTP sur ce Mac). Désactivé, il ne fait que lire ; activé, il peut dire quelque chose dans une session ou arrêter son tour, chaque fois demandé là-bas."
  ja: "Ghost 外のエージェントは mcp.json の鍵で Ghost のツールに接続します（ghost --mcp、またはこの Mac 上の HTTP）。オフでは読み取りのみ、オンではセッションで発言したりターンを止めたりでき、そのたびにそこで確認されます。"
  ko: "Ghost 밖의 에이전트는 mcp.json의 키로 Ghost의 도구에 접근합니다(ghost --mcp 또는 이 Mac의 HTTP). 끄면 읽기만 하고, 켜면 세션에서 말하거나 턴을 멈출 수 있으며 매번 그곳에서 묻습니다."
  pt-BR: "Um agente fora do Ghost acessa as ferramentas do Ghost pela chave em mcp.json (ghost --mcp, ou por HTTP neste Mac). Desligado, só lê; ligado, pode dizer algo numa sessão ou parar o turno, cada vez perguntado a você ali."
  ru: "Агент вне Ghost обращается к инструментам Ghost по ключу из mcp.json (ghost --mcp или по HTTP на этом Mac). Выключено — только читает; включено — может что-то сказать в сеансе или остановить ход, каждый раз спрашивая вас там."
  sv: "En agent utanför Ghost når Ghosts verktyg med nyckeln i mcp.json (ghost --mcp, eller över HTTP på den här Macen). Av: den läser bara; på: den får säga något i en session eller stoppa dess tur, varje gång frågat av dig där."
"An answer streams in":
  zh-CN: "回答的显示方式"
  de: "Eine Antwort trifft ein"
  es: "Llega una respuesta"
  fr: "Une réponse arrive en continu"
  ja: "回答の表示方法"
  ko: "응답 스트리밍"
  pt-BR: "Uma resposta chega aos poucos"
  ru: "Поступает ответ"
  sv: "Ett svar strömmar in"
"An app set up with Ghost's tools (mcp.json's address and key) keeps working across restarts: the key stays until you make a new one, and the old one then lets no one in.":
  zh-CN: "用 Ghost 的工具（mcp.json 中的地址和密钥）设置好的应用在重启后仍能使用：密钥会一直保留，直到你生成新的密钥，届时旧密钥将不再允许任何人进入。"
  de: "Eine mit Ghosts Werkzeugen eingerichtete App (Adresse und Schlüssel aus mcp.json) funktioniert auch nach einem Neustart: Der Schlüssel bleibt, bis du einen neuen erstellst, und der alte lässt dann niemanden mehr herein."
  es: "Una app configurada con las herramientas de Ghost (la dirección y la clave de mcp.json) sigue funcionando tras reiniciar: la clave se mantiene hasta que crees una nueva, y entonces la antigua ya no deja entrar a nadie."
  fr: "Une app configurée avec les outils de Ghost (adresse et clé de mcp.json) continue de fonctionner après un redémarrage : la clé reste jusqu'à ce que vous en créiez une nouvelle, et l'ancienne ne laisse alors plus entrer personne."
  ja: "Ghost のツール（mcp.json のアドレスとキー）で設定したアプリは再起動後も動き続けます。キーは新しいキーを作るまで変わらず、その時点で古いキーでは誰も入れなくなります。"
  ko: "Ghost의 도구(mcp.json의 주소와 키)로 설정한 앱은 다시 시작해도 계속 작동합니다. 키는 새 키를 만들 때까지 유지되며, 그 뒤로는 이전 키로 아무도 들어올 수 없습니다."
  pt-BR: "Um app configurado com as ferramentas do Ghost (endereço e chave do mcp.json) continua funcionando após reiniciar: a chave permanece até você criar uma nova, e a antiga então não deixa mais ninguém entrar."
  ru: "Приложение, настроенное на инструменты Ghost (адрес и ключ из mcp.json), продолжает работать после перезапуска: ключ сохраняется, пока вы не создадите новый, и тогда старый больше никого не пускает."
  sv: "En app som är inställd på Ghosts verktyg (adressen och nyckeln i mcp.json) fortsätter att fungera efter omstart: nyckeln finns kvar tills du skapar en ny, och då släpper den gamla inte in någon."
"An archived session's worktree is taken away after":
