  de: "Die Einstellungen werden so angezeigt, wie sie zuletzt gesendet wurden, und können wieder geändert werden, sobald die Verbindung steht. u0 versucht es automatisch erneut, mit wachsendem Abstand bis zu 30 Sekunden."
