"u0 can send its makers counts of how it is used, never what you or your agents write, nor paths or names. Choose how much; Settings › Telemetry changes it later.":
  zh-CN: "u0 可以向开发者发送使用情况的统计，绝不包括你或智能体写的内容、路径或名称。选择发送多少；之后可在 设置 › 遥测 中更改。"
  de: "u0 kann seinen Entwicklern Zählungen zur Nutzung senden, niemals, was Sie oder Ihre Agents schreiben, und auch keine Pfade oder Namen. Wählen Sie den Umfang; unter Einstellungen › Telemetrie lässt er sich später ändern."
  es: "u0 puede enviar a sus creadores recuentos de cómo se usa, nunca lo que escribís tú o tus agentes, ni rutas ni nombres. Elige cuánto; Ajustes › Telemetría lo cambia después."
  fr: "u0 peut envoyer à ses créateurs des statistiques d’utilisation, jamais ce que vous ou vos agents écrivez, ni chemins ni noms. Choisissez la quantité ; Réglages › Télémétrie permet de la changer plus tard."
  ja: "u0 は使用状況の件数を開発元に送信できます。あなたやエージェントが書いた内容、パスや名前は送信しません。送信する量を選んでください。後から「設定 › テレメトリ」で変更できます。"
  ko: "u0는 개발자에게 사용 횟수를 보낼 수 있으며, 사용자나 에이전트가 작성한 내용, 경로 또는 이름은 절대 보내지 않습니다. 수준을 선택하십시오. 나중에 설정 › 원격 측정에서 변경할 수 있습니다."
  pt-BR: "O u0 pode enviar aos criadores contagens de como é usado, nunca o que você ou seus agentes escrevem, nem caminhos ou nomes. Escolha quanto; Ajustes › Telemetria altera isso depois."
  ru: "u0 может отправлять своим разработчикам статистику использования — но никогда то, что пишете вы или ваши агенты, а также пути и имена. Выберите объём; позже его можно изменить в Настройки › Телеметрия."
  sv: "u0 kan skicka sina skapare siffror om hur den används, aldrig det du eller dina agenter skriver, inte heller sökvägar eller namn. Välj hur mycket; Inställningar › Telemetri ändrar det senare."
"u0 closed while this turn was going on; the agent may have gone on with it.":
