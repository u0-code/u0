  ko: "Ghost에는 자체 모델이 없습니다. Ghost가 대신 작성하는 내용은 사용자의 에이전트가 작성합니다."
  pt-BR: "O Ghost não tem modelo próprio: um agente seu escreve o que o Ghost escreve para você."
