"“Always allow” lets %{tool} act from this thread without asking again.":
  zh-CN: "选择“始终允许”后，%{tool} 可在此线程中直接执行而不再询问。"
  de: "„Immer erlauben“ lässt %{tool} in diesem Thread ohne erneutes Fragen handeln."
  es: "«Permitir siempre» deja que %{tool} actúe desde este hilo sin volver a preguntar."
  fr: "« Toujours autoriser » permet à %{tool} d’agir depuis ce fil sans redemander."
  ja: "「常に許可」を選ぶと、このスレッドでは %{tool} が次回から確認なしで実行されます。"
  ko: "“항상 허용”을 선택하면 이 스레드에서 %{tool}이(가) 다시 묻지 않고 실행됩니다."
  pt-BR: "“Permitir sempre” deixa %{tool} agir a partir desta thread sem perguntar novamente."
  ru: "«Разрешать всегда» позволяет %{tool} действовать из этого треда без повторного запроса."
  sv: "”Tillåt alltid” låter %{tool} agera från den här tråden utan att fråga igen."
"Asked each time: %{tool} can be steered by unvetted text.":
  zh-CN: "每次都询问：%{tool} 可能被未经审查的文本左右。"
  de: "Jedes Mal gefragt: %{tool} kann durch ungeprüften Text gelenkt werden."
  es: "Se pregunta cada vez: %{tool} puede guiarse por texto no revisado."
  fr: "Demandé à chaque fois : %{tool} peut être orienté par un texte non vérifié."
  ja: "毎回確認：%{tool} は未検証のテキストに操られる可能性があります。"
  ko: "매번 묻습니다: %{tool}은(는) 검증되지 않은 텍스트에 조종될 수 있습니다."
  pt-BR: "Perguntado sempre: %{tool} pode ser guiado por texto não verificado."
  ru: "Спрашивается каждый раз: %{tool} может управляться непроверенным текстом."
  sv: "Frågas varje gång: %{tool} kan styras av ogranskad text."
