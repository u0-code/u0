  ko: "에이전트가 계속하기 전에 확인을 요청함"
  pt-BR: "Um agente pergunta antes de continuar"
  ru: "Агент спрашивает, прежде чем продолжить"
  sv: "En agent frågar innan den fortsätter"
"An agent outside u0 reaches u0's tools by the key in mcp.json (u0 --mcp, or over HTTP on this Mac). Off, it only reads; on, it may say something in a thread or stop its turn, each asked of you there.":
  zh-CN: "u0 之外的智能体通过 mcp.json 中的密钥访问 u0 的工具（u0 --mcp，或在这台 Mac 上通过 HTTP）。关闭时只能读取；开启时可以在线程中发言或停止其回合，每次都会在那里征求你的同意。"
  de: "Ein Agent außerhalb von u0 erreicht u0s Werkzeuge mit dem Schlüssel in mcp.json (u0 --mcp oder über HTTP auf diesem Mac). Aus: Er liest nur; an: Er darf in einem Thread etwas sagen oder seinen Zug stoppen, jeweils dort bei dir erfragt."
  es: "Un agente fuera de u0 llega a las herramientas de u0 con la clave de mcp.json (u0 --mcp, o por HTTP en este Mac). Desactivado, solo lee; activado, puede decir algo en un hilo o detener su turno, preguntándote cada vez allí."
  fr: "Un agent hors de u0 atteint les outils de u0 avec la clé de mcp.json (u0 --mcp, ou en HTTP sur ce Mac). Désactivé, il ne fait que lire ; activé, il peut dire quelque chose dans un fil ou arrêter son tour, chaque fois demandé là-bas."
  ja: "u0 外のエージェントは mcp.json の鍵で u0 のツールに接続します（u0 --mcp、またはこの Mac 上の HTTP）。オフでは読み取りのみ、オンではスレッドで発言したりターンを止めたりでき、そのたびにそこで確認されます。"
  ko: "u0 밖의 에이전트는 mcp.json의 키로 u0의 도구에 접근합니다(u0 --mcp 또는 이 Mac의 HTTP). 끄면 읽기만 하고, 켜면 스레드에서 말하거나 턴을 멈출 수 있으며 매번 그곳에서 묻습니다."
  pt-BR: "Um agente fora do u0 acessa as ferramentas do u0 pela chave em mcp.json (u0 --mcp, ou por HTTP neste Mac). Desligado, só lê; ligado, pode dizer algo numa thread ou parar o turno, cada vez perguntado a você ali."
  ru: "Агент вне u0 обращается к инструментам u0 по ключу из mcp.json (u0 --mcp или по HTTP на этом Mac). Выключено — только читает; включено — может что-то сказать в треде или остановить ход, каждый раз спрашивая вас там."
  sv: "En agent utanför u0 når u0:s verktyg med nyckeln i mcp.json (u0 --mcp, eller över HTTP på den här Macen). Av: den läser bara; på: den får säga något i en tråd eller stoppa dess tur, varje gång frågat av dig där."
"An answer streams in":
  zh-CN: "回答的显示方式"
  de: "Eine Antwort trifft ein"
  es: "Llega una respuesta"
  fr: "Une réponse arrive en continu"
  ja: "回答の表示方法"
  ko: "응답 스트리밍"
  pt-BR: "Uma resposta chega aos poucos"
  ru: "Поступает ответ"
  sv: "Ett svar strömmar in"
"An app set up with u0's tools (mcp.json's address and key) keeps working across restarts: the key stays until you make a new one, and the old one then lets no one in.":
  zh-CN: "用 u0 的工具（mcp.json 中的地址和密钥）设置好的应用在重启后仍能使用：密钥会一直保留，直到你生成新的密钥，届时旧密钥将不再允许任何人进入。"
  de: "Eine mit u0s Werkzeugen eingerichtete App (Adresse und Schlüssel aus mcp.json) funktioniert auch nach einem Neustart: Der Schlüssel bleibt, bis du einen neuen erstellst, und der alte lässt dann niemanden mehr herein."
  es: "Una app configurada con las herramientas de u0 (la dirección y la clave de mcp.json) sigue funcionando tras reiniciar: la clave se mantiene hasta que crees una nueva, y entonces la antigua ya no deja entrar a nadie."
  fr: "Une app configurée avec les outils de u0 (adresse et clé de mcp.json) continue de fonctionner après un redémarrage : la clé reste jusqu'à ce que vous en créiez une nouvelle, et l'ancienne ne laisse alors plus entrer personne."
  ja: "u0 のツール（mcp.json のアドレスとキー）で設定したアプリは再起動後も動き続けます。キーは新しいキーを作るまで変わらず、その時点で古いキーでは誰も入れなくなります。"
  ko: "u0의 도구(mcp.json의 주소와 키)로 설정한 앱은 다시 시작해도 계속 작동합니다. 키는 새 키를 만들 때까지 유지되며, 그 뒤로는 이전 키로 아무도 들어올 수 없습니다."
  pt-BR: "Um app configurado com as ferramentas do u0 (endereço e chave do mcp.json) continua funcionando após reiniciar: a chave permanece até você criar uma nova, e a antiga então não deixa mais ninguém entrar."
  ru: "Приложение, настроенное на инструменты u0 (адрес и ключ из mcp.json), продолжает работать после перезапуска: ключ сохраняется, пока вы не создадите новый, и тогда старый больше никого не пускает."
  sv: "En app som är inställd på u0:s verktyg (adressen och nyckeln i mcp.json) fortsätter att fungera efter omstart: nyckeln finns kvar tills du skapar en ny, och då släpper den gamla inte in någon."
