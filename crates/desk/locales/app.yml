  pt-BR: "O macOS não consegue ouvir este idioma apenas neste Mac: escolha outro ou adicione-o em Ajustes do Sistema › Teclado › Ditado. O u0 executado fora do u0.app (pelo cargo) não consegue escutar."
  ru: "macOS не может распознавать этот язык только на этом Mac: выберите другой или добавьте его в Системных настройках › Клавиатура › Диктовка. u0, запущенный не из u0.app (из cargo), не может слушать вовсе."
  sv: "macOS kan inte höra det här språket på den här Mac-datorn enbart: välj ett annat, eller lägg till det under Systeminställningar › Tangentbord › Diktering. u0 som körs utanför u0.app (från cargo) kan inte lyssna alls."
