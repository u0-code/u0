"No agent said what a session cost or took in this time. Not every agent says; Ghost does not guess.":
  zh-CN: "在此期间没有智能体告知会话的费用或用量。并非所有智能体都会告知；Ghost 不做猜测。"
  de: "Kein Agent hat in diesem Zeitraum genannt, was eine Sitzung gekostet oder verbraucht hat. Nicht jeder Agent tut das; Ghost rät nicht."
