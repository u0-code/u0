"A picture, or letters or an emoji on a colour; Automatic, its own icon file (favicon, app icon) where it has one.":
  zh-CN: "一张图片，或彩色底上的字母或表情；自动则使用项目自带的图标文件（favicon、应用图标）。"
  de: "Ein Bild oder Buchstaben bzw. ein Emoji auf einer Farbe; Automatisch: die eigene Symboldatei (Favicon, App-Symbol), sofern vorhanden."
  es: "Una imagen, o letras o un emoji sobre un color; Automático, su propio archivo de icono (favicon, icono de app) cuando lo tiene."
  fr: "Une image, ou des lettres ou un emoji sur une couleur ; Automatique, son propre fichier d’icône (favicon, icône d’app) s’il en a un."
  ja: "画像、または色の上の文字や絵文字。「自動」では、独自のアイコンファイル（favicon、アプリアイコン）があればそれを使います。"
  ko: "그림, 또는 색상 위의 글자나 이모지. 자동은 자체 아이콘 파일(파비콘, 앱 아이콘)이 있으면 그것을 사용합니다."
  pt-BR: "Uma imagem, ou letras ou um emoji sobre uma cor; Automático, o próprio arquivo de ícone (favicon, ícone do app) quando houver."
  ru: "Изображение, либо буквы или эмодзи на цветном фоне; «Автоматически» — собственный значок, если он есть (favicon, значок приложения)."
  sv: "En bild, eller bokstäver eller en emoji på en färg; Automatisk, dess egen ikonfil (favicon, appsymbol) där den har en."
"A POST to it runs the task; {{body}} in what it says is what was sent, marked as data from outside. A call made while Ghost is not running is not held: the sender has to send it again.":
  zh-CN: "向它发送 POST 即运行任务；提示中的 {{body}} 会替换为发送的内容，并标记为来自外部的数据。Ghost 未运行时的调用不会被保留：发送方需要重新发送。"
  de: "Ein POST darauf führt die Aufgabe aus; {{body}} darin ist das Gesendete, als Daten von außen markiert. Ein Aufruf, während Ghost nicht läuft, wird nicht gehalten: Der Absender muss ihn erneut senden."
  es: "Un POST a esta dirección ejecuta la tarea; {{body}} en lo que dice es lo que se envió, marcado como datos externos. Una llamada hecha mientras Ghost no está en ejecución no se guarda: el remitente tiene que enviarla de nuevo."
  fr: "Un POST vers cette adresse exécute la tâche ; {{body}} dans ce qu’elle dit est ce qui a été envoyé, marqué comme données venant de l’extérieur. Un appel fait quand Ghost ne tourne pas n’est pas conservé : l’expéditeur doit le renvoyer."
  ja: "POST を送るとタスクが実行されます。プロンプト内の {{body}} は送信された内容に置き換えられ、外部からのデータとしてマークされます。Ghost が実行されていない間の呼び出しは保持されないため、送信側が再送する必要があります。"
  ko: "여기로 POST를 보내면 작업이 실행됩니다. 내용의 {{body}}는 전송된 내용이며 외부 데이터로 표시됩니다. Ghost가 실행 중이 아닐 때의 호출은 보관되지 않으므로 보낸 쪽에서 다시 보내야 합니다."
  pt-BR: "Um POST para ele executa a tarefa; {{body}} no texto é o que foi enviado, marcado como dado externo. Uma chamada feita enquanto o Ghost não está em execução não é guardada: o remetente precisa enviá-la novamente."
  ru: "POST-запрос к нему запускает задачу; {{body}} в её тексте — это то, что было отправлено, помеченное как внешние данные. Вызов, сделанный, когда Ghost не запущен, не сохраняется: отправителю нужно повторить его."
  sv: "En POST till den kör uppgiften; {{body}} i det den säger är det som skickades, markerat som data utifrån. Ett anrop som görs medan Ghost inte körs sparas inte: avsändaren måste skicka det igen."
"A POST to it runs the task; {{body}}, {{body.<field>}} or {{header.<name>}} in what it says is what was sent, marked as data from outside; it can still try to steer the agent, so read it as you would anything pasted in. A call made while Ghost is not running is not held: the sender has to send it again.":
  zh-CN: "向它发送 POST 即运行任务；其内容中的 {{body}}、{{body.<field>}} 或 {{header.<name>}} 是发送来的内容，标记为来自外部的数据；它仍可能试图引导智能体，请像对待任何粘贴进来的内容一样看待它。Ghost 未运行时的调用不会保留：发送方需要重新发送。"
  de: "Ein POST an sie führt die Aufgabe aus; {{body}}, {{body.<field>}} oder {{header.<name>}} in ihrem Text ist das Gesendete, als Daten von außen markiert; es kann dennoch versuchen, den Agenten zu lenken, also lies es wie alles Eingefügte. Ein Aufruf, während Ghost nicht läuft, wird nicht gehalten: Der Absender muss ihn erneut senden."
  es: "Un POST a ella ejecuta la tarea; {{body}}, {{body.<field>}} o {{header.<name>}} en lo que dice es lo enviado, marcado como datos de fuera; aun así puede intentar dirigir al agente, así que léelo como cualquier cosa pegada. Una llamada hecha mientras Ghost no se ejecuta no se guarda: el remitente debe enviarla de nuevo."
  fr: "Un POST vers elle lance la tâche ; {{body}}, {{body.<field>}} ou {{header.<name>}} dans ce qu’elle dit est ce qui a été envoyé, marqué comme données venues de l’extérieur ; cela peut tout de même tenter d’orienter l’agent, lisez-le donc comme tout ce qui est collé. Un appel fait pendant que Ghost ne tourne pas n’est pas gardé : l’expéditeur doit le renvoyer."
  ja: "これへの POST でタスクが実行されます。本文の {{body}}、{{body.<field>}}、{{header.<name>}} は送られた内容で、外部からのデータとして示されます。それでもエージェントを誘導しようとすることがあるので、貼り付けた内容と同じように扱ってください。Ghost が動いていない間の呼び出しは保持されないため、送信元が送り直す必要があります。"
  ko: "여기에 POST하면 작업이 실행됩니다. 내용의 {{body}}, {{body.<field>}}, {{header.<name>}}는 보낸 내용이며 외부 데이터로 표시됩니다. 그래도 에이전트를 조종하려 할 수 있으니 붙여 넣은 내용처럼 읽으세요. Ghost가 실행 중이 아닐 때의 호출은 보관되지 않으므로 보내는 쪽이 다시 보내야 합니다."
  pt-BR: "Um POST nela executa a tarefa; {{body}}, {{body.<field>}} ou {{header.<name>}} no texto é o que foi enviado, marcado como dados de fora; ainda pode tentar conduzir o agente, então leia como qualquer coisa colada. Uma chamada feita enquanto o Ghost não está rodando não é guardada: o remetente precisa enviá-la de novo."
  ru: "POST на неё запускает задачу; {{body}}, {{body.<field>}} или {{header.<name>}} в тексте — то, что прислали, помеченное как данные извне; это всё равно может пытаться направлять агента, так что читайте это как любой вставленный текст. Вызов, сделанный, пока Ghost не запущен, не сохраняется: отправителю придётся прислать его снова."
  sv: "En POST till den kör uppgiften; {{body}}, {{body.<field>}} eller {{header.<name>}} i det den säger är det som skickades, märkt som data utifrån; det kan ändå försöka styra agenten, så läs det som allt du klistrar in. Ett anrop som görs medan Ghost inte körs sparas inte: avsändaren måste skicka det igen."
"A project can choose otherwise from its menu.":
  zh-CN: "项目可在其菜单中另作选择。"
  de: "Ein Projekt kann im eigenen Menü etwas anderes wählen."
  es: "Un proyecto puede elegir otra cosa desde su menú."
  fr: "Un projet peut choisir autrement depuis son menu."
  ja: "プロジェクトはメニューから別の設定を選べます。"
  ko: "프로젝트 메뉴에서 다르게 선택할 수 있습니다."
  pt-BR: "Um projeto pode escolher outra opção no próprio menu."
  ru: "Проект может выбрать иначе в своём меню."
  sv: "Ett projekt kan välja annat i sin meny."
"A project's sessions, and the projects: your last message, anything happening, when each began, or name. Pinned ones stay on top.":
  zh-CN: "项目内的会话及项目本身：按你的最后一条消息、最近动态、开始时间或名称排序。置顶的始终在最上方。"
  de: "Sitzungen eines Projekts und die Projekte: Ihre letzte Nachricht, laufende Aktivität, Beginn oder Name. Angepinnte bleiben oben."
  es: "Las sesiones de un proyecto y los proyectos: tu último mensaje, cualquier actividad, cuándo empezó cada uno, o el nombre. Los fijados quedan arriba."
  fr: "Les sessions d’un projet, et les projets : votre dernier message, toute activité en cours, la date de début de chacun, ou le nom. Les éléments épinglés restent en haut."
  ja: "プロジェクト内のセッションとプロジェクト：最後のメッセージ、最近の動き、開始日時、または名前の順。ピン留めしたものは常に上に表示されます。"
  ko: "프로젝트의 세션과 프로젝트: 마지막 메시지, 진행 중인 활동, 시작 시각 또는 이름. 고정된 항목은 맨 위에 유지됩니다."
  pt-BR: "As sessões de um projeto e os projetos: sua última mensagem, o que está acontecendo, quando cada um começou ou o nome. Os fixados ficam no topo."
  ru: "Сеансы проекта и сами проекты: по вашему последнему сообщению, активности, времени начала или имени. Закреплённые остаются вверху."
  sv: "Ett projekts sessioner och projekten: ditt senaste meddelande, något som pågår, när var och en började, eller namn. Fästa stannar överst."
"A prompt said to an agent on a schedule. Ghost's server runs them, so they run while the window is closed; each run's session is in the sidebar.":
  zh-CN: "按计划发给智能体的提示。由 Ghost 的服务器运行，因此窗口关闭时也会运行；每次运行的会话都在侧边栏中。"
  de: "Ein Prompt, der einem Agent nach Zeitplan gesagt wird. Der Server von Ghost führt sie aus, daher laufen sie auch bei geschlossenem Fenster; die Sitzung jedes Laufs steht in der Seitenleiste."
  es: "Un prompt dicho a un agente según un horario. El servidor de Ghost las ejecuta, así que se ejecutan con la ventana cerrada; la sesión de cada ejecución está en la barra lateral."
  fr: "Un prompt dit à un agent selon un calendrier. Le serveur de Ghost les exécute, ils tournent donc même fenêtre fermée ; la session de chaque exécution est dans la barre latérale."
  ja: "スケジュールに沿ってエージェントに送るプロンプト。Ghost のサーバが実行するため、ウインドウを閉じていても実行されます。各実行のセッションはサイドバーにあります。"
  ko: "일정에 따라 에이전트에 전달하는 프롬프트입니다. Ghost의 서버가 실행하므로 윈도우가 닫혀 있어도 실행되며, 각 실행의 세션은 사이드바에 있습니다."
  pt-BR: "Um prompt dito a um agente em um horário agendado. O servidor do Ghost os executa, então eles rodam com a janela fechada; a sessão de cada execução fica na barra lateral."
  ru: "Запрос, отправляемый агенту по расписанию. Их выполняет сервер Ghost, поэтому они работают и при закрытом окне; сеанс каждого запуска виден на боковой панели."
  sv: "En prompt som sägs till en agent enligt ett schema. Ghosts server kör dem, så de körs medan fönstret är stängt; varje körnings session finns i sidofältet."
"A quick tunnel: a new address each time it starts, so pair again with a new link.":
  zh-CN: "快速隧道：每次启动都是新地址，因此需用新链接重新配对。"
  de: "Ein Schnelltunnel: bei jedem Start eine neue Adresse, also mit einem neuen Link erneut koppeln."
  es: "Un túnel rápido: una dirección nueva cada vez que se inicia, así que vuelve a emparejar con un enlace nuevo."
  fr: "Un tunnel rapide : une nouvelle adresse à chaque démarrage, il faut donc appairer à nouveau avec un nouveau lien."
  ja: "クイックトンネル：起動するたびにアドレスが変わるため、新しいリンクで再度ペアリングしてください。"
  ko: "빠른 터널: 시작할 때마다 주소가 바뀌므로 새 링크로 다시 페어링하십시오."
  pt-BR: "Um túnel rápido: um endereço novo a cada início, então pareie novamente com um novo link."
  ru: "Быстрый туннель: при каждом запуске новый адрес, поэтому сопрягайтесь заново по новой ссылке."
  sv: "En snabbtunnel: en ny adress varje gång den startar, så parkoppla igen med en ny länk."
"A regular expression":
  zh-CN: "正则表达式"
  de: "Ein regulärer Ausdruck"
  es: "Una expresión regular"
  fr: "Une expression régulière"
  ja: "正規表現"
  ko: "정규 표현식"
  pt-BR: "Uma expressão regular"
  ru: "Регулярное выражение"
  sv: "Ett reguljärt uttryck"
"A repository with a README, in %{at}":
  zh-CN: "一个带 README 的仓库，位于 %{at}"
  de: "Ein Repository mit README, in %{at}"
  es: "Un repositorio con un README, en %{at}"
  fr: "Un dépôt avec un README, dans %{at}"
  ja: "README 付きのリポジトリ（%{at}）"
  ko: "%{at}에 README가 있는 저장소"
  pt-BR: "Um repositório com um README, em %{at}"
  ru: "Репозиторий с README в %{at}"
  sv: "Ett repo med en README, i %{at}"
"A rule is { \"key\": \"cmd-shift-n\", \"action\": \"new_session\" }, with \"when\": \"Terminal\" (or \"Composer\", with !, && and ||) for where it holds, \"action\": \"none\" to take a key away, and \"-new_session\" to take it from that action alone; \"script:dev\" runs the script dev. The last rule that holds wins. Ghost reads the file as it starts.":
  zh-CN: "一条规则形如 { \"key\": \"cmd-shift-n\", \"action\": \"new_session\" }，用 \"when\": \"Terminal\"（或 \"Composer\"，可用 !、&& 和 ||）指定生效位置，\"action\": \"none\" 移除一个按键，\"-new_session\" 只从该操作移除它；\"script:dev\" 运行脚本 dev。最后一条生效的规则优先。Ghost 在启动时读取此文件。"
  de: "Eine Regel ist { \"key\": \"cmd-shift-n\", \"action\": \"new_session\" }, mit \"when\": \"Terminal\" (oder \"Composer\", mit !, && und ||) für den Geltungsbereich, \"action\": \"none\", um eine Taste zu entfernen, und \"-new_session\", um sie nur dieser Aktion zu entziehen; \"script:dev\" führt das Skript dev aus. Die letzte zutreffende Regel gewinnt. Ghost liest die Datei beim Start."
  es: "Una regla es { \"key\": \"cmd-shift-n\", \"action\": \"new_session\" }, con \"when\": \"Terminal\" (o \"Composer\", con !, && y ||) para indicar dónde aplica, \"action\": \"none\" para quitar una tecla, y \"-new_session\" para quitarla solo de esa acción; \"script:dev\" ejecuta el script dev. Gana la última regla que aplica. Ghost lee el archivo al iniciarse."
  fr: "Une règle s’écrit { \"key\": \"cmd-shift-n\", \"action\": \"new_session\" }, avec \"when\": \"Terminal\" (ou \"Composer\", avec !, && et ||) pour l’endroit où elle s’applique, \"action\": \"none\" pour retirer une touche, et \"-new_session\" pour la retirer de cette seule action ; \"script:dev\" exécute le script dev. La dernière règle qui s’applique l’emporte. Ghost lit le fichier au démarrage."
  ja: "ルールは { \"key\": \"cmd-shift-n\", \"action\": \"new_session\" } の形式です。\"when\": \"Terminal\"（または \"Composer\"、!、&&、|| も使用可）で有効な場所を指定し、\"action\": \"none\" でキーを外し、\"-new_session\" でその操作からのみ外します。\"script:dev\" はスクリプト dev を実行します。最後に有効なルールが優先されます。Ghost は起動時にこのファイルを読み込みます。"
  ko: "규칙은 { \"key\": \"cmd-shift-n\", \"action\": \"new_session\" } 형식이며, 적용 위치는 \"when\": \"Terminal\"(또는 !, &&, ||를 쓴 \"Composer\"), 키를 해제하려면 \"action\": \"none\", 해당 동작에서만 해제하려면 \"-new_session\"을 씁니다. \"script:dev\"는 dev 스크립트를 실행합니다. 마지막으로 적용되는 규칙이 우선합니다. Ghost는 시작할 때 파일을 읽습니다."
  pt-BR: "Uma regra é { \"key\": \"cmd-shift-n\", \"action\": \"new_session\" }, com \"when\": \"Terminal\" (ou \"Composer\", com !, && e ||) para onde ela vale, \"action\": \"none\" para remover uma tecla e \"-new_session\" para removê-la apenas dessa ação; \"script:dev\" executa o script dev. A última regra que vale prevalece. O Ghost lê o arquivo ao iniciar."
  ru: "Правило выглядит так: { \"key\": \"cmd-shift-n\", \"action\": \"new_session\" }, с \"when\": \"Terminal\" (или \"Composer\", с !, && и ||) — где оно действует, \"action\": \"none\" — чтобы отключить клавишу, и \"-new_session\" — чтобы отключить её только для этого действия; \"script:dev\" запускает скрипт dev. Побеждает последнее подходящее правило. Ghost читает файл при запуске."
  sv: "En regel är { \"key\": \"cmd-shift-n\", \"action\": \"new_session\" }, med \"when\": \"Terminal\" (eller \"Composer\", med !, && och ||) för var den gäller, \"action\": \"none\" för att ta bort en tangent och \"-new_session\" för att ta den från bara den åtgärden; \"script:dev\" kör skriptet dev. Den sista regeln som gäller vinner. Ghost läser filen när den startar."
