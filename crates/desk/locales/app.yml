"Beyond this Mac and its tunnel: Tailscale, or every network it is on, Tailscale too. There Ghost speaks TLS itself, on the port after its own; a device pairs with a link that pins its certificate.":
  zh-CN: "除这台 Mac 及其隧道外：Tailscale，或它所在的所有网络（包括 Tailscale）。在那里 Ghost 自己使用 TLS，端口为其自身端口的下一个；设备通过固定其证书的链接配对。"
  de: "Über diesen Mac und seinen Tunnel hinaus: Tailscale oder jedes Netzwerk, in dem er ist, Tailscale eingeschlossen. Dort spricht Ghost selbst TLS, auf dem Port nach seinem eigenen; ein Gerät koppelt sich mit einem Link, der sein Zertifikat anheftet."
  es: "Más allá de este Mac y su túnel: Tailscale, o todas las redes en las que esté, Tailscale incluida. Allí Ghost habla TLS por sí mismo, en el puerto siguiente al suyo; un dispositivo se empareja con un enlace que fija su certificado."
  fr: "Au-delà de ce Mac et de son tunnel : Tailscale, ou tous les réseaux où il se trouve, Tailscale compris. Là, Ghost parle TLS lui-même, sur le port suivant le sien ; un appareil s’associe avec un lien qui épingle son certificat."
  ja: "この Mac とそのトンネルのほかに：Tailscale、または Tailscale を含む接続中のすべてのネットワーク。そこでは Ghost 自身が自分のポートの次のポートで TLS を話し、デバイスは証明書を固定したリンクでペアリングします。"
  ko: "이 Mac과 터널 외에: Tailscale 또는 Tailscale을 포함해 연결된 모든 네트워크. 그곳에서 Ghost는 자기 포트 다음 포트에서 직접 TLS를 사용하며, 기기는 인증서를 고정한 링크로 페어링합니다."
  pt-BR: "Além deste Mac e do seu túnel: Tailscale, ou todas as redes em que ele está, incluindo Tailscale. Ali o Ghost fala TLS por si, na porta seguinte à sua; um dispositivo pareia com um link que fixa o certificado."
  ru: "Помимо этого Mac и его туннеля: Tailscale или все сети, в которых он есть, включая Tailscale. Там Ghost сам использует TLS на порту, следующем за своим; устройство связывается по ссылке, закрепляющей его сертификат."
  sv: "Utöver den här Macen och dess tunnel: Tailscale, eller varje nätverk den är på, Tailscale också. Där talar Ghost TLS själv, på porten efter sin egen; en enhet parkopplas med en länk som fäster dess certifikat."
