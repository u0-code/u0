  ja: "プロジェクト内のスレッドとプロジェクト：最後のメッセージ、最近の動き、開始日時、または名前の順。ピン留めしたものは常に上に表示されます。"
  ko: "프로젝트의 스레드와 프로젝트: 마지막 메시지, 진행 중인 활동, 시작 시각 또는 이름. 고정된 항목은 맨 위에 유지됩니다."
