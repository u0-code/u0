"Where Return does not send, it breaks the line. The other key (⌘Return, or ⇧⌘Return) begins another session beside it, or while a turn goes on does the opposite of the setting above.":
  zh-CN: "Return 不发送时用于换行。另一个键（⌘Return 或 ⇧⌘Return）会在旁边开始另一个会话，或在一轮进行中时执行与上方设置相反的操作。"
  de: "Wo Return nicht sendet, bricht es die Zeile um. Die andere Taste (⌘Return oder ⇧⌘Return) beginnt daneben eine weitere Sitzung oder bewirkt während einer laufenden Runde das Gegenteil der obigen Einstellung."
  es: "Donde Return no envía, inserta un salto de línea. La otra tecla (⌘Return, o ⇧⌘Return) inicia otra sesión junto a ella, o mientras hay un turno en curso hace lo contrario del ajuste de arriba."
  fr: "Là où Retour n’envoie pas, il insère un saut de ligne. L’autre touche (⌘Retour, ou ⇧⌘Retour) démarre une autre session à côté, ou pendant un tour fait l’inverse du réglage ci-dessus."
  ja: "Return で送信しない場合は改行します。もう一方のキー（⌘Return または ⇧⌘Return）は横に別のセッションを開始します。ターンの進行中は、上の設定と逆の動作をします。"
  ko: "Return으로 보내지 않을 때는 줄을 바꿉니다. 다른 키(⌘Return 또는 ⇧⌘Return)는 옆에 다른 세션을 시작하거나, 턴이 진행 중일 때는 위 설정과 반대로 동작합니다."
  pt-BR: "Onde Return não envia, ele quebra a linha. A outra tecla (⌘Return ou ⇧⌘Return) inicia outra sessão ao lado, ou, durante um turno, faz o oposto do ajuste acima."
  ru: "Там, где Return не отправляет, он переносит строку. Другая клавиша (⌘Return или ⇧⌘Return) начинает рядом ещё один сеанс, а во время хода делает противоположное настройке выше."
  sv: "Där Retur inte skickar bryter den raden. Den andra tangenten (⌘Retur eller ⇧⌘Retur) börjar en annan session bredvid, eller gör motsatsen till inställningen ovan medan en omgång pågår."
"Where they work: in the folder, or a worktree of their own on a new branch.":
  zh-CN: "工作位置：在文件夹中，或在新分支上的独立工作树中。"
  de: "Wo sie arbeiten: im Ordner oder in einem eigenen Worktree auf einem neuen Branch."
  es: "Dónde trabajan: en la carpeta, o en un worktree propio en una rama nueva."
  fr: "Où elles travaillent : dans le dossier, ou dans un worktree à part sur une nouvelle branche."
  ja: "作業場所：フォルダ内、または新しいブランチの専用ワークツリー。"
  ko: "작업 위치: 폴더 또는 새 브랜치의 자체 워크트리."
  pt-BR: "Onde elas trabalham: na pasta ou em um worktree próprio em um novo branch."
  ru: "Где они работают: в папке или в собственном рабочем дереве на новой ветке."
  sv: "Där de arbetar: i mappen, eller i ett eget arbetsträd på en ny gren."
"Where your projects' code and issues are. A token of yours is used over the CLI's own sign-in, and kept in the macOS Keychain, never in a file; it may be a 1Password reference (op://).":
  zh-CN: "你的项目代码和议题所在的平台。你的令牌优先于 CLI 自身的登录，保存在 macOS 钥匙串中，从不写入文件；也可以是 1Password 引用（op://）。"
  de: "Wo Code und Issues Ihrer Projekte liegen. Ein eigener Token wird statt der Anmeldung der CLI verwendet und im macOS-Keychain aufbewahrt, nie in einer Datei; er kann eine 1Password-Referenz sein (op://)."
  es: "Dónde están el código y los issues de tus proyectos. Un token tuyo se usa en lugar del inicio de sesión propio de la CLI, y se guarda en el Keychain de macOS, nunca en un archivo; puede ser una referencia de 1Password (op://)."
  fr: "Où se trouvent le code et les tickets de vos projets. Un jeton à vous est utilisé à la place de la connexion de la CLI, et conservé dans le Keychain de macOS, jamais dans un fichier ; ce peut être une référence 1Password (op://)."
  ja: "プロジェクトのコードとイシューがある場所。あなたのトークンは CLI 自身のサインインより優先して使われ、ファイルではなく macOS の Keychain に保存されます。1Password の参照（op://）も指定できます。"
  ko: "프로젝트의 코드와 이슈가 있는 곳. 사용자 토큰은 CLI 자체 로그인보다 우선 사용되며, 파일이 아닌 macOS Keychain에 보관됩니다. 1Password 참조(op://)일 수도 있습니다."
  pt-BR: "Onde estão o código e as issues dos seus projetos. Um token seu é usado no lugar do login da própria CLI e guardado no Keychain do macOS, nunca em um arquivo; ele pode ser uma referência do 1Password (op://)."
  ru: "Где находятся код и проблемы ваших проектов. Ваш токен используется вместо собственного входа CLI и хранится в macOS Keychain, а не в файле; это может быть ссылка 1Password (op://)."
  sv: "Där dina projekts kod och ärenden finns. En token som är din används i stället för CLI:ns egen inloggning och sparas i macOS Keychain, aldrig i en fil; den kan vara en 1Password-referens (op://)."
