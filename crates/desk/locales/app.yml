  fr: "Aucun agent n’a indiqué le coût ou la durée d’une session sur cette période. Tous les agents ne le disent pas ; Ghost ne devine pas."
  ja: "この期間にセッションのコストや使用量を伝えたエージェントはありません。すべてのエージェントが伝えるわけではなく、Ghost は推測しません。"
  ko: "이 기간 동안 세션 비용이나 소요 시간을 알려 준 에이전트가 없습니다. 모든 에이전트가 알려 주지는 않으며, Ghost는 추정하지 않습니다."
  pt-BR: "Nenhum agente informou quanto uma sessão custou ou consumiu neste período. Nem todo agente informa; o Ghost não adivinha."
  ru: "Ни один агент не сообщил стоимость или длительность сеанса за этот период. Не все агенты сообщают это; Ghost не угадывает."
  sv: "Ingen agent angav vad en session kostade eller tog under den här tiden. Inte alla agenter anger det; Ghost gissar inte."
