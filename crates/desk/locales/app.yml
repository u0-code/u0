  de: "Der Bildschirm darf trotzdem schlafen."
  es: "La pantalla aún puede reposar."
  fr: "L’écran peut tout de même se mettre en veille."
  ja: "ディスプレイはスリープすることがあります。"
  ko: "디스플레이는 잠자기될 수 있습니다."
  pt-BR: "A tela ainda pode entrar em repouso."
  ru: "Дисплей всё равно может засыпать."
  sv: "Skärmen kan fortfarande vila."
"Files restored to before turn %{turn}. Tell %{name} what changed.":
  zh-CN: "文件已恢复到第 %{turn} 轮之前。请告诉 %{name} 有何变化。"
  de: "Dateien auf den Stand vor Turn %{turn} zurückgesetzt. Sagen Sie %{name}, was sich geändert hat."
  es: "Archivos restaurados a antes del turno %{turn}. Dile a %{name} qué cambió."
  fr: "Fichiers restaurés avant le tour %{turn}. Dites à %{name} ce qui a changé."
  ja: "ファイルをターン %{turn} の前に戻しました。%{name} に変更点を伝えてください。"
  ko: "파일을 %{turn}번째 턴 이전으로 되돌렸습니다. %{name}에게 바뀐 점을 알려 주세요."
  pt-BR: "Arquivos restaurados para antes do turno %{turn}. Diga ao %{name} o que mudou."
  ru: "Файлы возвращены к состоянию до хода %{turn}. Сообщите %{name}, что изменилось."
  sv: "Filerna återställda till före tur %{turn}. Berätta för %{name} vad som ändrats."
"The files go back to how they were before this.":
  zh-CN: "文件恢复到此之前的样子。"
  de: "Die Dateien werden auf den Stand vor diesem Punkt zurückgesetzt."
  es: "Los archivos vuelven a como estaban antes de esto."
  fr: "Les fichiers reviennent à leur état d’avant ceci."
  ja: "ファイルはこの前の状態に戻ります。"
  ko: "파일이 이 시점 이전 상태로 되돌아갑니다."
  pt-BR: "Os arquivos voltam a ser como eram antes disto."
  ru: "Файлы вернутся к состоянию до этого момента."
  sv: "Filerna återgår till hur de var före detta."
"The first %{shown} of %{of} pages: open it to read the rest.":
