"The days of log kept; older files go as u0 starts.":
  zh-CN: "日志保留的天数；更早的文件在 u0 启动时删除。"
  de: "Die Tage, für die Logs aufbewahrt werden; ältere Dateien werden beim Start von u0 entfernt."
  es: "Los días de registro conservados; los archivos más antiguos se eliminan al iniciarse u0."
  fr: "Les jours de journal conservés ; les fichiers plus anciens sont supprimés au démarrage de u0."
  ja: "ログを保持する日数。古いファイルは u0 の起動時に削除されます。"
  ko: "로그를 보관하는 일수. 오래된 파일은 u0가 시작될 때 삭제됩니다."
  pt-BR: "Os dias de log mantidos; arquivos mais antigos são removidos quando o u0 inicia."
  ru: "Сколько дней хранится журнал; старые файлы удаляются при запуске u0."
  sv: "Antal dagar loggen sparas; äldre filer tas bort när u0 startar."
"It waits under Devices until you let it in.":
  zh-CN: "设备会在“设备”中等待，直到你允许接入。"
  de: "Es wartet unter Geräte, bis du es zulässt."
  es: "Espera en Dispositivos hasta que lo dejes entrar."
  fr: "Il attend dans Appareils jusqu’à ce que vous l’autorisiez."
  ja: "許可するまでデバイスで待機します。"
  ko: "허용할 때까지 기기에서 대기합니다."
  pt-BR: "Ele espera em Dispositivos até você permitir."
  ru: "Оно ждёт в разделе «Устройства», пока вы его не впустите."
  sv: "Den väntar under Enheter tills du släpper in den."
"The display may still sleep.":
