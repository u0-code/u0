  ja: "1 回限り、10 分間有効（%{ago}前に作成）：もう一方の Mac で開くか、コードをスキャンするか、そちらの「ほかの Mac とペアリング」に貼り付けてください。"
  ko: "10분 동안 한 번만 사용할 수 있습니다(%{ago} 전에 만듦). 다른 Mac에서 열거나, 코드를 스캔하거나, 그곳의 ‘다른 Mac과 페어링’에 붙여 넣으십시오."
  pt-BR: "Funciona uma vez, por dez minutos (criado %{ago}): abra-o no outro Mac, escaneie o código ou cole-o em Parear com outro Mac lá."
  ru: "Действует один раз, десять минут (создана %{ago}): откройте её на другом Mac, отсканируйте код или вставьте её там в «Сопрячь с другим Mac»."
  sv: "Fungerar en gång, i tio minuter (skapad för %{ago} sedan): öppna den på den andra Mac-datorn, skanna dess kod, eller klistra in den under Parkoppla med en annan Mac där."
