  de: "Co-authored-by-Zeilen und Fußzeilen, die einen Agent nennen, werden aus der Nachricht eines Squash-Commits entfernt; die von Personen bleiben."
  es: "Las líneas Co-authored-by y los pies que dan crédito a un agente se quitan del mensaje de un commit con squash; los de una persona se quedan."
  fr: "Les lignes Co-authored-by et les pieds de page qui créditent un agent sont retirés du message d’un commit squashé ; ceux d’une personne restent."
  ja: "エージェントをクレジットする Co-authored-by 行とフッターは、スカッシュしたコミットのメッセージから除かれます。人のものは残ります。"
  ko: "에이전트를 기재한 Co-authored-by 줄과 바닥글은 스쿼시된 커밋 메시지에서 제거되며, 사람의 것은 유지됩니다."
  pt-BR: "Linhas Co-authored-by e rodapés que dão crédito a um agente são removidos da mensagem de um commit com squash; os de pessoas permanecem."
  ru: "Строки Co-authored-by и подписи, указывающие агента, удаляются из сообщения squash-коммита; строки людей остаются."
  sv: "Co-authored-by-rader och sidfötter som tillskriver en agent tas bort ur en squashad commits meddelande; en persons stannar kvar."
