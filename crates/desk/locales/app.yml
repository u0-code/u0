  ru: "В отдельном треде, который удаляется после ответа; тратит столько же, сколько ход."
  sv: "I en egen tråd, raderad när den har svarat; den kostar det en omgång kostar."
"In a thread of yours, not one u0 turns on its own (a task's, a workflow's), so that no task runs on its own runs. {{event}} in what it says is what happened, marked as data from outside.":
  zh-CN: "在你的线程中，而不是 u0 自行发起的线程（任务的、工作流的），这样任务不会因自身的运行而运行。其内容中的 {{event}} 是发生的事情，标记为来自外部的数据。"
  de: "In einem Thread von dir, nicht in einem, den u0 selbst anstößt (dem einer Aufgabe, eines Workflows), sodass keine Aufgabe auf ihre eigenen Läufe hin läuft. {{event}} in seinem Text ist, was geschah, als Daten von außen markiert."
  es: "En un hilo tuyo, no en uno que u0 inicie por su cuenta (de una tarea, de un flujo de trabajo), para que ninguna tarea se ejecute por sus propias ejecuciones. {{event}} en lo que dice es lo que ocurrió, marcado como datos de fuera."
  fr: "Dans un fil à vous, pas dans un fil que u0 lance de lui-même (celui d’une tâche, d’un workflow), pour qu’aucune tâche ne s’exécute sur ses propres exécutions. {{event}} dans ce qu’elle dit est ce qui s’est passé, marqué comme données venues de l’extérieur."
  ja: "u0 が自分で始めたもの（タスクやワークフローのもの）ではなく、あなたのスレッドで。こうすればタスクが自分の実行で動くことはありません。本文の {{event}} は起きたことで、外部からのデータとして示されます。"
  ko: "u0가 스스로 시작한 스레드(작업, 워크플로의 스레드)가 아닌 내 스레드에서. 그래야 작업이 자신의 실행으로 실행되지 않습니다. 내용의 {{event}}는 일어난 일이며 외부 데이터로 표시됩니다."
  pt-BR: "Numa thread sua, não numa que o u0 inicia por conta própria (de uma tarefa, de um fluxo), para que nenhuma tarefa rode por suas próprias execuções. {{event}} no texto é o que aconteceu, marcado como dados de fora."
  ru: "В вашем треде, а не в том, что u0 запускает сам (тред задачи, рабочего процесса), чтобы задача не запускалась от собственных запусков. {{event}} в тексте — то, что произошло, помеченное как данные извне."
  sv: "I en av dina trådar, inte en som u0 startar själv (en uppgifts, ett arbetsflödes), så att ingen uppgift körs på sina egna körningar. {{event}} i det den säger är det som hände, märkt som data utifrån."
