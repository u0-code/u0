"The device pairs, then waits under Devices that control this Mac until you let it in: for a link you send someone.":
  zh-CN: "设备完成配对后，会在“控制这台 Mac 的设备”下等待，直到你允许它进入：适用于你发给别人的链接。"
  de: "Das Gerät koppelt sich und wartet dann unter Geräte, die diesen Mac steuern, bis du es einlässt: für einen Link, den du jemandem schickst."
  es: "El dispositivo se empareja y espera en Dispositivos que controlan este Mac hasta que le dejes entrar: para un enlace que envíes a alguien."
  fr: "L’appareil s’associe, puis attend sous Appareils qui contrôlent ce Mac jusqu’à ce que vous l’admettiez : pour un lien que vous envoyez à quelqu’un."
  ja: "デバイスはペアリングした後、「この Mac を操作するデバイス」で許可されるまで待ちます。誰かに送るリンク向けです。"
  ko: "기기는 페어링한 뒤 이 Mac을 제어하는 기기 아래에서 허용될 때까지 기다립니다. 다른 사람에게 보내는 링크용입니다."
  pt-BR: "O dispositivo pareia e depois espera em Dispositivos que controlam este Mac até você admiti-lo: para um link que você envia a alguém."
  ru: "Устройство связывается и ждёт в разделе «Устройства, управляющие этим Mac», пока вы его не впустите: для ссылки, которую вы кому-то отправляете."
  sv: "Enheten parkopplas och väntar sedan under Enheter som styr den här Macen tills du släpper in den: för en länk du skickar till någon."
