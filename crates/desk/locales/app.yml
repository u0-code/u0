  de: "u0 <folder> in einem Terminal öffnet den Ordner hier als Projekt. Er kommt nach ~/.local/bin."
  es: "u0 <folder> en un terminal abre la carpeta aquí como proyecto. Va en ~/.local/bin."
  fr: "u0 <folder> dans un terminal ouvre le dossier ici comme projet. Elle va dans ~/.local/bin."
  ja: "ターミナルで u0 <folder> を実行すると、そのフォルダがここでプロジェクトとして開きます。~/.local/bin に置かれます。"
  ko: "터미널에서 u0 <folder>를 실행하면 폴더가 여기에서 프로젝트로 열립니다. ~/.local/bin에 설치됩니다."
