"Listening on 127.0.0.1:%{port}, and on the networks chosen under Reach. Only a device paired with it comes in.":
  zh-CN: "正在 127.0.0.1:%{port} 以及“可达”中所选的网络上监听。只有与它配对的设备才能进入。"
  de: "Lauscht auf 127.0.0.1:%{port} und in den unter Erreichbarkeit gewählten Netzwerken. Nur ein damit gekoppeltes Gerät kommt herein."
  es: "Escuchando en 127.0.0.1:%{port} y en las redes elegidas en Alcance. Solo entra un dispositivo emparejado con él."
  fr: "À l’écoute sur 127.0.0.1:%{port} et sur les réseaux choisis sous Accès. Seul un appareil associé entre."
  ja: "127.0.0.1:%{port} と「到達」で選んだネットワークで待ち受けています。ペアリングしたデバイスだけが入れます。"
  ko: "127.0.0.1:%{port}과(와) 도달에서 고른 네트워크에서 수신 중입니다. 페어링된 기기만 들어올 수 있습니다."
  pt-BR: "Escutando em 127.0.0.1:%{port} e nas redes escolhidas em Alcance. Só entra um dispositivo pareado com ele."
  ru: "Слушает на 127.0.0.1:%{port} и в сетях, выбранных в разделе «Доступ». Войти может только связанное с ним устройство."
  sv: "Lyssnar på 127.0.0.1:%{port} och på de nätverk som valts under Nåbarhet. Bara en enhet som är parkopplad med den kommer in."
"Listening on 127.0.0.1:%{port}, for a tunnel or an ssh -L to reach. Only a device paired with it comes in.":
  zh-CN: "正在 127.0.0.1:%{port} 上监听，供隧道或 ssh -L 访问。只有与它配对的设备才能进入。"
  de: "Lauscht auf 127.0.0.1:%{port}, erreichbar für einen Tunnel oder ein ssh -L. Nur ein damit gekoppeltes Gerät kommt herein."
  es: "Escuchando en 127.0.0.1:%{port}, para que llegue un túnel o un ssh -L. Solo entra un dispositivo emparejado con él."
  fr: "Écoute sur 127.0.0.1:%{port}, pour qu’un tunnel ou un ssh -L l’atteigne. Seul un appareil appairé peut entrer."
  ja: "127.0.0.1:%{port} で待ち受け中。トンネルまたは ssh -L で接続できます。ペアリングしたデバイスのみが入れます。"
  ko: "터널이나 ssh -L로 접근할 수 있도록 127.0.0.1:%{port}에서 수신 대기 중입니다. 페어링된 기기만 들어올 수 있습니다."
  pt-BR: "Escutando em 127.0.0.1:%{port}, para um túnel ou um ssh -L alcançar. Só entra um dispositivo pareado com ele."
  ru: "Слушает на 127.0.0.1:%{port} для туннеля или ssh -L. Войти может только сопряжённое с ним устройство."
  sv: "Lyssnar på 127.0.0.1:%{port}, för en tunnel eller ett ssh -L att nå. Bara en enhet som är parkopplad med den kommer in."
