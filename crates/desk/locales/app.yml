  zh-CN: "macOS 无法仅在本机识别这种语言：请选择其他语言，或在「系统设置 › 键盘 › 听写」中添加。在 Ghost.app 之外（通过 cargo）运行的 Ghost 完全无法听写。"
  de: "macOS kann diese Sprache nicht allein auf diesem Mac erkennen: Wählen Sie eine andere oder fügen Sie sie unter Systemeinstellungen › Tastatur › Diktat hinzu. Ein außerhalb von Ghost.app (per cargo) gestartetes Ghost kann gar nicht zuhören."
  es: "macOS no puede oír este idioma solo en este Mac: elige otro o añádelo en Ajustes del Sistema › Teclado › Dictado. Ghost ejecutado fuera de Ghost.app (desde cargo) no puede escuchar."
  fr: "macOS ne peut pas reconnaître cette langue sur ce Mac seul : choisissez-en une autre, ou ajoutez-la dans Réglages Système › Clavier › Dictée. Ghost lancé hors de Ghost.app (depuis cargo) ne peut pas écouter du tout."
  ja: "macOS はこの Mac 上だけではこの言語を聞き取れません。別の言語を選ぶか、「システム設定 › キーボード › 音声入力」で追加してください。Ghost.app の外（cargo から）で実行した Ghost はまったく聞き取れません。"
  ko: "macOS가 이 Mac에서만으로는 이 언어를 인식할 수 없습니다. 다른 언어를 선택하거나 시스템 설정 › 키보드 › 받아쓰기에서 추가하십시오. Ghost.app 밖에서(cargo로) 실행한 Ghost는 전혀 들을 수 없습니다."
  pt-BR: "O macOS não consegue ouvir este idioma apenas neste Mac: escolha outro ou adicione-o em Ajustes do Sistema › Teclado › Ditado. O Ghost executado fora do Ghost.app (pelo cargo) não consegue escutar."
  ru: "macOS не может распознавать этот язык только на этом Mac: выберите другой или добавьте его в Системных настройках › Клавиатура › Диктовка. Ghost, запущенный не из Ghost.app (из cargo), не может слушать вовсе."
  sv: "macOS kan inte höra det här språket på den här Mac-datorn enbart: välj ett annat, eller lägg till det under Systeminställningar › Tangentbord › Diktering. Ghost som körs utanför Ghost.app (från cargo) kan inte lyssna alls."
