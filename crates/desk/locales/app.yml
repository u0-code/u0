"Use u0 on one Mac from another: its agents, threads, files and terminals, as there. Each device comes in by a key of its own, made as it pairs: its private half stays in that device's Keychain, and only the public half, shown by its fingerprint, is sent.":
  zh-CN: "在一台 Mac 上使用另一台 Mac 的 u0：它的智能体、线程、文件和终端，如同在那台机器上。每个设备都通过配对时生成的专属密钥接入：私钥留在该设备的钥匙串中，只发送公钥（以指纹显示）。"
  de: "u0 auf einem Mac von einem anderen aus verwenden: seine Agents, Threads, Dateien und Terminals, wie dort. Jedes Gerät kommt mit einem eigenen, beim Koppeln erstellten Schlüssel herein: Die private Hälfte bleibt im Keychain dieses Geräts, und nur die öffentliche Hälfte, angezeigt durch ihren Fingerabdruck, wird gesendet."
  es: "Usa u0 de un Mac desde otro: sus agentes, hilos, archivos y terminales, como allí. Cada dispositivo entra con una clave propia, creada al emparejarse: su mitad privada se queda en el Keychain de ese dispositivo, y solo se envía la mitad pública, mostrada por su huella digital."
  fr: "Utilisez u0 d’un Mac depuis un autre : ses agents, fils, fichiers et terminaux, comme sur place. Chaque appareil entre avec sa propre clé, créée lors de l’appairage : sa moitié privée reste dans le Keychain de cet appareil, et seule la moitié publique, identifiée par son empreinte, est envoyée."
  ja: "ある Mac の u0 を別の Mac から使えます。エージェント、スレッド、ファイル、ターミナルをその Mac 上と同じように扱えます。各デバイスはペアリング時に作成される独自の鍵で接続します。秘密鍵はそのデバイスの Keychain に残り、フィンガープリントで表示される公開鍵だけが送信されます。"
  ko: "다른 Mac에서 이 Mac의 u0를 사용합니다: 에이전트, 스레드, 파일 및 터미널을 그곳에서처럼 사용할 수 있습니다. 각 기기는 페어링할 때 만든 자체 키로 들어옵니다. 개인 키 부분은 해당 기기의 Keychain에 남고, 지문으로 표시되는 공개 키 부분만 전송됩니다."
  pt-BR: "Use o u0 de um Mac em outro: os agentes, threads, arquivos e terminais dele, como lá. Cada dispositivo entra com uma chave própria, criada ao parear: a metade privada fica no Keychain desse dispositivo, e só a metade pública, mostrada pela impressão digital, é enviada."
  ru: "Пользуйтесь u0 на одном Mac с другого: его агентами, тредами, файлами и терминалами, как там. Каждое устройство входит по собственному ключу, создаваемому при сопряжении: закрытая часть остаётся в Keychain этого устройства, а отправляется только открытая, показанная своим отпечатком."
  sv: "Använd u0 på en Mac från en annan: dess agenter, trådar, filer och terminaler, som där. Varje enhet kommer in med en egen nyckel, skapad när den parkopplas: dess privata halva stannar i den enhetens Keychain, och bara den offentliga halvan, som visas med sitt fingeravtryck, skickas."
