  de: "Was danach kam, wird zurückgelassen; es steht im Eingabefeld, um es erneut zu sagen. Die Dateien bleiben, wie sie sind."
  es: "Lo que vino después se descarta; queda en el compositor para volver a decirlo. Los archivos se quedan como están."
  fr: "Ce qui suivait est abandonné ; c’est dans la zone de saisie pour le redire. Les fichiers restent tels quels."
  ja: "それ以降の内容は破棄され、もう一度送れるよう入力欄に戻ります。ファイルはそのままです。"
  ko: "그 이후 내용은 남겨지며, 다시 말할 수 있도록 작성기에 들어갑니다. 파일은 그대로 유지됩니다."
  pt-BR: "O que veio depois fica para trás; está na caixa de mensagem para ser dito novamente. Os arquivos ficam como estão."
  ru: "Всё, что было после, отбрасывается; это остаётся в поле ввода, чтобы сказать снова. Файлы остаются как есть."
  sv: "Det som kom efter lämnas kvar; det finns i skrivfältet för att sägas igen. Filerna stannar som de är."
