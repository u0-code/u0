  ko: "에이전트가 알려 준 세션 비용과 소요 시간, 그리고 한도 현황."
  pt-BR: "Quanto as sessões custaram e consumiram, e como estão seus limites, segundo os agentes."
  ru: "Стоимость и длительность сеансов и состояние лимитов, по данным агентов."
  sv: "Vad sessioner kostade och tog, och var dina gränser ligger, enligt agenterna."
