"u0 draws no web pages. ⌘-click an address in a terminal opens it the same way. To show the agent what you see, add a screenshot to the composer with + › Add a window.":
  zh-CN: "u0 不渲染网页。在终端中按住 ⌘ 点击地址也会以同样方式打开。若要向智能体展示你所看到的画面，可在输入框中点 + › 添加窗口截图。"
  de: "u0 rendert keine Webseiten. ⌘-Klick auf eine Adresse im Terminal öffnet sie genauso. Um dem Agenten zu zeigen, was Sie sehen, fügen Sie über + › Fenster hinzufügen ein Bildschirmfoto an."
  es: "u0 no dibuja páginas web. ⌘-clic en una dirección del terminal la abre igual. Para mostrarle al agente lo que ves, añade una captura con + › Añadir ventana."
  fr: "u0 n’affiche aucune page web. ⌘-clic sur une adresse dans un terminal l’ouvre de la même façon. Pour montrer à l’agent ce que vous voyez, ajoutez une capture via + › Ajouter une fenêtre."
  ja: "u0 は Web ページを描画しません。ターミナル内のアドレスを ⌘ クリックしても同様に開きます。見えている画面をエージェントに見せるには、入力欄の + › ウィンドウを追加 からスクリーンショットを添付してください。"
  ko: "u0는 웹 페이지를 렌더링하지 않습니다. 터미널에서 주소를 ⌘-클릭해도 같은 방식으로 열립니다. 보고 있는 화면을 에이전트에게 보여주려면 입력창의 + › 창 추가에서 스크린샷을 첨부하세요."
  pt-BR: "O u0 não desenha páginas web. ⌘-clique em um endereço no terminal abre da mesma forma. Para mostrar ao agente o que você vê, adicione uma captura com + › Adicionar janela."
  ru: "u0 не отображает веб-страницы. ⌘-клик по адресу в терминале открывает его так же. Чтобы показать агенту увиденное, приложите снимок через + › Добавить окно."
  sv: "u0 ritar inga webbsidor. ⌘-klick på en adress i en terminal öppnar den på samma sätt. För att visa agenten vad du ser, lägg till en skärmbild i kompositören med + › Lägg till ett fönster."

