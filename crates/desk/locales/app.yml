"Ticked, this Mac starts listening and %{host} pairs back with a key of its own, if its link was made with Pair both ways. Where it can't reach this Mac, the pairing stays one way and says why.":
  zh-CN: "勾选后，若对方链接启用了“双向配对”，这台 Mac 会开始监听并由 %{host} 用其自身密钥反向配对。若无法连通这台 Mac，则保持单向配对并说明原因。"
  de: "Wenn aktiviert, lauscht dieser Mac und %{host} koppelt sich mit eigenem Schlüssel zurück, sofern der Link beidseitig erstellt wurde. Ist dieser Mac nicht erreichbar, bleibt die Kopplung einseitig."
  es: "Al marcarlo, este Mac empieza a escuchar y %{host} se vincula de vuelta con su propia clave si el enlace se creó en ambos sentidos. Si no puede llegar a este Mac, queda en un sentido e indica por qué."
  fr: "Coché, ce Mac écoute et %{host} se jumelle en retour avec sa propre clé si le lien a été créé dans les deux sens. S’il ne peut joindre ce Mac, le jumelage reste unidirectionnel et indique pourquoi."
  ja: "オンにすると、相手のリンクが双方向ペアリングで作成されていれば、この Mac が待受を開始し %{host} が自身の鍵で逆ペアリングします。到達できない場合は片方向のまま理由を表示します。"
  ko: "선택하면 상대 링크가 양방향 페어링으로 생성된 경우 이 Mac이 수신을 시작하고 %{host}가 자체 키로 역방향 페어링합니다. 연결할 수 없으면 단방향으로 유지되며 이유를 알립니다."
  pt-BR: "Marcado, este Mac passa a escutar e %{host} pareia de volta com sua própria chave, se o link tiver sido criado nos dois sentidos. Se não alcançar este Mac, o pareamento fica unilateral e explica o motivo."
  ru: "Если отмечено, этот Mac начинает слушать и %{host} привязывается в ответ своим ключом, если ссылка создана двусторонней. Если этот Mac недоступен, связь останется односторонней с указанием причины."
  sv: "Om markerad börjar den här Mac-datorn lyssna och %{host} parkopplar tillbaka med egen nyckel om länken skapades för båda hållen. Om den inte når den här Mac-datorn förblir parkopplingen enkelriktad."
