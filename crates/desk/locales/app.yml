  fr: "La mise à jour est en place : u0 l’exécute à sa prochaine ouverture."
  ja: "アップデートの準備ができました：u0 を開き直すと新しいバージョンが動きます。"
  ko: "업데이트가 준비되었습니다. u0를 다시 열면 적용됩니다."
  pt-BR: "A atualização está pronta: o u0 a executa quando for aberto novamente."
  ru: "Обновление установлено: u0 запустит его при следующем открытии."
  sv: "Uppdateringen är på plats: u0 kör den när den öppnas igen."
"The way the link names. One on a network pins this Mac's certificate in the link, so the device trusts this Mac alone.":
  zh-CN: "链接所指定的方式。网络上的方式会把这台 Mac 的证书固定在链接中，使设备只信任这台 Mac。"
  de: "Der Weg, den der Link nennt. Einer in einem Netzwerk heftet das Zertifikat dieses Macs in den Link, sodass das Gerät nur diesem Mac vertraut."
  es: "La vía que nombra el enlace. Una en una red fija el certificado de este Mac en el enlace, para que el dispositivo confíe solo en este Mac."
  fr: "Le chemin que nomme le lien. Sur un réseau, il épingle le certificat de ce Mac dans le lien, pour que l’appareil ne fasse confiance qu’à ce Mac."
  ja: "リンクが指す経路です。ネットワーク上の経路では、この Mac の証明書がリンクに固定され、デバイスはこの Mac だけを信頼します。"
  ko: "링크가 가리키는 경로입니다. 네트워크 경로는 이 Mac의 인증서를 링크에 고정하므로 기기는 이 Mac만 신뢰합니다."
  pt-BR: "O caminho que o link indica. Um em uma rede fixa o certificado deste Mac no link, para que o dispositivo confie apenas neste Mac."
  ru: "Путь, указанный в ссылке. Путь через сеть закрепляет в ссылке сертификат этого Mac, чтобы устройство доверяло только ему."
  sv: "Vägen som länken anger. En i ett nätverk fäster den här Macens certifikat i länken, så att enheten bara litar på den här Macen."
"The ways to snooze offered first, each as you would type it in Custom…: 1h, 5pm, tomorrow, next week. Commas between.":
  zh-CN: "优先提供的稍后提醒选项，按你在「自定义…」中输入的方式书写：1h、5pm、tomorrow、next week，用逗号分隔。"
  de: "Die zuerst angebotenen Zurückstell-Optionen, jeweils so, wie Sie sie unter „Eigene …“ eingeben würden: 1h, 17 Uhr, morgen, nächste Woche. Durch Kommas getrennt."
  es: "Las formas de posponer que se ofrecen primero, cada una como la escribirías en Personalizado…: 1h, 17:00, mañana, la semana que viene. Separadas por comas."
  fr: "Les durées de report proposées en premier, chacune comme vous la saisiriez dans Personnalisé… : 1h, 17h, demain, semaine prochaine. Séparées par des virgules."
  ja: "最初に表示するスヌーズの選択肢。「カスタム…」で入力する形式で書きます：1h、5pm、tomorrow、next week。カンマ区切り。"
  ko: "먼저 제공되는 다시 알림 옵션. 사용자 지정…에서 입력하는 형식으로 씁니다: 1h, 5pm, tomorrow, next week. 쉼표로 구분."
  pt-BR: "As formas de adiar oferecidas primeiro, cada uma como você a digitaria em Personalizado…: 1h, 17h, amanhã, próxima semana. Separadas por vírgulas."
  ru: "Способы отложить, предлагаемые первыми, — каждый так, как вы бы ввели его в «Другой…»: 1h, 5pm, tomorrow, next week. Через запятую."
  sv: "Sätten att snooza som erbjuds först, vart och ett som du skulle skriva det i Anpassad…: 1h, 17, imorgon, nästa vecka. Kommatecken emellan."
