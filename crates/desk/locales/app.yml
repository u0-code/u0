  zh-CN: "更高会加深次要内容的灰色和边框。"
  de: "„Mehr“ zeichnet die Grautöne des weniger Wichtigen und die Kanten kräftiger."
  es: "Más dibuja con más fuerza los grises de lo que importa menos y los bordes."
  fr: "Plus renforce les gris de ce qui compte moins, et les bordures."
  ja: "「高い」では、重要度の低い部分のグレーと境界線を濃く描画します。"
  ko: "더 높이면 덜 중요한 항목의 회색과 테두리를 더 진하게 그립니다."
  pt-BR: "Mais desenha com mais força os cinzas do que importa menos e as bordas."
  ru: "«Больше» делает серые оттенки второстепенного и границы контрастнее."
  sv: "Mer ritar de gråtoner för det som betyder mindre, och kanterna, starkare."
