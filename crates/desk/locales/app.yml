  fr: "u0 s’est fermé pendant ce tour ; l’agent a pu le poursuivre."
  ja: "このターンの途中で u0 が終了しました。エージェントは続けていた可能性があります。"
  ko: "이 턴이 진행 중일 때 u0가 종료되었습니다. 에이전트가 계속 진행했을 수 있습니다."
