"How far a new worktree's submodules are checked out. Where there are many, the top level alone, or none for a setup script to do.":
  zh-CN: "新工作树的子模块检出深度。子模块很多时可只检出顶层，或不检出，交给设置脚本处理。"
  de: "Wie weit die Submodule eines neuen Worktrees ausgecheckt werden. Bei vielen nur die oberste Ebene, oder keine, damit ein Setup-Skript es erledigt."
  es: "Hasta dónde se hace checkout de los submódulos de un worktree nuevo. Donde hay muchos, solo el nivel superior, o ninguno para que lo haga un script de configuración."
  fr: "Jusqu’où les sous-modules d’un nouveau worktree sont extraits. S’il y en a beaucoup, le niveau supérieur seul, ou aucun pour qu’un script de configuration s’en charge."
  ja: "新しいワークツリーでサブモジュールをどこまでチェックアウトするか。多い場合は最上位のみ、またはセットアップスクリプトに任せてなしにできます。"
  ko: "새 워크트리의 하위 모듈을 체크아웃하는 범위. 하위 모듈이 많으면 최상위만, 또는 설정 스크립트에 맡기려면 없음."
  pt-BR: "Até onde é feito o checkout dos submódulos de um novo worktree. Onde houver muitos, só o nível superior, ou nenhum para um script de configuração fazer."
  ru: "Насколько глубоко переключаются подмодули нового рабочего дерева. Если их много — только верхний уровень или ни одного, чтобы это сделал скрипт настройки."
