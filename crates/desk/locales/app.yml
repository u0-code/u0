  de: "Ein Prompt, der einem Agent nach Zeitplan gesagt wird. Der Server von u0 führt sie aus, daher laufen sie auch bei geschlossenem Fenster; der Thread jedes Laufs steht in der Seitenleiste."
  es: "Un prompt dicho a un agente según un horario. El servidor de u0 las ejecuta, así que se ejecutan con la ventana cerrada; el hilo de cada ejecución está en la barra lateral."
  fr: "Un prompt dit à un agent selon un calendrier. Le serveur de u0 les exécute, ils tournent donc même fenêtre fermée ; le fil de chaque exécution est dans la barre latérale."
  ja: "スケジュールに沿ってエージェントに送るプロンプト。u0 のサーバが実行するため、ウインドウを閉じていても実行されます。各実行のスレッドはサイドバーにあります。"
  ko: "일정에 따라 에이전트에 전달하는 프롬프트입니다. u0의 서버가 실행하므로 윈도우가 닫혀 있어도 실행되며, 각 실행의 스레드는 사이드바에 있습니다."
  pt-BR: "Um prompt dito a um agente em um horário agendado. O servidor do u0 os executa, então eles rodam com a janela fechada; a thread de cada execução fica na barra lateral."
  ru: "Запрос, отправляемый агенту по расписанию. Их выполняет сервер u0, поэтому они работают и при закрытом окне; тред каждого запуска виден на боковой панели."
  sv: "En prompt som sägs till en agent enligt ett schema. u0:s server kör dem, så de körs medan fönstret är stängt; varje körnings tråd finns i sidofältet."
"A quick tunnel: a new address each time it starts, so pair again with a new link.":
  zh-CN: "快速隧道：每次启动都是新地址，因此需用新链接重新配对。"
  de: "Ein Schnelltunnel: bei jedem Start eine neue Adresse, also mit einem neuen Link erneut koppeln."
  es: "Un túnel rápido: una dirección nueva cada vez que se inicia, así que vuelve a emparejar con un enlace nuevo."
  fr: "Un tunnel rapide : une nouvelle adresse à chaque démarrage, il faut donc appairer à nouveau avec un nouveau lien."
  ja: "クイックトンネル：起動するたびにアドレスが変わるため、新しいリンクで再度ペアリングしてください。"
  ko: "빠른 터널: 시작할 때마다 주소가 바뀌므로 새 링크로 다시 페어링하십시오."
