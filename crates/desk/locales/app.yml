"u0 runs %{name}'s own agent and shows its work here. Its account, models and billing stay with %{name}; u0 never sees its sign-in.":
  zh-CN: "u0 运行 %{name} 自己的智能体，并在此显示它的工作。账户、模型和计费仍归 %{name}；u0 从不接触它的登录信息。"
  de: "u0 führt den eigenen Agent von %{name} aus und zeigt seine Arbeit hier. Account, Modelle und Abrechnung bleiben bei %{name}; u0 sieht die Anmeldung nie."
  es: "u0 ejecuta el agente propio de %{name} y muestra su trabajo aquí. Su cuenta, modelos y facturación siguen en %{name}; u0 nunca ve su inicio de sesión."
  fr: "u0 exécute l’agent de %{name} et montre son travail ici. Son compte, ses modèles et sa facturation restent chez %{name} ; u0 ne voit jamais sa connexion."
  ja: "u0 は %{name} 独自のエージェントを実行し、その作業をここに表示します。アカウント、モデル、請求は %{name} のままで、u0 がサインイン情報を見ることはありません。"
  ko: "u0는 %{name}의 자체 에이전트를 실행하고 그 작업을 여기에 표시합니다. 계정, 모델 및 요금은 %{name}에 남으며, u0는 로그인 정보를 볼 수 없습니다."
  pt-BR: "O u0 executa o próprio agente de %{name} e mostra o trabalho dele aqui. A conta, os modelos e a cobrança continuam com %{name}; o u0 nunca vê o login."
  ru: "u0 запускает собственного агента %{name} и показывает его работу здесь. Учётная запись, модели и оплата остаются у %{name}; u0 никогда не видит данные входа."
  sv: "u0 kör %{name}s egen agent och visar dess arbete här. Dess konto, modeller och fakturering stannar hos %{name}; u0 ser aldrig dess inloggning."
