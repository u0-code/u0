"Steer stops the turn and says it now; waiting says it once the turn ends.":
  zh-CN: "引导会停止当前一轮并立即发送；等待则在这一轮结束后发送。"
  de: "„Lenken“ stoppt die Runde und sagt es sofort; „Warten“ sagt es, sobald die Runde endet."
  es: "Redirigir detiene el turno y lo dice ahora; esperar lo dice cuando termina el turno."
  fr: "Orienter arrête le tour et le dit maintenant ; attendre le dit une fois le tour terminé."
  ja: "「割り込む」はターンを止めて今すぐ送信します。「待つ」はターンの終了後に送信します。"
  ko: "방향 전환은 턴을 중지하고 지금 전달하며, 대기는 턴이 끝나면 전달합니다."
  pt-BR: "Direcionar interrompe o turno e diz agora; esperar diz assim que o turno terminar."
  ru: "«Направить» останавливает ход и передаёт сообщение сейчас; ожидание — когда ход закончится."
  sv: "Styr stoppar omgången och säger det nu; vänta säger det när omgången slutar."
"Steer: stop the turn and say it now · ⌘-click or %{keys} to queue it":
  zh-CN: "引导：停止本轮并立即发送 · ⌘ 点击或 %{keys} 以排队"
  de: "Lenken: Runde stoppen und es sofort sagen · ⌘-Klick oder %{keys} zum Einreihen"
  es: "Redirigir: detener el turno y decirlo ahora · ⌘-clic o %{keys} para ponerlo en cola"
  fr: "Orienter : arrêter le tour et le dire maintenant · ⌘-clic ou %{keys} pour le mettre en file"
  ja: "割り込む：ターンを止めて今すぐ送信 · ⌘クリックまたは %{keys} で待機"
  ko: "방향 전환: 턴을 중지하고 지금 전달 · 대기열에 넣으려면 ⌘-클릭 또는 %{keys}"
