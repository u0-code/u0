"Create PR has the writer write the title and description, then commits, pushes and opens it with gh pr create.":
  zh-CN: "创建 PR 会让写作代理撰写标题和说明，随后提交、推送并通过 gh pr create 打开。"
  de: "PR erstellen lässt den Writer Titel und Beschreibung verfassen, committet, pusht und öffnet ihn mit gh pr create."
  es: "Crear PR hace que el redactor escriba el título y la descripción, y luego confirma, sube y lo abre con gh pr create."
  fr: "Créer une PR demande au rédacteur d’écrire le titre et la description, puis valide, pousse et l’ouvre avec gh pr create."
  ja: "PR を作成すると、ライターがタイトルと説明を書き、コミット・プッシュして gh pr create で開きます。"
  ko: "PR 만들기는 작성 에이전트가 제목과 설명을 작성한 뒤 커밋·푸시하고 gh pr create로 엽니다."
  pt-BR: "Criar PR pede ao redator o título e a descrição, faz commit, push e abre com gh pr create."
  ru: "Создание PR поручает автору заголовок и описание, затем делает коммит, отправку и открывает PR через gh pr create."
  sv: "Skapa PR låter skribenten skriva titel och beskrivning, committar, pushar och öppnar den med gh pr create."
