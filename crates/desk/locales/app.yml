"Auto: a press begins and a press ends, or hold it while you talk. Toggle: a press begins, a press ends. Hold: it listens while held. Outside the composer, macOS's dictation types instead.":
  zh-CN: "自动：按一下开始、再按一下结束，或说话时按住。切换：按一下开始、再按一下结束。按住：按住时收听。在输入框之外，由 macOS 听写输入。"
  de: "Auto: Ein Druck beginnt und ein Druck beendet, oder halten Sie die Taste beim Sprechen. Umschalten: Ein Druck beginnt, ein Druck beendet. Halten: Hört zu, solange gehalten. Außerhalb des Eingabefelds tippt stattdessen das Diktat von macOS."
  es: "Auto: una pulsación empieza y otra termina, o mantenla pulsada mientras hablas. Alternar: una pulsación empieza, otra termina. Mantener: escucha mientras está pulsada. Fuera del compositor, escribe el dictado de macOS."
  fr: "Auto : un appui commence et un appui termine, ou maintenez pendant que vous parlez. Bascule : un appui commence, un appui termine. Maintien : écoute tant que la touche est maintenue. Hors de la zone de saisie, c’est la dictée de macOS qui saisit."
  ja: "自動：押して開始・押して終了、または話している間押し続けます。切り替え：押して開始、押して終了。押し続ける：押している間だけ聞き取ります。入力欄の外では macOS の音声入力が入力します。"
  ko: "자동: 한 번 눌러 시작하고 다시 눌러 끝내거나, 말하는 동안 누르고 있습니다. 토글: 한 번 눌러 시작, 다시 눌러 끝냅니다. 길게 누르기: 누르고 있는 동안 듣습니다. 작성기 밖에서는 macOS의 받아쓰기가 대신 입력합니다."
  pt-BR: "Auto: um toque inicia e outro termina, ou mantenha pressionado enquanto fala. Alternar: um toque inicia, outro termina. Manter: escuta enquanto pressionado. Fora da caixa de mensagem, o ditado do macOS digita no lugar."
  ru: "Авто: нажатие начинает и нажатие завершает, или удерживайте во время речи. Переключение: нажатие начинает, нажатие завершает. Удержание: слушает, пока клавиша нажата. Вне поля ввода текст вводит диктовка macOS."
  sv: "Auto: ett tryck börjar och ett tryck slutar, eller håll ned den medan du talar. Växla: ett tryck börjar, ett tryck slutar. Håll: den lyssnar medan den hålls ned. Utanför skrivfältet skriver macOS diktering i stället."
