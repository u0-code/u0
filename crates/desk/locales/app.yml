"The theme drawn now, copied into a file of yours and opened in your editor; read the themes again to see what you changed.":
  zh-CN: "当前使用的主题会复制到你的文件中并在编辑器中打开；重新读取主题即可看到你的修改。"
  de: "Das aktuelle Theme, in eine Datei von Ihnen kopiert und im Editor geöffnet; lesen Sie die Themes neu ein, um Ihre Änderungen zu sehen."
  es: "El tema que se dibuja ahora, copiado en un archivo tuyo y abierto en tu editor; vuelve a leer los temas para ver lo que cambiaste."
  fr: "Le thème affiché actuellement, copié dans un fichier à vous et ouvert dans votre éditeur ; relisez les thèmes pour voir ce que vous avez changé."
  ja: "現在のテーマをあなたのファイルにコピーしてエディタで開きます。変更を確認するにはテーマを再読み込みしてください。"
  ko: "현재 그려진 테마를 사용자 파일로 복사하여 편집기에서 엽니다. 변경 내용을 보려면 테마를 다시 읽으십시오."
