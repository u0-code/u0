"From macOS while Ghost is behind, clicked to go to the session; in Ghost while another is on screen.":
  zh-CN: "Ghost 在后台时由 macOS 通知，点击可前往该会话；Ghost 在前台显示其他会话时在 Ghost 内通知。"
  de: "Von macOS, während Ghost im Hintergrund ist, per Klick zur Sitzung; in Ghost, während eine andere angezeigt wird."
  es: "Desde macOS mientras Ghost está detrás, con clic para ir a la sesión; en Ghost mientras hay otra en pantalla."
  fr: "Depuis macOS quand Ghost est en arrière-plan, un clic mène à la session ; dans Ghost quand une autre est à l’écran."
  ja: "Ghost が背面にあるときは macOS から通知し、クリックでそのセッションに移動します。別のセッションを表示中は Ghost 内で通知します。"
  ko: "Ghost가 뒤에 있을 때는 macOS에서 알리며 클릭하면 세션으로 이동합니다. 다른 세션이 화면에 있을 때는 Ghost에서 알립니다."
  pt-BR: "Do macOS enquanto o Ghost está em segundo plano, clicado para ir à sessão; no Ghost enquanto outra está na tela."
  ru: "Из macOS, когда Ghost на заднем плане, — нажмите, чтобы перейти к сеансу; в Ghost — когда на экране другой сеанс."
  sv: "Från macOS medan Ghost är i bakgrunden, klicka för att gå till sessionen; i Ghost medan en annan visas."
"From the next batch on, this install is sent under a new random id, unlinked from the old.":
  zh-CN: "从下一批开始，此安装将以新的随机 ID 发送，与旧 ID 不再关联。"
  de: "Ab dem nächsten Paket wird diese Installation unter einer neuen zufälligen ID gesendet, ohne Verbindung zur alten."
  es: "A partir del próximo lote, esta instalación se envía con un id aleatorio nuevo, sin vínculo con el anterior."
  fr: "À partir du prochain lot, cette installation est envoyée sous un nouvel identifiant aléatoire, sans lien avec l’ancien."
  ja: "次のバッチから、このインストールは新しいランダムな ID で送信され、古い ID とは関連付けられません。"
  ko: "다음 묶음부터 이 설치는 이전 ID와 연결되지 않은 새 임의 ID로 전송됩니다."
  pt-BR: "A partir do próximo lote, esta instalação é enviada com um novo id aleatório, desvinculado do antigo."
  ru: "Начиная со следующего пакета, эта установка отправляет данные под новым случайным идентификатором, не связанным со старым."
  sv: "Från och med nästa omgång skickas den här installationen under ett nytt slumpmässigt id, utan koppling till det gamla."
