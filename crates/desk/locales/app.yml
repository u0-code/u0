"Without AXe a simulator is touched in Simulator.app, and the Xcode in use has none. Its screen shows here as pictures, one at a time.":
  zh-CN: "没有 AXe 时，模拟器要在 Simulator.app 中触控，而当前使用的 Xcode 没有它。它的屏幕在这里以图片显示，一次一张。"
  de: "Ohne AXe wird ein Simulator in Simulator.app berührt, und das verwendete Xcode hat keine. Sein Bildschirm erscheint hier als Bilder, eines nach dem anderen."
  es: "Sin AXe, un simulador se toca en Simulator.app, y el Xcode en uso no lo tiene. Su pantalla se muestra aquí como imágenes, una a una."
  fr: "Sans AXe, un simulateur se touche dans Simulator.app, et le Xcode utilisé n’en a pas. Son écran s’affiche ici en images, une à la fois."
  ja: "AXe がないとシミュレータは Simulator.app で操作しますが、使用中の Xcode にはありません。画面はここに画像として 1 枚ずつ表示されます。"
  ko: "AXe가 없으면 시뮬레이터는 Simulator.app에서 조작하는데, 사용 중인 Xcode에는 없습니다. 화면은 여기에 한 장씩 그림으로 표시됩니다."
  pt-BR: "Sem o AXe, um simulador é tocado no Simulator.app, e o Xcode em uso não o tem. A tela aparece aqui como imagens, uma por vez."
  ru: "Без AXe симулятор управляется в Simulator.app, а в используемом Xcode его нет. Его экран показывается здесь картинками, по одной."
  sv: "Utan AXe styrs en simulator i Simulator.app, och den Xcode som används har ingen. Dess skärm visas här som bilder, en i taget."
"Your press is the asking: it runs AXe’s own way to install it, with Homebrew, and nothing before.":
  zh-CN: "你按下即是同意：它用 AXe 自己的安装方式（Homebrew）安装，在此之前什么都不做。"
  de: "Dein Klick ist die Zustimmung: Er führt AXes eigene Installation mit Homebrew aus, und vorher nichts."
  es: "Tu pulsación es la petición: ejecuta la forma propia de AXe de instalarse, con Homebrew, y nada antes."
  fr: "Votre clic vaut demande : il lance l’installation propre à AXe, avec Homebrew, et rien avant."
  ja: "押すことが同意です。AXe 自身の方法（Homebrew）でインストールし、それまでは何もしません。"
  ko: "누르는 것이 요청입니다. AXe 자체의 설치 방법(Homebrew)으로 설치하며, 그 전에는 아무것도 하지 않습니다."
  pt-BR: "Seu clique é o pedido: ele executa a forma própria do AXe de se instalar, com o Homebrew, e nada antes."
  ru: "Ваше нажатие и есть согласие: запускается собственная установка AXe через Homebrew, и ничего до этого."
  sv: "Ditt tryck är frågan: det kör AXes eget sätt att installera, med Homebrew, och inget före det."
