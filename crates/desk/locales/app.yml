"No agent said what a thread cost or took in this time. Not every agent says; u0 does not guess.":
  zh-CN: "在此期间没有智能体告知线程的费用或用量。并非所有智能体都会告知；u0 不做猜测。"
  de: "Kein Agent hat in diesem Zeitraum genannt, was ein Thread gekostet oder verbraucht hat. Nicht jeder Agent tut das; u0 rät nicht."
  es: "Ningún agente indicó lo que costó o duró un hilo en este periodo. No todos los agentes lo indican; u0 no lo adivina."
  fr: "Aucun agent n’a indiqué le coût ou la durée d’un fil sur cette période. Tous les agents ne le disent pas ; u0 ne devine pas."
  ja: "この期間にスレッドのコストや使用量を伝えたエージェントはありません。すべてのエージェントが伝えるわけではなく、u0 は推測しません。"
  ko: "이 기간 동안 스레드 비용이나 소요 시간을 알려 준 에이전트가 없습니다. 모든 에이전트가 알려 주지는 않으며, u0는 추정하지 않습니다."
  pt-BR: "Nenhum agente informou quanto uma thread custou ou consumiu neste período. Nem todo agente informa; o u0 não adivinha."
  ru: "Ни один агент не сообщил стоимость или длительность треда за этот период. Не все агенты сообщают это; u0 не угадывает."
  sv: "Ingen agent angav vad en tråd kostade eller tog under den här tiden. Inte alla agenter anger det; u0 gissar inte."
