"Stable is each release, as the u0 cask installs it; Nightly is what main is now, rebuilt with each change, as u0@nightly installs it.":
  zh-CN: "稳定版是每个正式版本，由 u0 cask 安装；每夜版是 main 的当前状态，每次改动都会重新构建，由 u0@nightly 安装。"
  de: "„Stabil“ ist jede Version, wie der Cask u0 sie installiert; „Nightly“ ist der aktuelle Stand von main, bei jeder Änderung neu gebaut, wie u0@nightly ihn installiert."
  es: "Estable es cada versión, tal como la instala el cask u0; Nightly es lo que main es ahora, recompilado con cada cambio, tal como lo instala u0@nightly."
  fr: "Stable correspond à chaque version publiée, telle que le cask u0 l’installe ; Nightly est l’état actuel de main, reconstruit à chaque modification, tel que u0@nightly l’installe."
  ja: "安定版は各リリースで、u0 cask がインストールします。ナイトリーは現在の main を変更のたびにビルドしたもので、u0@nightly がインストールします。"
  ko: "안정은 u0 cask가 설치하는 각 릴리스이며, 나이틀리는 변경될 때마다 다시 빌드되는 현재 main으로 u0@nightly가 설치합니다."
  pt-BR: "Estável é cada versão lançada, como o cask u0 a instala; Nightly é o que o main é agora, recompilado a cada alteração, como o u0@nightly o instala."
  ru: "«Стабильный» — каждый релиз, как его устанавливает cask u0; «Ночная сборка» — текущий main, пересобираемый с каждым изменением, как его устанавливает u0@nightly."
  sv: "Stabil är varje release, så som u0-casken installerar den; Nattlig är det main är nu, byggt på nytt vid varje ändring, så som u0@nightly installerar den."
