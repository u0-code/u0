"%{host} is asked without a token, which reaches only what is public; %{project} is private. A token you give is kept in the macOS Keychain, never in a file, and may be a 1Password reference (op://).":
  zh-CN: "当前在没有令牌的情况下访问 %{host}，只能获取公开内容，而 %{project} 是私有的。你提供的令牌保存在 macOS 钥匙串中，绝不写入文件，也可以使用 1Password 引用（op://）。"
  de: "%{host} wird ohne Token abgefragt, wodurch nur Öffentliches erreichbar ist; %{project} ist privat. Ein angegebenes Token wird im macOS-Schlüsselbund gespeichert, nie in einer Datei, und kann eine 1Password-Referenz (op://) sein."
  es: "Se consulta %{host} sin un token, lo que solo alcanza contenido público; %{project} es privado. El token que des se guarda en el Llavero de macOS, nunca en un archivo, y puede ser una referencia de 1Password (op://)."
  fr: "%{host} est interrogé sans jeton, ce qui n’atteint que ce qui est public ; %{project} est privé. Le jeton fourni est gardé dans le Trousseau macOS, jamais dans un fichier, et peut être une référence 1Password (op://)."
  ja: "%{host} にはトークンなしで問い合わせているため公開情報にしか届きませんが、%{project} は非公開です。指定したトークンはファイルではなく macOS キーチェーンに保存され、1Password 参照 (op://) も使えます。"
  ko: "토큰 없이 %{host}에 요청하면 공개 항목만 볼 수 있으며 %{project}는 비공개입니다. 입력한 토큰은 파일이 아닌 macOS 키체인에 보관되며 1Password 참조(op://)도 사용할 수 있습니다."
  pt-BR: "%{host} é consultado sem token, o que alcança apenas o que é público; %{project} é privado. O token informado fica nas Chaves do macOS, nunca em um arquivo, e pode ser uma referência do 1Password (op://)."
  ru: "Запрос к %{host} выполняется без токена и видит только публичное, а %{project} закрыт. Указанный токен хранится в Связке ключей macOS, а не в файле, и может быть ссылкой 1Password (op://)."
  sv: "%{host} tillfrågas utan token, vilket bara når det offentliga; %{project} är privat. En token du anger sparas i macOS-nyckelringen, aldrig i en fil, och kan vara en 1Password-referens (op://)."
