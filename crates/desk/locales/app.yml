"Path: %{path}\nu0 forgets these threads and their records. Each agent keeps its own threads.\nFiles on disk are not touched.\nThis cannot be undone.":
  zh-CN: "路径：%{path}\nu0 将忘记这些线程及其记录。各智能体仍保留自己的线程。\n磁盘上的文件不受影响。\n此操作无法撤销。"
  de: "Pfad: %{path}\nu0 vergisst diese Threads und ihre Aufzeichnungen. Jeder Agent behält seine eigenen Threads.\nDateien auf dem Datenträger bleiben unberührt.\nDies kann nicht widerrufen werden."
  es: "Ruta: %{path}\nu0 olvida estos hilos y sus registros. Cada agente conserva sus propios hilos.\nLos archivos en disco no se tocan.\nNo se puede deshacer."
  fr: "Chemin : %{path}\nu0 oublie ces fils et leurs enregistrements. Chaque agent conserve ses propres fils.\nLes fichiers sur le disque ne sont pas touchés.\nCette action est irréversible."
  ja: "パス：%{path}\nu0 はこれらのスレッドとその記録を忘れます。各エージェントは自分のスレッドを保持します。\nディスク上のファイルには触れません。\nこの操作は取り消せません。"
  ko: "경로: %{path}\nu0는 이 스레드와 기록을 지웁니다. 각 에이전트는 자체 스레드를 보관합니다.\n디스크의 파일은 건드리지 않습니다.\n이 작업은 실행 취소할 수 없습니다."
  pt-BR: "Caminho: %{path}\nO u0 esquece estas threads e os registros delas. Cada agente mantém as próprias threads.\nOs arquivos no disco não são tocados.\nIsso não pode ser desfeito."
  ru: "Путь: %{path}\nu0 забудет эти треды и их записи. Каждый агент хранит свои треды сам.\nФайлы на диске не затрагиваются.\nЭто действие нельзя отменить."
  sv: "Sökväg: %{path}\nu0 glömmer de här trådarna och deras register. Varje agent behåller sina egna trådar.\nFiler på disken rörs inte.\nDetta kan inte ångras."
