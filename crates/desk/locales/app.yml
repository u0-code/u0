"Only a call whose body is signed by this secret runs it: HMAC-SHA256, hex, in X-Hub-Signature-256 (sha256=…, as GitHub signs) or X-Signature-256. The secret is kept in the Keychain of the Mac it runs on.":
  zh-CN: "只有正文由此密钥签名的调用才会运行它：HMAC-SHA256，十六进制，位于 X-Hub-Signature-256（sha256=…，与 GitHub 的签名方式相同）或 X-Signature-256 中。密钥保存在运行它的 Mac 的钥匙串中。"
  de: "Nur ein Aufruf, dessen Inhalt mit diesem Geheimnis signiert ist, führt sie aus: HMAC-SHA256, hex, in X-Hub-Signature-256 (sha256=…, wie GitHub signiert) oder X-Signature-256. Das Geheimnis liegt im Schlüsselbund des Macs, auf dem sie läuft."
  es: "Solo la ejecuta una llamada cuyo cuerpo esté firmado con este secreto: HMAC-SHA256, hex, en X-Hub-Signature-256 (sha256=…, como firma GitHub) o X-Signature-256. El secreto se guarda en el Llavero del Mac donde se ejecuta."
  fr: "Seul un appel dont le corps est signé par ce secret la lance : HMAC-SHA256, hex, dans X-Hub-Signature-256 (sha256=…, comme signe GitHub) ou X-Signature-256. Le secret est gardé dans le trousseau du Mac où elle s’exécute."
  ja: "本文がこのシークレットで署名された呼び出しだけが実行します：HMAC-SHA256、16 進数、X-Hub-Signature-256（sha256=…、GitHub の署名と同じ）または X-Signature-256。シークレットは実行する Mac のキーチェーンに保管されます。"
  ko: "본문이 이 비밀로 서명된 호출만 실행합니다: HMAC-SHA256, 16진수, X-Hub-Signature-256(sha256=…, GitHub 서명 방식) 또는 X-Signature-256. 비밀은 실행되는 Mac의 키체인에 보관됩니다."
  pt-BR: "Só uma chamada cujo corpo esteja assinado por este segredo a executa: HMAC-SHA256, hex, em X-Hub-Signature-256 (sha256=…, como o GitHub assina) ou X-Signature-256. O segredo fica nas Chaves do Mac em que ela roda."
  ru: "Её запускает только вызов, тело которого подписано этим секретом: HMAC-SHA256, hex, в X-Hub-Signature-256 (sha256=…, как подписывает GitHub) или X-Signature-256. Секрет хранится в связке ключей Mac, на котором она работает."
  sv: "Bara ett anrop vars innehåll är signerat med den här hemligheten kör den: HMAC-SHA256, hex, i X-Hub-Signature-256 (sha256=…, som GitHub signerar) eller X-Signature-256. Hemligheten förvaras i nyckelringen på Macen den körs på."
"Only when (none: every call): body.<field> or header.<name> = one of these, each such rule after a ; . A delivery sent again (X-GitHub-Delivery) runs it once.":
  zh-CN: "仅当（留空：每次调用）：body.<field> 或 header.<name> = 其中之一，每条规则用 ; 分隔。重复发送的投递（X-GitHub-Delivery）只运行一次。"
  de: "Nur wenn (leer: bei jedem Aufruf): body.<field> oder header.<name> = einer dieser Werte, jede solche Regel nach einem ; . Eine erneut gesendete Zustellung (X-GitHub-Delivery) führt sie einmal aus."
  es: "Solo cuando (vacío: cada llamada): body.<field> o header.<name> = uno de estos, cada regla tras un ; . Una entrega enviada de nuevo (X-GitHub-Delivery) la ejecuta una vez."
  fr: "Seulement quand (vide : chaque appel) : body.<field> ou header.<name> = l’une de ces valeurs, chaque règle après un ; . Une livraison renvoyée (X-GitHub-Delivery) la lance une fois."
  ja: "条件（空欄：すべての呼び出し）：body.<field> または header.<name> = これらのいずれか、各ルールは ; の後に。再送された配信（X-GitHub-Delivery）は 1 回だけ実行します。"
  ko: "조건(비우면 모든 호출): body.<field> 또는 header.<name> = 이 중 하나, 각 규칙은 ; 뒤에. 다시 보낸 전달(X-GitHub-Delivery)은 한 번만 실행합니다."
  pt-BR: "Só quando (vazio: toda chamada): body.<field> ou header.<name> = um destes, cada regra após um ; . Uma entrega enviada de novo (X-GitHub-Delivery) a executa uma vez."
  ru: "Только когда (пусто: при каждом вызове): body.<field> или header.<name> = одно из этих значений, каждое правило после ; . Повторно отправленная доставка (X-GitHub-Delivery) запускает её один раз."
  sv: "Bara när (tomt: varje anrop): body.<field> eller header.<name> = ett av dessa, varje sådan regel efter ett ; . En leverans som skickas igen (X-GitHub-Delivery) kör den en gång."
