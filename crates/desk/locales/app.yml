"An agent that stops working is updated from the ACP registry.":
  zh-CN: "无法工作的智能体会从 ACP 注册表更新。"
  de: "Ein Agent, der nicht mehr funktioniert, wird aus der ACP-Registry aktualisiert."
  es: "Un agente que deja de funcionar se actualiza desde el registro ACP."
  fr: "Un agent qui cesse de fonctionner est mis à jour depuis le registre ACP."
  ja: "動かなくなったエージェントは ACP レジストリから更新されます。"
  ko: "작동하지 않는 에이전트는 ACP 레지스트리에서 업데이트됩니다."
  pt-BR: "Um agente que para de funcionar é atualizado pelo registro ACP."
  ru: "Переставший работать агент обновляется из реестра ACP."
  sv: "En agent som slutar fungera uppdateras från ACP-registret."
"The ACP registry, read again each hour.":
  zh-CN: "ACP 注册表，每小时重新读取。"
  de: "Die ACP-Registry, stündlich neu gelesen."
  es: "El registro de ACP, que se vuelve a leer cada hora."
  fr: "Le registre ACP, relu toutes les heures."
  ja: "ACP レジストリ。1 時間ごとに再読み込みされます。"
  ko: "매시간 다시 읽는 ACP 레지스트리."
  pt-BR: "O registro ACP, lido novamente a cada hora."
  ru: "Реестр ACP, перечитывается каждый час."
  sv: "ACP-registret, läst igen varje timme."
"Paired Macs show in this window; pair one with its link.":
  zh-CN: "已配对的 Mac 显示在此窗口中；用对方的链接配对。"
  de: "Gekoppelte Macs erscheinen hier; koppeln über ihren Link."
  es: "Los Mac emparejados aparecen aquí; empareja uno con su enlace."
  fr: "Les Mac appairés s’affichent ici ; appairez-en un avec son lien."
  ja: "ペアリング済みの Mac はこのウインドウに表示されます。リンクでペアリングします。"
  ko: "페어링된 Mac은 이 창에 표시됩니다. 링크로 페어링하세요."
  pt-BR: "Macs pareados aparecem nesta janela; pareie um pelo link dele."
  ru: "Связанные Mac видны в этом окне; свяжите Mac по его ссылке."
  sv: "Parkopplade Macar visas här; parkoppla en med dess länk."
