"So branches and pull requests are up to date; projects set to pull are moved on too.":
  zh-CN: "使分支和拉取请求保持最新；设为拉取的项目也会前移。"
  de: "Damit Branches und Pull Requests aktuell sind; Projekte, die pullen sollen, rücken ebenfalls vor."
  es: "Para que las ramas y los pull requests estén al día; los proyectos configurados para hacer pull también avanzan."
  fr: "Pour que les branches et les pull requests soient à jour ; les projets réglés pour tirer avancent aussi."
  ja: "ブランチとプルリクエストを最新に保ちます。プルに設定したプロジェクトも進めます。"
  ko: "브랜치와 풀 리퀘스트를 최신 상태로 유지합니다. 풀하도록 설정된 프로젝트도 앞으로 이동합니다."
  pt-BR: "Para que branches e pull requests fiquem atualizados; os projetos configurados para pull também avançam."
  ru: "Чтобы ветки и пул-реквесты были актуальны; проекты, настроенные на вытягивание, тоже продвигаются."
  sv: "Så att grenar och pull requests är aktuella; projekt som är inställda på att pulla flyttas också fram."
"So that it can be reached with its lid open and no one at it.":
  zh-CN: "这样在无人值守、开盖状态下也能访问它。"
  de: "Damit er bei geöffnetem Deckel und ohne jemanden davor erreichbar ist."
  es: "Para que se pueda acceder a él con la tapa abierta y sin nadie delante."
  fr: "Pour qu’il reste joignable capot ouvert et sans personne devant."
  ja: "蓋を開けたまま誰もいなくても接続できるように。"
  ko: "덮개가 열려 있고 아무도 사용하지 않을 때도 연결할 수 있도록 합니다."
  pt-BR: "Para que possa ser alcançado com a tampa aberta e ninguém por perto."
  ru: "Чтобы до него можно было достучаться с открытой крышкой и без человека рядом."
  sv: "Så att den kan nås med locket öppet och ingen vid den."
