"It has no remote: a commit stays here, and a pull request waits for one.":
  zh-CN: "它没有远程：提交只留在本地，拉取请求要等有了远程再说。"
  de: "Es hat kein Remote: Ein Commit bleibt hier, und ein Pull Request wartet auf eines."
  es: "No tiene remoto: un commit se queda aquí, y una pull request espera a que haya uno."
  fr: "Il n’a pas de dépôt distant : un commit reste ici, et une pull request attend qu’il y en ait un."
  ja: "リモートがありません。コミットはここに残り、プルリクエストはリモートができるまで待ちます。"
  ko: "원격이 없습니다. 커밋은 여기에 남고, 풀 리퀘스트는 원격이 생길 때까지 기다립니다."
