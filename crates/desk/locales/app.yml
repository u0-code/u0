  es: "Se define en el entorno del agente al iniciarse. Uno secreto se guarda en el Keychain de macOS, nunca en los archivos de u0; un valor puede ser una referencia de 1Password, que op lee al iniciarse."
  fr: "Défini dans l’environnement de l’agent à son démarrage. Une variable secrète est conservée dans le Keychain de macOS, jamais dans les fichiers de u0 ; une valeur peut être une référence 1Password, lue par op au démarrage."
  ja: "エージェントの起動時にその環境に設定されます。シークレットは macOS の Keychain に保存され、u0 のファイルには書き込まれません。値には 1Password の参照も指定でき、起動時に op が読み取ります。"
  ko: "에이전트가 시작될 때 환경에 설정됩니다. 비밀 값은 u0의 파일이 아닌 macOS Keychain에 보관됩니다. 값은 시작 시 op가 읽는 1Password 참조일 수 있습니다."
  pt-BR: "Definido no ambiente do agente ao iniciar. Um secreto é guardado no Keychain do macOS, nunca nos arquivos do u0; um valor pode ser uma referência do 1Password, lida pelo op ao iniciar."
  ru: "Задаётся в окружении агента при запуске. Секретное значение хранится в macOS Keychain, а не в файлах u0; значение может быть ссылкой 1Password, которую op читает при запуске."
  sv: "Anges i agentens miljö när den startar. En hemlig sparas i macOS Keychain, aldrig i u0:s filer; ett värde kan vara en 1Password-referens, som läses av op när den startar."
