"In a command, each {{name}} is given it as one word, never read as code. It may stand only as an argument of a command named plainly (echo, printf, cd or a program, no other builtin), bare, in quotes or within $( ); a command that puts one anywhere else (arithmetic, [[ ]], an assignment, a redirection, a function) is refused. One given to a command as what it works on goes after -- (git fetch origin -- {{ref}}), so that a value beginning with - is not taken for an option; and a command that runs its words as code (sh -c, ssh, xargs) runs a value as code.":
  zh-CN: "在命令中，每个 {{name}} 都作为一个单词传给它，绝不会被当作代码读取。它只能作为一个名字写得明白的命令（echo、printf、cd 或某个程序，不能是其他内建命令）的参数出现，可以不加引号、加引号或在 $( ) 之内；把它放在其他任何地方（算术、[[ ]]、赋值、重定向、函数）的命令会被拒绝。作为命令处理对象传入的值应放在 -- 之后（git fetch origin -- {{ref}}），这样以 - 开头的值不会被当作选项；而把其参数当作代码运行的命令（sh -c、ssh、xargs）会把值当作代码运行。"
  de: "In einem Befehl wird jedes {{name}} als ein Wort übergeben, nie als Code gelesen. Es darf nur als Argument eines schlicht benannten Befehls stehen (echo, printf, cd oder ein Programm, kein anderes Builtin), ohne Anführungszeichen, in Anführungszeichen oder innerhalb von $( ); ein Befehl, der eines anderswo setzt (Arithmetik, [[ ]], eine Zuweisung, eine Umleitung, eine Funktion), wird abgelehnt. Eines, das einem Befehl als das übergeben wird, woran er arbeitet, steht nach -- (git fetch origin -- {{ref}}), damit ein Wert, der mit - beginnt, nicht als Option gilt; und ein Befehl, der seine Wörter als Code ausführt (sh -c, ssh, xargs), führt einen Wert als Code aus."
  es: "En un comando, cada {{name}} se le pasa como una palabra, nunca se lee como código. Solo puede ir como argumento de un comando con un nombre escrito tal cual (echo, printf, cd o un programa, ningún otro builtin), sin comillas, entre comillas o dentro de $( ); se rechaza un comando que ponga uno en cualquier otro sitio (aritmética, [[ ]], una asignación, una redirección, una función). Uno que se pasa a un comando como aquello sobre lo que trabaja va tras -- (git fetch origin -- {{ref}}), para que un valor que empieza por - no se tome por una opción; y un comando que ejecuta sus palabras como código (sh -c, ssh, xargs) ejecuta un valor como código."
  fr: "Dans une commande, chaque {{name}} lui est passé comme un seul mot, jamais lu comme du code. Il ne peut figurer que comme argument d’une commande nommée simplement (echo, printf, cd ou un programme, aucune autre commande interne), nu, entre guillemets ou dans $( ) ; une commande qui en place un ailleurs (arithmétique, [[ ]], une affectation, une redirection, une fonction) est refusée. Celui passé à une commande comme ce sur quoi elle travaille se place après -- (git fetch origin -- {{ref}}), pour qu’une valeur commençant par - ne soit pas prise pour une option ; et une commande qui exécute ses mots comme du code (sh -c, ssh, xargs) exécute une valeur comme du code."
  ja: "コマンドでは、各 {{name}} は 1 つの語として渡され、コードとして読まれることはありません。置けるのは、名前をそのまま書いたコマンド（echo、printf、cd またはプログラム。その他の組み込みコマンドは不可）の引数としてだけで、引用符なし、引用符の中、または $( ) の中に置けます。それ以外の場所（算術、[[ ]]、代入、リダイレクト、関数）に置くコマンドは拒否されます。コマンドの処理対象として渡す値は -- の後に置きます（git fetch origin -- {{ref}}）。こうすれば - で始まる値がオプションと見なされません。語をコードとして実行するコマンド（sh -c、ssh、xargs）は値をコードとして実行します。"
  ko: "명령에서 각 {{name}}은 하나의 단어로 전달되며 코드로 읽히지 않습니다. 이름을 그대로 쓴 명령(echo, printf, cd 또는 프로그램. 그 밖의 내장 명령은 안 됨)의 인수로만 둘 수 있으며, 따옴표 없이, 따옴표 안에, 또는 $( ) 안에 둘 수 있습니다. 그 밖의 곳(산술, [[ ]], 대입, 리디렉션, 함수)에 두는 명령은 거부됩니다. 명령이 처리할 대상으로 전달하는 값은 -- 뒤에 둡니다(git fetch origin -- {{ref}}). 그러면 -로 시작하는 값이 옵션으로 간주되지 않습니다. 단어를 코드로 실행하는 명령(sh -c, ssh, xargs)은 값을 코드로 실행합니다."
  pt-BR: "Em um comando, cada {{name}} é passado como uma palavra, nunca lido como código. Ele só pode aparecer como argumento de um comando de nome escrito por extenso (echo, printf, cd ou um programa, nenhum outro builtin), sem aspas, entre aspas ou dentro de $( ); um comando que coloque um em qualquer outro lugar (aritmética, [[ ]], uma atribuição, um redirecionamento, uma função) é recusado. Um passado a um comando como aquilo em que ele trabalha vai após -- (git fetch origin -- {{ref}}), para que um valor que começa com - não seja tomado por uma opção; e um comando que executa suas palavras como código (sh -c, ssh, xargs) executa um valor como código."
  ru: "В команде каждое {{name}} передаётся одним словом и никогда не читается как код. Оно может стоять только аргументом команды с явно написанным именем (echo, printf, cd или программа, но не другая встроенная команда), без кавычек, в кавычках или внутри $( ); команда, где оно стоит где-либо ещё (арифметика, [[ ]], присваивание, перенаправление, функция), отклоняется. Значение, которое команда обрабатывает, ставится после -- (git fetch origin -- {{ref}}), чтобы значение, начинающееся с -, не приняли за параметр; а команда, выполняющая свои слова как код (sh -c, ssh, xargs), выполнит значение как код."
  sv: "I ett kommando ges varje {{name}} som ett ord och läses aldrig som kod. Det får bara stå som argument till ett kommando vars namn är utskrivet (echo, printf, cd eller ett program, inget annat inbyggt kommando), utan citattecken, inom citattecken eller inom $( ); ett kommando som sätter ett någon annanstans (aritmetik, [[ ]], en tilldelning, en omdirigering, en funktion) avvisas. Ett som ges ett kommando som det det arbetar på står efter -- (git fetch origin -- {{ref}}), så att ett värde som börjar med - inte tas för ett alternativ; och ett kommando som kör sina ord som kod (sh -c, ssh, xargs) kör ett värde som kod."
