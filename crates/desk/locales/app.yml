"What the dark look is drawn in: Ghost's own, one it brings, or one of yours.":
  zh-CN: "深色外观所用的主题：Ghost 自带的、内置的或你自己的。"
  de: "Worin das dunkle Aussehen gezeichnet wird: das von Ghost, ein mitgeliefertes oder eines von Ihnen."
  es: "Con qué se dibuja el aspecto oscuro: el propio de Ghost, uno que trae, o uno tuyo."
  fr: "Le thème de l’apparence sombre : celui de Ghost, un thème fourni, ou un des vôtres."
  ja: "ダーク表示に使うテーマ：Ghost 標準、付属のもの、またはあなたのもの。"
  ko: "다크 모양에 사용할 테마: Ghost 자체 테마, 기본 제공 테마 또는 사용자 테마."
  pt-BR: "Com o que o visual escuro é desenhado: o do próprio Ghost, um que ele traz ou um seu."
  ru: "Чем отрисовывается тёмное оформление: собственной темой Ghost, встроенной или вашей."
  sv: "Vad det mörka utseendet ritas i: Ghosts eget, ett som följer med, eller ett av dina."
