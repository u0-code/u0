"Wrapped, they show whole; kept to a line, they are cut at the edge.":
  zh-CN: "换行时完整显示；保持单行时在边缘截断。"
  de: "Umgebrochen werden sie ganz angezeigt; auf eine Zeile beschränkt, werden sie am Rand abgeschnitten."
  es: "Ajustadas, se ven enteras; en una sola línea, se cortan en el borde."
  fr: "Renvoyées à la ligne, elles s’affichent en entier ; tenues sur une ligne, elles sont coupées au bord."
  ja: "折り返すと全体が表示され、1 行のままだと端で切れます。"
  ko: "줄을 바꾸면 전체가 표시되고, 한 줄로 유지하면 가장자리에서 잘립니다."
  pt-BR: "Com quebra, aparecem inteiras; mantidas em uma linha, são cortadas na borda."
  ru: "С переносом они видны целиком; в одну строку — обрезаются по краю."
  sv: "Radbrutna visas de hela; hållna på en rad kapas de vid kanten."
