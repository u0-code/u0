  de: "Es wirkt auf einen anderen Thread, daher gilt ein Ja nur für dieses Mal."
  es: "Actúa sobre otro hilo, así que aceptar vale solo esta vez."
  fr: "Cela agit sur un autre fil ; l’accord ne vaut donc que pour cette fois."
  ja: "別のスレッドに作用するため、許可は今回限りです。"
  ko: "다른 스레드에 동작하므로 허용은 이번 한 번만 적용됩니다."
  pt-BR: "Isso age em outra thread, então o sim vale só desta vez."
  ru: "Действие затрагивает другой тред, поэтому разрешение действует только один раз."
  sv: "Det påverkar en annan tråd, så ett ja gäller bara denna gång."
