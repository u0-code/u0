  sv: "Ghost får inte använda taligenkänning"
"Ghost runs %{name}'s own agent and shows its work here. Its account, models and billing stay with %{name}; Ghost never sees its sign-in.":
  zh-CN: "Ghost 运行 %{name} 自己的智能体，并在此显示它的工作。账户、模型和计费仍归 %{name}；Ghost 从不接触它的登录信息。"
  de: "Ghost führt den eigenen Agent von %{name} aus und zeigt seine Arbeit hier. Account, Modelle und Abrechnung bleiben bei %{name}; Ghost sieht die Anmeldung nie."
  es: "Ghost ejecuta el agente propio de %{name} y muestra su trabajo aquí. Su cuenta, modelos y facturación siguen en %{name}; Ghost nunca ve su inicio de sesión."
  fr: "Ghost exécute l’agent de %{name} et montre son travail ici. Son compte, ses modèles et sa facturation restent chez %{name} ; Ghost ne voit jamais sa connexion."
  ja: "Ghost は %{name} 独自のエージェントを実行し、その作業をここに表示します。アカウント、モデル、請求は %{name} のままで、Ghost がサインイン情報を見ることはありません。"
  ko: "Ghost는 %{name}의 자체 에이전트를 실행하고 그 작업을 여기에 표시합니다. 계정, 모델 및 요금은 %{name}에 남으며, Ghost는 로그인 정보를 볼 수 없습니다."
  pt-BR: "O Ghost executa o próprio agente de %{name} e mostra o trabalho dele aqui. A conta, os modelos e a cobrança continuam com %{name}; o Ghost nunca vê o login."
  ru: "Ghost запускает собственного агента %{name} и показывает его работу здесь. Учётная запись, модели и оплата остаются у %{name}; Ghost никогда не видит данные входа."
  sv: "Ghost kör %{name}s egen agent och visar dess arbete här. Dess konto, modeller och fakturering stannar hos %{name}; Ghost ser aldrig dess inloggning."
