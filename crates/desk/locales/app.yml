"Another instance is the agent run again with its own sign-in and settings, side by side with this one: a thread begun in it stays with it.":
  zh-CN: "另一个实例会以独立的登录和设置再运行一个该智能体，与当前的并存：在其中开始的线程会一直属于它。"
  de: "Eine weitere Instanz ist der Agent, erneut ausgeführt mit eigener Anmeldung und eigenen Einstellungen, neben dieser: Ein darin begonnener Thread bleibt dort."
  es: "Otra instancia es el agente ejecutado de nuevo con su propio inicio de sesión y ajustes, junto a este: un hilo iniciado en ella se queda con ella."
  fr: "Une autre instance est l’agent relancé avec sa propre connexion et ses propres réglages, à côté de celle-ci : un fil commencé dans l’une y reste."
  ja: "別のインスタンスでは、独自のサインインと設定でエージェントをもう 1 つ実行し、現在のものと並行して使えます。そこで開始したスレッドはそのインスタンスに属します。"
  ko: "다른 인스턴스는 이 인스턴스와 나란히 자체 로그인과 설정으로 에이전트를 다시 실행하는 것입니다. 거기서 시작한 스레드는 그 인스턴스에 남습니다."
  pt-BR: "Outra instância é o agente executado novamente com login e ajustes próprios, lado a lado com esta: uma thread iniciada nela permanece nela."
  ru: "Другой экземпляр — это тот же агент, запущенный снова со своим входом и настройками рядом с этим: начатый в нём тред остаётся в нём."
  sv: "En annan instans är agenten körd igen med egen inloggning och egna inställningar, sida vid sida med denna: en tråd som påbörjas i den stannar i den."
