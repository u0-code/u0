"A rule is { \"key\": \"cmd-shift-n\", \"action\": \"new_session\" }, with \"when\": \"Terminal\" (or \"Composer\", with !, && and ||) for where it holds, \"action\": \"none\" to take a key away, and \"-new_session\" to take it from that action alone; \"script:dev\" runs the script dev. The last rule that holds wins. u0 reads the file as it starts.":
  zh-CN: "一条规则形如 { \"key\": \"cmd-shift-n\", \"action\": \"new_session\" }，用 \"when\": \"Terminal\"（或 \"Composer\"，可用 !、&& 和 ||）指定生效位置，\"action\": \"none\" 移除一个按键，\"-new_session\" 只从该操作移除它；\"script:dev\" 运行脚本 dev。最后一条生效的规则优先。u0 在启动时读取此文件。"
  de: "Eine Regel ist { \"key\": \"cmd-shift-n\", \"action\": \"new_session\" }, mit \"when\": \"Terminal\" (oder \"Composer\", mit !, && und ||) für den Geltungsbereich, \"action\": \"none\", um eine Taste zu entfernen, und \"-new_session\", um sie nur dieser Aktion zu entziehen; \"script:dev\" führt das Skript dev aus. Die letzte zutreffende Regel gewinnt. u0 liest die Datei beim Start."
  es: "Una regla es { \"key\": \"cmd-shift-n\", \"action\": \"new_session\" }, con \"when\": \"Terminal\" (o \"Composer\", con !, && y ||) para indicar dónde aplica, \"action\": \"none\" para quitar una tecla, y \"-new_session\" para quitarla solo de esa acción; \"script:dev\" ejecuta el script dev. Gana la última regla que aplica. u0 lee el archivo al iniciarse."
  fr: "Une règle s’écrit { \"key\": \"cmd-shift-n\", \"action\": \"new_session\" }, avec \"when\": \"Terminal\" (ou \"Composer\", avec !, && et ||) pour l’endroit où elle s’applique, \"action\": \"none\" pour retirer une touche, et \"-new_session\" pour la retirer de cette seule action ; \"script:dev\" exécute le script dev. La dernière règle qui s’applique l’emporte. u0 lit le fichier au démarrage."
  ja: "ルールは { \"key\": \"cmd-shift-n\", \"action\": \"new_session\" } の形式です。\"when\": \"Terminal\"（または \"Composer\"、!、&&、|| も使用可）で有効な場所を指定し、\"action\": \"none\" でキーを外し、\"-new_session\" でその操作からのみ外します。\"script:dev\" はスクリプト dev を実行します。最後に有効なルールが優先されます。u0 は起動時にこのファイルを読み込みます。"
  ko: "규칙은 { \"key\": \"cmd-shift-n\", \"action\": \"new_session\" } 형식이며, 적용 위치는 \"when\": \"Terminal\"(또는 !, &&, ||를 쓴 \"Composer\"), 키를 해제하려면 \"action\": \"none\", 해당 동작에서만 해제하려면 \"-new_session\"을 씁니다. \"script:dev\"는 dev 스크립트를 실행합니다. 마지막으로 적용되는 규칙이 우선합니다. u0는 시작할 때 파일을 읽습니다."
  pt-BR: "Uma regra é { \"key\": \"cmd-shift-n\", \"action\": \"new_session\" }, com \"when\": \"Terminal\" (ou \"Composer\", com !, && e ||) para onde ela vale, \"action\": \"none\" para remover uma tecla e \"-new_session\" para removê-la apenas dessa ação; \"script:dev\" executa o script dev. A última regra que vale prevalece. O u0 lê o arquivo ao iniciar."
  ru: "Правило выглядит так: { \"key\": \"cmd-shift-n\", \"action\": \"new_session\" }, с \"when\": \"Terminal\" (или \"Composer\", с !, && и ||) — где оно действует, \"action\": \"none\" — чтобы отключить клавишу, и \"-new_session\" — чтобы отключить её только для этого действия; \"script:dev\" запускает скрипт dev. Побеждает последнее подходящее правило. u0 читает файл при запуске."
  sv: "En regel är { \"key\": \"cmd-shift-n\", \"action\": \"new_session\" }, med \"when\": \"Terminal\" (eller \"Composer\", med !, && och ||) för var den gäller, \"action\": \"none\" för att ta bort en tangent och \"-new_session\" för att ta den från bara den åtgärden; \"script:dev\" kör skriptet dev. Den sista regeln som gäller vinner. u0 läser filen när den startar."
