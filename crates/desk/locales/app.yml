  ko: "라이트 모양에 사용할 테마."
  pt-BR: "Com o que o visual claro é desenhado."
  ru: "Чем отрисовывается светлое оформление."
  sv: "Vad det ljusa utseendet ritas i."
"What the run begins with: Return starts it.":
  zh-CN: "运行开始时的输入：按 Return 开始。"
  de: "Womit der Lauf beginnt: Return startet ihn."
  es: "Con qué empieza la ejecución: Return la inicia."
  fr: "Ce par quoi l’exécution commence : Retour la démarre."
  ja: "実行の最初の入力：Return で開始します。"
  ko: "실행을 시작할 내용: Return을 누르면 시작합니다."
  pt-BR: "Com o que a execução começa: Return a inicia."
  ru: "С чего начинается запуск: Return запускает."
  sv: "Vad körningen börjar med: Retur startar den."
"What the server these settings are of tells the people who make Ghost, as far as you let it.":
  zh-CN: "这些设置所属的服务器在你允许的范围内向 Ghost 的开发者发送的内容。"
  de: "Was der Server, zu dem diese Einstellungen gehören, den Entwicklern von Ghost mitteilt, soweit Sie es erlauben."
  es: "Lo que el servidor de estos ajustes cuenta a quienes hacen Ghost, hasta donde lo permitas."
  fr: "Ce que le serveur de ces réglages transmet aux créateurs de Ghost, dans la mesure où vous le permettez."
  ja: "これらの設定のサーバが、許可した範囲で Ghost の開発元に送信する内容。"
  ko: "이 설정의 서버가 Ghost 개발자에게 보내는 정보(사용자가 허용한 범위까지)."
  pt-BR: "O que o servidor destes ajustes informa a quem faz o Ghost, até onde você permitir."
  ru: "Что сервер, к которому относятся эти настройки, сообщает разработчикам Ghost — в пределах вашего разрешения."
  sv: "Vad servern som de här inställningarna tillhör berättar för dem som gör Ghost, så långt du tillåter."
