[package]
name = "ghostd"
description = "The Ghost daemon: runs one ghost, hosts the Ghost Protocol."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "ghostd"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
ghost-brain = { version = "0.0.1", path = "../ghost-brain" }
ghost-core = { path = "../ghost-core" }
ghost-link = { version = "0.0.1", path = "../ghost-link" }
ghost-mind = { version = "0.0.1", path = "../ghost-mind" }
ghost-protocol = { version = "0.0.1", path = "../ghost-protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time", "net", "sync"] }
tokio-tungstenite = "0.30.0"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true
