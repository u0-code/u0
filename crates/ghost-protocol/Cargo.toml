[package]
name = "ghost-protocol"
description = "The Ghost Protocol: wire types shared by the daemon and everything that connects to it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# An entry of her journal is ordered and compared by when it was written.
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints]
workspace = true
