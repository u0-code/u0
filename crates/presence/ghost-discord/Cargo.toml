[package]
name = "ghost-discord"
description = "Carries a ghost on Discord as a bot."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15"
ghost-link = { path = "../../ghost-link" }
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "http", "builder", "native_tls_backend"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true
