[package]
name = "ghost-qqbot"
description = "Carries a ghost on QQ through Tencent's official QQ Bot API."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
ghost-link = { path = "../../ghost-link" }
ghost-net = { path = "../../ghost-net" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util"] }

[lints]
workspace = true
