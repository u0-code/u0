[package]
name = "ghost-net"
description = "How every HTTP request a Ghost program makes leaves the machine: one proxy setting, one place that builds clients, one that starts programs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["process", "io-util", "macros"] }
tracing = "0.1.44"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["process"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["net", "io-util", "macros", "rt"] }

[lints]
workspace = true
