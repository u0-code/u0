[package]
name = "ghost-mind"
description = "The part of Ghost that lives: attention, deliberation, speaking, a day, reaching out."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ghost-core = { path = "../ghost-core" }
ghost-brain = { path = "../ghost-brain" }
ghost-net = { version = "0.0.1", path = "../ghost-net" }
ghost-work = { version = "0.0.1", path = "../ghost-work" }
async-trait = "0.1.92"
thiserror = "2.0.21"
tracing = "0.1.44"
fastrand = "2.5.0"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }

[lints]
workspace = true

[dev-dependencies]
# Only to read what she answers a console as the wire type a console reads.
ghost-protocol = { path = "../ghost-protocol" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "test-util", "net", "io-util"] }
