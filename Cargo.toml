# Two crates: `ghost-core`, everything that touches the machine (agents over
# ACP, the registry, git, the store, sessions, a terminal's process), which
# builds without GPUI so that it can run headless; and `ghost-desk`, the app
# that draws it.
[workspace]
members = ["crates/core", "crates/desk"]
resolver = "3"

[workspace.package]
version = "0.1.0-pre.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/u0-code/u0"
rust-version = "1.98"
publish = false

[workspace.dependencies]
ghost-core = { path = "crates/core" }
# The interface: gpui-kit, on GPUI Fast (longbridge/gpui-fast), the fork of
# Zed's gpui that takes changes for use outside Zed.
gpui = { package = "gpui-kit", version = "=0.11.0", default-features = false, features = ["component", "assets", "syntect", "speech", "gpui-fast"] }
# The protocol: its connection and its types (the schema it pins). What goes
# over the wire to an agent is defined there, never again here.
agent-client-protocol = { version = "=5.6.0", features = ["unstable_session_fork", "unstable_end_turn_token_usage"] }
# Ghost's tools, given to an agent: the official MCP SDK, one server
# spoken over a stream (`server/tools`).
rmcp = { version = "3.11", default-features = false, features = ["server", "macros"] }
anyhow = "1.0.104"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
libc = "0.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "io-std", "net", "signal"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# The log Ghost keeps in its home, a file a day.
tracing-appender = "0.2"
unicode-segmentation = "1"
portable-pty = "0.9"
vt100 = "0.18"
vte = "0.15"
base64 = "0.22"
unicode-width = "0.2"
shell-words = "1.1"
url = "2.5"
percent-encoding = "2.3"
# A file's MIME type by its name: a picture attached, a file in the viewer.
mime_guess = { version = "2.0.5", default-features = false }
# A program on the PATH, as the shell finds it: executable, first in order.
which = "8"
# A file found by what is typed (⌘P, @, the Files tab): Helix's matcher.
nucleo-matcher = "0.3"
# JSON with comments and trailing commas, as VS Code writes a theme.
jsonc-parser = { version = "0.34", features = ["serde"] }
# The processes Ghost runs, their CPU and memory; this machine's load: Diagnostics.
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
similar = { version = "2.7", default-features = false, features = ["text"] }
jiff = "1.0.2"
# The system's language, for telemetry at its most detailed: gpui-kit's
# dependency already.
sys-locale = "0.3"
# The desk's words in your language: gpui-kit's own i18n, so one locale
# is set for both.
rust-i18n = "4.2"
tempfile = "3.27"
# What Markdown shows as a picture, drawn natively as SVG: a formula set
# by RaTeX (KaTeX in Rust, its glyphs as outlines), a Mermaid diagram by
# mermaid-rs-renderer.
ratex-parser = { version = "0.1.16", default-features = false }
ratex-layout = { version = "0.1.16", default-features = false }
ratex-types = "0.1.16"
ratex-svg = { version = "0.1.16", default-features = false, features = ["embed-fonts"] }
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
# A PDF's pages, drawn in Rust: the Files tab's viewer.
hayro = "0.9"
# The one HTTP client: the registry and its archives, the forges' APIs, the
# updater. TLS is rustls with ring, as the rest of the build has it, and
# certificates are checked as the system checks them.
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider", "platform-verifier", "gzip"] }
# Which release of Ghost is newer: the updater.
semver = "1.0"
# The commit a build is made from, stamped in by git's command line.
vergen-gitcl = "10.1"
# The macOS Keychain, where secrets are kept: the crate rustls already
# brings into the tree.
security-framework = "3.7"
# Ghost reached from another machine: a WebSocket on 127.0.0.1, behind a
# tunnel that brings its own TLS; the desk's end speaks TLS to that tunnel
# (rustls, with ring, as the rest of the build has it).
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# A desk's key: signed and verified with ring (the TLS provider already, and
# the randomness for keys and pairing codes); written, read and
# fingerprinted as OpenSSH does by RustCrypto's ssh-key.
ring = "0.17"
ssh-key = { version = "0.6.7", default-features = false, features = ["alloc"] }
qrcode = { version = "0.14", default-features = false }
cocoa = "0.26"
# Text read aloud on this Mac (AVFAudio's speech synthesizer).
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVSpeechSynthesis"] }
objc = "0.2"

[workspace.lints.rust]
# objc's msg_send! (macOS dictation, `macos::dictate`) checks this feature.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
# ghost-core is a library for the desk alone, not a published API: what
# panics there is a bug, not a promise to document.
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
# A function takes what it needs as parameters, however many: none are
# bundled into a tuple or a struct only to get under a count.
too_many_arguments = "allow"
match_same_arms = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# Colours read as the six hex digits a designer writes, not as a u32.
unusual_byte_groupings = "allow"

# Stripped, and nothing more: that is two thirds of what the main
# workspace's profile saves here (11.2 to 9.3 MB, against 8.3), and a
# rebuild after a change to one file stays at about 11 seconds rather than
# 35, which matters while the app is changed and bundled many times a day.
[profile.release]
strip = true

# Temporary, until gpui-kit releases them: a soft break between Chinese,
# Japanese or Korean characters joins without a space
# (https://github.com/longbridge/gpui-kit/pull/4123), a key hint can be a
# label rather than one keystroke (https://github.com/longbridge/gpui-kit/pull/4124),
# Shift+F10 opens a context menu, a tree's selected row's too
# (https://github.com/longbridge/gpui-kit/pull/4133), a tree's row menu
# can hold submenus (https://github.com/longbridge/gpui-kit/pull/4134), a
# tab bar's tabs have a context menu each
# (https://github.com/longbridge/gpui-kit/pull/4138), and a diff file's lines
# can be read (https://github.com/longbridge/gpui-kit/pull/4139), speech
# recognition favours words given it
# (https://github.com/longbridge/gpui-kit/pull/4143) and lists the
# languages it hears (https://github.com/longbridge/gpui-kit/pull/4144),
# the settings can be opened at a page and searched from outside, their
# pages under headings (https://github.com/longbridge/gpui-kit/pull/4145,
# https://github.com/longbridge/gpui-kit/pull/4146), an input underlines
# the words its spell checker does not know and offers corrections
# (https://github.com/longbridge/gpui-kit/pull/4156), and the theme
# registry says which file each theme came from and which did not load
# (https://github.com/longbridge/gpui-kit/pull/4147).
# The branch is v0.11.0 with those commits, as their pull requests have
# them, among others; back to crates.io once they are released.
[patch.crates-io]
gpui-kit = { git = "https://github.com/mizorewww/gpui-kit", branch = "combined-cjk-kbd-menus-tab-diff-speech-settings" }
gpui-base = { git = "https://github.com/mizorewww/gpui-kit", branch = "combined-cjk-kbd-menus-tab-diff-speech-settings" }
gpui-component = { git = "https://github.com/mizorewww/gpui-kit", branch = "combined-cjk-kbd-menus-tab-diff-speech-settings" }
gpui-component-macros = { git = "https://github.com/mizorewww/gpui-kit", branch = "combined-cjk-kbd-menus-tab-diff-speech-settings" }
gpui-kit-assets = { git = "https://github.com/mizorewww/gpui-kit", branch = "combined-cjk-kbd-menus-tab-diff-speech-settings" }
# Features of gpui that GPUI Fast, which takes only performance work and
# bug fixes, will not: a window's contents drawn zoomed (Window::set_zoom),
# so the whole interface scales, and the system's spell checker
# (App::misspelled_words, spelling_guesses, learn_spelling), which the
# composer's input asks. Written as GPUI Fast's own changes are, on
# mizorewww/gpui-fast's `ghost` branch; `ghost-release` is its crates, built
# as GPUI Fast 0.1.19 is released.
gpui-fast = { git = "https://github.com/mizorewww/gpui-fast", branch = "ghost-release" }
gpui-fast-platform = { git = "https://github.com/mizorewww/gpui-fast", branch = "ghost-release" }
gpui-fast-scheduler = { git = "https://github.com/mizorewww/gpui-fast", branch = "ghost-release" }
gpui-fast-web = { git = "https://github.com/mizorewww/gpui-fast", branch = "ghost-release" }
gpui-fast-wgpu = { git = "https://github.com/mizorewww/gpui-fast", branch = "ghost-release" }
