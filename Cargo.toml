[workspace]
resolver = "3"
# The desktop app is its own workspace: GPUI is a large, macOS-first tree.
exclude = ["desk"]
members = [
    "crates/ghost-core",
    "crates/ghost-net",
    "crates/ghost-brain",
    "crates/ghost-work",
    "crates/ghost-mind",
    "crates/ghost-protocol",
    "crates/ghost-link",
    "crates/ghostd",
    "crates/presence/ghost-term",
    "crates/presence/ghost-telegram",
    "crates/presence/ghost-discord",
    "crates/presence/ghost-onebot",
    "crates/presence/ghost-qqbot",
    "crates/presence/ghost-x",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/HappyFox001/Ghost"
rust-version = "1.89"
# Nothing here is on crates.io. A ghost is run from a checkout or a release.
publish = false

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
# Tables and event folds read better whole than split to satisfy a line count.
too_many_lines = "allow"
match_same_arms = "allow"
format_push_string = "allow"
trivially_copy_pass_by_ref = "allow"
# Adapters mirror the field names of the platforms they talk to.
struct_field_names = "allow"

# One codegen unit makes the binaries about a sixth smaller (ghostd 21.3 to
# 17.9 MB) for about forty seconds more on a rebuild of ghostd. Fat LTO
# takes off another 5% and makes that rebuild three times as long. Panics
# unwind: ghostd restarts a character's mind that panics, so `panic =
# "abort"` is not an option.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
