[package]
name = "ghost-desk"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
description = "Ghost: one desktop app for the coding agents you already use (Claude Code, Codex, Antigravity, ...), driven over the Agent Client Protocol."
repository = "https://github.com/HappyFox001/Ghost"
rust-version = "1.94"
publish = false

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }
# The protocol's own types: what goes over the wire to an agent is defined
# there, never again here. No JSON Schema is needed at run time.
agent-client-protocol-schema = { version = "1.22", default-features = false, features = ["unstable_session_fork"] }
anyhow = "1.0.104"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
libc = "0.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-segmentation = "1"

# To give the running app its icon in the Dock, and begin dictation: AppKit,
# by way of the same crates GPUI uses for it.
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[lints.rust]
# objc's msg_send! (macOS dictation, `icon::dictate`) checks this feature.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
match_same_arms = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# Colours read as the six hex digits a designer writes, not as a u32.
unusual_byte_groupings = "allow"

# Stripped, and nothing more: that is two thirds of what the main
# workspace's profile saves here (11.2 to 9.3 MB, against 8.3), and a
# rebuild after a change to one file stays at about 11 seconds rather than
# 35, which matters while the app is changed and bundled many times a day.
[profile.release]
strip = true
